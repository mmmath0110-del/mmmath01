<title>더블엠 문제풀이 근무표</title>
<style>
  :root{--paper:#F5F6F9;--sheet:#FFFFFF;--ink:#16213A;--ink-2:#5A6379;--rule:#D8DDE6;--cobalt:#2A4BB8;--cobalt-ink:#FFFFFF;--today:#E09A2E;--today-soft:#FBF1DF}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0E1220;--sheet:#171D2E;--ink:#E5E9F2;--ink-2:#A9B1C4;--rule:#2B3346;--cobalt:#8AA0F5;--cobalt-ink:#0E1220;--today:#F0B657;--today-soft:#332913}}
  :root[data-theme="dark"]{--paper:#0E1220;--sheet:#171D2E;--ink:#E5E9F2;--ink-2:#A9B1C4;--rule:#2B3346;--cobalt:#8AA0F5;--cobalt-ink:#0E1220;--today:#F0B657;--today-soft:#332913}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px}
  .card{background:var(--sheet);border:1px solid var(--rule);border-left:5px solid var(--today);border-radius:12px;padding:26px 28px;max-width:520px;width:100%}
  h1{margin:0 0 6px;font-size:19px}
  p{margin:8px 0;color:var(--ink-2)}
  .url{display:block;margin:14px 0;padding:12px 14px;background:var(--today-soft);border-radius:8px;font-family:ui-monospace,monospace;word-break:break-all;color:var(--ink)}
  a.btn{display:inline-block;background:var(--cobalt);color:var(--cobalt-ink);text-decoration:none;padding:11px 18px;border-radius:8px;font-weight:700}
</style>
