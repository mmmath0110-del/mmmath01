<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>주간 학습 리포트 · 더블엠수학학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --sheet:#FFFFFF; --soft:#F4F5F9; --ink:#1E2433; --ink-2:#5A6379; --ink-3:#9AA3B5; --rule:#DDE1EA; --rule-2:#ECEEF4;
    --brand:#4453A6; --brand-2:#6C79C2; --brand-soft:#E9EBF7; --bar:#8F9BCB; --bar-soft:#D9DDF0;
    --good:#2F9E5B; --good-soft:#E3F5E8; --warn:#D9822B; --warn-soft:#FDEFD9; --bad:#D9443C; --bad-soft:#FBE4E2;
    --lv0:#CDD1DA; --lv1:#9CD16F; --lv2:#FFB55E; --lv3:#FF7C7C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1320; --sheet:#171C2C; --soft:#1C2235; --ink:#E6E9F2; --ink-2:#AEB5C7; --ink-3:#717A8F; --rule:#2B3348; --rule-2:#232A3D;
      --brand:#9AA8F0; --brand-2:#B4BFF5; --brand-soft:#232B4A; --bar:#7381C2; --bar-soft:#2C3456;
      --good:#6BCB8F; --good-soft:#173324; --warn:#F2A85A; --warn-soft:#3A2A14; --bad:#F2827B; --bad-soft:#3A1F1E;
      --lv0:#5B6274; --lv1:#7DB357; --lv2:#E39A45; --lv3:#E46767;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1320; --sheet:#171C2C; --soft:#1C2235; --ink:#E6E9F2; --ink-2:#AEB5C7; --ink-3:#717A8F; --rule:#2B3348; --rule-2:#232A3D;
    --brand:#9AA8F0; --brand-2:#B4BFF5; --brand-soft:#232B4A; --bar:#7381C2; --bar-soft:#2C3456;
    --good:#6BCB8F; --good-soft:#173324; --warn:#F2A85A; --warn-soft:#3A2A14; --bad:#F2827B; --bad-soft:#3A1F1E;
    --lv0:#5B6274; --lv1:#7DB357; --lv2:#E39A45; --lv3:#E46767;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 48px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tools .sp{flex:1}
  .btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 12px;font-size:13.5px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
  .who b{font-size:22px} .who span{color:var(--ink-2);font-size:14px}
  .page{margin-bottom:34px}
  .band{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px 18px;border:1px solid var(--rule);border-radius:16px;
    background:linear-gradient(100deg,var(--brand-soft) 0%,var(--brand-soft) 38%,transparent 39%),linear-gradient(90deg,var(--brand-soft),var(--sheet));margin-bottom:18px}
  .band .ic{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(68,83,166,.3)}
  .band .ic svg{width:20px;height:20px}
  .band h2{margin:0;font-size:24px;color:var(--brand);letter-spacing:-.3px}
  .band .acad{margin-left:auto;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
  .band .tag{border:1px solid var(--brand);color:var(--brand);border-radius:8px;padding:1px 10px;font-weight:700;font-size:15px}
  .pill{display:inline-flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;padding:8px 18px;margin:18px 0 10px}
  .pill::before{content:"";width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--brand-2),var(--brand))}
  .pill h3{margin:0;font-size:18px;color:var(--brand)}
  .pill .sub{font-size:13px;color:var(--ink-2)}
  .lead{margin:0 0 12px 6px;color:var(--ink-2);font-size:15.5px}
  .lead b{color:var(--ink)}
  .box{background:var(--soft);border-radius:16px;padding:20px 22px}
  .comment{white-space:pre-wrap;font-size:15.5px;line-height:1.85}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{border:1px solid var(--rule);border-radius:14px;padding:16px 10px;text-align:center;background:var(--sheet)}
  .kpi .l{color:var(--ink-2);font-size:14px}
  .kpi .v{color:var(--brand);font-size:30px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:16px;margin-left:2px}
  .kpi .chip{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:0 9px;font-size:11.5px;color:var(--ink-2);margin-top:4px}
  .kpi .d{font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums} .kpi .d.up{color:var(--good)} .kpi .d.dn{color:var(--bad)}
  .two{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
  .gauges{display:flex;gap:12px;flex-wrap:wrap}
  .gauge{background:var(--sheet);border-radius:12px;padding:12px 16px;text-align:center;min-width:180px;flex:1}
  .gauge .t{font-size:14.5px;margin-bottom:2px}
  .tagl{display:inline-block;border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px;margin:4px 0 6px}
  .tagl.good{background:var(--good-soft);color:var(--good)} .tagl.warn{background:var(--warn-soft);color:var(--warn)}
  ul.dots{margin:0 0 8px;padding-left:18px} ul.dots li{margin:3px 0} ul.dots.g li::marker{color:var(--good)} ul.dots.w li::marker{color:var(--warn)}
  .legend{display:flex;gap:14px;justify-content:flex-end;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  svg text{font-family:inherit}
  .cal{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
  .cal th{background:var(--brand-soft);padding:7px 0;font-weight:500}
  .cal th:nth-child(6){color:#3B82F6} .cal th:nth-child(7){color:var(--bad)}
  .cal td{border:1px solid var(--rule-2);vertical-align:top;height:86px;padding:5px 6px;background:var(--soft)}
  .cal td.out{background:var(--sheet);color:var(--ink-3)}
  .cal td .dn{font-size:13px;color:var(--ink-2)} .cal td.sat .dn{color:#3B82F6} .cal td.sun .dn{color:var(--bad)}
  .cal td .mo{float:right;background:#2563EB;color:#fff;border-radius:5px;font-size:10.5px;padding:0 5px}
  .cal .ev{display:block;border-radius:5px;padding:1px 5px;margin-top:3px;font-size:11.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev.att{background:var(--good-soft);color:var(--good)} .ev.late{background:var(--warn-soft);color:var(--warn)} .ev.abs{background:var(--bad-soft);color:var(--bad)}
  .ev.test{background:var(--brand-soft);color:var(--brand)}
  .ut{width:100%;border-collapse:collapse;font-size:14px}
  .ut th{background:var(--brand-soft);font-weight:500;padding:10px 8px}
  .ut td{border-bottom:1px solid var(--rule);padding:10px 8px;vertical-align:middle}
  .ut .bars div{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 44px;gap:10px;align-items:center;margin:4px 0}
  .ut .bars span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{height:10px;border-radius:999px;background:var(--rule-2);position:relative}
  .track b{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--bar)}
  .track b::after{content:"";position:absolute;right:-1px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--sheet);border:2px solid var(--bar)}
  .pct{text-align:right;font-variant-numeric:tabular-nums}
  .course{display:inline-block;background:var(--brand);color:#fff;border-radius:8px;padding:3px 12px;font-weight:700;margin:6px 0 8px}
  .dom{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin-bottom:14px}
  .dom .ic{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;text-align:center;line-height:1.25}
  .dom .h{display:flex;justify-content:space-between;align-items:center}
  .badge{border:1px solid currentColor;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700}
  .badge.good{color:var(--good)} .badge.mid{color:#3B82F6} .badge.bad{color:var(--warn)}
  .dom .rate{font-size:18px;font-weight:700} .dom p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .types h4{margin:6px 0 8px;padding-left:8px;border-left:3px solid var(--brand);color:var(--brand);font-size:16px;font-weight:500}
  .types .path{font-size:12.5px;color:var(--ink-2);margin-top:8px}
  .types ul{margin:4px 0 0;padding:0;list-style:none} .types li{padding:6px 2px 6px 16px;border-bottom:1px dashed var(--rule);position:relative}
  .types li::before{content:"";position:absolute;left:4px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
  .types li .r{float:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .lvchips{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);justify-content:flex-end;margin-top:6px}
  .lvchips i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .empty{color:var(--ink-3);padding:18px;text-align:center}
  .note{font-size:12.5px;color:var(--ink-3)}
  .msg{max-width:520px;margin:80px auto;text-align:center;color:var(--ink-2)}
  .jump{position:sticky;top:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap;background:var(--paper);padding:8px 0 10px;border-bottom:1px solid var(--rule);margin-bottom:16px}
  .jump a{border:1px solid var(--rule);border-radius:999px;padding:2px 12px;font-size:13.5px;color:var(--brand);text-decoration:none;background:var(--sheet)}
  .stu+.stu{border-top:3px dashed var(--rule);padding-top:26px;margin-top:10px}
  @media (max-width:720px){
    .kpis{grid-template-columns:repeat(2,1fr)} .two,.types{grid-template-columns:1fr}
    .band h2{font-size:20px} .band .acad{display:none} .kpi .v{font-size:26px}
    .cal td{height:70px;padding:3px} .cal .ev{font-size:10.5px;padding:0 3px}
    .ut .bars div{grid-template-columns:minmax(0,1fr) 70px 38px}
  }
  @media print{
    body{background:#fff} .tools{display:none} .wrap{max-width:none;padding:0}
    .page{break-before:page;margin:0} .stu>.page:first-child{break-before:auto} .stu+.stu{break-before:page;border:0;padding:0;margin:0} .jump{display:none}
    .box,.kpi,.gauge,.cal td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .band,.pill,.cal th,.ut th,.course,.ev,.tagl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tools" id="tools" hidden>
    <button class="btn" id="prev" aria-label="지난 주">◀ 지난 주</button>
    <button class="btn" id="next" aria-label="다음 주">다음 주 ▶</button>
    <span class="sp"></span>
    <button class="btn primary" id="print">인쇄 · PDF 저장</button>
  </div>
  <div id="out"><div class="msg">리포트를 불러오는 중…</div></div>
</div>
<script src="config.js"></script>
<script src="units.js"></script>
<script>
(function () {
  'use strict';
  const API_URL = (window.MM_API_URL || '').trim();
  const qs = new URLSearchParams(location.search), T = (qs.get('t') || '').toLowerCase(), SID = qs.get('s') || '';
  let W = qs.get('w') || '';
  const $ = s => document.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r1 = v => Math.round(v * 10) / 10, ri = v => Math.round(v);
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
  const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const addDays = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return dkey(d); };
  const md = k => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
  const ICON = {
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V4M4 20h16M9 16v-5M13 16V8M17 16v-3"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  };

  async function api(action, payload) {
    if (!API_URL) throw new Error('서버 주소가 설정되지 않았습니다.');
    let res;
    try { res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) }); }
    catch { throw new Error('인터넷 연결을 확인하고 다시 열어 주세요.'); }
    let out; try { out = await res.json(); } catch { throw new Error('잠시 뒤 다시 열어 주세요. (서버 응답 오류)'); }
    if (!out.ok) throw new Error(out.message || '불러오지 못했습니다.');
    return out.data;
  }
  function staffToken() { try { const s = JSON.parse(localStorage.getItem('mm-tutor-web-session') || 'null'); return s && s.token || ''; } catch { return ''; } }
  async function load() {
    $('#out').innerHTML = '<div class="msg">리포트를 불러오는 중…</div>';
    try {
      let D;
      if (T) { if (!/^[0-9a-f]{40}$/.test(T)) throw new Error('링크가 올바르지 않습니다. 학원에서 받은 링크를 그대로 열어 주세요.'); D = await api('pubReport', { t: T, w: W }); }
      else if (SID) {
        const tk = staffToken(); if (!tk) throw new Error('학원관리에 로그인한 뒤 다시 열어 주세요.');
        const ids = SID.split(',').map(x => x.trim()).filter(Boolean).slice(0, 60);
        if (ids.length > 1) {   // 여러 학생: 한 화면에 이어서 (인쇄하면 학생마다 새 쪽)
          const out = new Array(ids.length); let done = 0, next = 0;
          const work = async () => { while (next < ids.length) { const i = next++; try { out[i] = await api('reportView', { token: tk, studentId: ids[i], weekEnd: W }); } catch (ex) { out[i] = { err: ex.message || String(ex), id: ids[i] }; } done++; $('#out').innerHTML = `<div class="msg">리포트를 불러오는 중… ${done}/${ids.length}명</div>`; } };
          await Promise.all([work(), work(), work()]);
          const okList = out.filter(x => !x.err); if (!okList.length) throw new Error(out[0].err);
          W = okList[0].week.end;
          $('#out').innerHTML = `<nav class="jump" aria-label="학생 바로가기">${out.map((x, i) => x.err ? '' : `<a href="#stu${i}">${esc(x.student.name)}</a>`).join('')}</nav>`
            + out.map((x, i) => x.err ? `<div class="stu" id="stu${i}"><p class="empty">불러오지 못했습니다: ${esc(x.err)}</p></div>` : `<div class="stu" id="stu${i}">${render(x)}</div>`).join('');
          $('#tools').hidden = false;
          document.title = `주간 학습 리포트 ${okList.length}명 (${md(okList[0].week.start)}~${md(okList[0].week.end)}) · ${okList[0].academy}`;
          return;
        }
        D = await api('reportView', { token: tk, studentId: ids[0], weekEnd: W });
      }
      else throw new Error('링크가 올바르지 않습니다.');
      W = D.week.end; $('#out').innerHTML = `<div class="stu">${render(D)}</div>`;
      $('#tools').hidden = false; $('#prev').hidden = $('#next').hidden = !!D.pub;
      document.title = `${D.student.name} 주간 학습 리포트 (${md(D.week.start)}~${md(D.week.end)}) · ${D.academy}`;
    } catch (ex) { $('#out').innerHTML = `<div class="msg">${esc(ex.message || ex)}</div>`; }
  }
  $('#prev').onclick = () => { W = addDays(W, -7); history.replaceState(null, '', setW(W)); load(); };
  $('#next').onclick = () => { W = addDays(W, 7); history.replaceState(null, '', setW(W)); load(); };
  $('#print').onclick = () => window.print();
  const setW = w => { const p = new URLSearchParams(location.search); p.set('w', w); return '?' + p.toString(); };

  // ---------- 단원 이름 → 교육과정 경로 (학원 시험 문항의 단원은 이름만 있으므로) ----------
  const CUR = window.MM_CURRICULUM || [], UIDX = new Map();
  const nName = n => Array.isArray(n) ? n[0] : n, nKids = n => Array.isArray(n) ? n[1] || [] : [];
  CUR.forEach(c => { const walk = (nodes, path) => nodes.forEach(n => { const p = [...path, nName(n)]; (UIDX.get(nName(n)) || UIDX.set(nName(n), []).get(nName(n))).push({ c, p }); walk(nKids(n), p); }); walk(c.units || [], [c.label]); });
  function unitPath(name, grade) {
    const hits = UIDX.get(String(name || '').trim()) || [];
    if (!hits.length) return name ? ['기타', name] : null;
    const lv = /^초/.test(grade) ? '초등' : /^중/.test(grade) ? '중등' : '고등';
    const best = hits.find(h => h.c.level === lv && h.c.rev === '22') || hits.find(h => h.c.level === lv) || hits[0];
    return best.p;
  }

  // ---------- 그리기 ----------
  function render(D) {
    const S = D.student, nm = esc(S.name), wk = D.week, lv = S.grade;
    // 테스트 한 건 = {date, name, pct, avgPct, src}
    const tests = [
      ...D.lessons.filter(x => x.score != null).map(x => ({ date: x.date, name: x.test || '수업 테스트', pct: x.pct, avgPct: x.classAvgPct, src: 'lesson', paths: x.paths || [] })),
      ...D.exams.map(x => ({ date: x.date, name: x.name, pct: x.max ? r1(x.score / x.max * 100) : null, avgPct: x.classAvg != null && x.max ? r1(x.classAvg / x.max * 100) : null, src: 'exam' })),
    ].filter(x => x.pct != null).sort((a, b) => a.date < b.date ? -1 : 1);
    const weeks = Array.from({ length: 6 }, (_, i) => { const end = addDays(wk.end, -7 * (5 - i)), start = addDays(end, -6); const d = new Date(end + 'T00:00:00');
      return { start, end, label: `${d.getMonth() + 1}월 ${Math.ceil(d.getDate() / 7)}주차` }; });
    weeks.forEach(w => { const t = tests.filter(x => x.date >= w.start && x.date <= w.end); w.n = t.length; w.avg = t.length ? r1(mean(t.map(x => x.pct))) : null; const a = t.filter(x => x.avgPct != null); w.cls = a.length ? r1(mean(a.map(x => x.avgPct))) : null; w.mine = a.length ? r1(mean(a.map(x => x.pct))) : null; });
    const cur = weeks[5], prev = weeks[4];
    const hwThis = D.lessons.filter(x => x.date >= wk.start && x.hw), hwPrev = D.lessons.filter(x => x.date >= prev.start && x.date <= prev.end && x.hw);
    const hwRate = a => a.length ? ri(a.filter(x => x.hw === '완료').length / a.length * 100) : null;

  // ---------- 차트 ----------
  function gauge(v) {   // 반원 게이지

  }

    return `<svg viewBox="0 0 80 80" width="92" role="img" aria-label="${ri(v)}%"><circle cx="40" cy="40" r="30" fill="none" stroke="var(--rule)" stroke-width="9"/><circle cx="40" cy="40" r="30" fill="none" stroke="var(--bar)" stroke-width="9" stroke-dasharray="${f.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${ri(v)}%</text></svg>`;
  }
  function weekChart(W) {   // 막대 = 테스트 수(숫자로 표시) · 선 = 평균 점수 % · 점선 = 반 평균 % (세로축은 % 하나)
    const w = 760, H = 280, L = 44, R = 20, T = 34, B = 40, iw = w - L - R, ih = H - T - B, n = W.length, step = iw / n, mxN = Math.max(1, ...W.map(x => x.n));
    const x = i => L + step * (i + .5), y = v => T + ih - v / 100 * ih, bh = c => c / mxN * ih * .55;
    let s = `<svg viewBox="0 0 ${w} ${H}" width="100%" role="img" aria-label="주간 테스트 수와 평균 점수">`;
    [0, 25, 50, 75, 100].forEach(v => { s += `<line x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule-2)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${v}</text>`; });
    s += `<text x="4" y="${T - 14}" font-size="11" fill="var(--ink-3)">점수(%)</text>`;
    W.forEach((d, i) => { const bw = Math.min(46, step * .45), hh = Math.max(d.n ? 6 : 3, bh(d.n));
      s += `<rect x="${x(i) - bw / 2}" y="${T + ih - hh}" width="${bw}" height="${hh}" rx="${Math.min(bw / 2, 12)}" fill="${d.n ? 'var(--bar)' : 'var(--bar-soft)'}"><title>${d.label}: 테스트 ${d.n}회</title></rect>`;
      s += `<text x="${x(i)}" y="${H - B + 20}" text-anchor="middle" font-size="13" fill="var(--ink)">${d.label}</text>`; });
    const line = (k, dash, col, wdt) => { let p = ''; W.forEach((d, i) => { if (d[k] == null) return; p += `${p ? 'L' : 'M'}${x(i).toFixed(1)} ${y(d[k]).toFixed(1)} `; }); return p ? `<path d="${p}" fill="none" stroke="${col}" stroke-width="${wdt}" ${dash ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round"/>` : ''; };
    s += line('cls', true, 'var(--ink-3)', 2) + line('avg', false, 'var(--brand)', 3);
    W.forEach((d, i) => { if (d.avg != null) s += `<circle cx="${x(i)}" cy="${y(d.avg)}" r="5" fill="var(--brand)" stroke="var(--sheet)" stroke-width="2"><title>${d.label}: 평균 ${d.avg}점${d.cls != null ? ` · 반 평균 ${d.cls}점` : ''}</title></circle>`;
      const top = Math.min(d.avg == null ? T + ih : y(d.avg), T + ih - Math.max(d.n ? 6 : 3, bh(d.n)));
      s += `<text x="${x(i)}" y="${top - 22}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--brand)">${d.n}회</text><text x="${x(i)}" y="${top - 8}" text-anchor="middle" font-size="12.5" fill="var(--ink)">${d.avg == null ? '–' : ri(d.avg) + '점'}</text>`; });
    return s + '</svg>';
  }
  function calendar(from, to, days, lessonDays) {
    const start = (() => { const d = new Date(from + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dkey(d); })();
    let k = start, rows = '', guard = 0, lastMonth = '';
    while (k <= to && guard++ < 10) {
      rows += '<tr>';
      for (let i = 0; i < 7; i++) {
        const inR = k >= from && k <= to, d = days.get(k), mo = k.slice(5, 7) !== lastMonth && inR ? `<span class="mo">${+k.slice(5, 7)}월</span>` : '';
        if (inR) lastMonth = k.slice(5, 7);
        const ev = inR && d ? [...d.att.map(a => `<span class="ev ${a === '결석' ? 'abs' : a === '지각' || a === '조퇴' ? 'late' : 'att'}">${esc(a)}</span>`), ...d.ev.map(e => `<span class="ev test" title="${esc(e)}">${esc(e)}</span>`)].join('') : (inR && lessonDays.has(k) ? '<span class="ev test">수업</span>' : '');
        rows += `<td class="${inR ? '' : 'out'} ${i === 5 ? 'sat' : i === 6 ? 'sun' : ''}"><span class="dn">${+k.slice(8, 10)}</span>${mo}${ev}</td>`;
        k = addDays(k, 1);
      }
      rows += '</tr>';
    }
    return `<table class="cal"><thead><tr>${['월', '화', '수', '목', '금', '토', '일'].map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  function donut(st) {
    const tot = st.reduce((s, x) => s + x.n, 0) || 1, R = 70, C = 2 * Math.PI * R; let off = 0;
    const arcs = st.filter(x => x.n).map(x => { const len = x.n / tot * C, a = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${x.c}" stroke-width="26" stroke-dasharray="${(len - 2).toFixed(1)} ${(C - len + 2).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 100 100)"><title>${x.l} ${x.n}개</title></circle>`; off += len; return a; }).join('');
    return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center"><div>${st.map(x => `<div style="display:flex;gap:10px;align-items:center;font-size:16px;margin:6px 0"><i style="width:18px;height:18px;border-radius:50%;background:${x.c};display:inline-block"></i><span style="width:44px">${x.l}</span><b>${x.n}개</b></div>`).join('')}</div>
      <svg viewBox="0 0 200 200" width="190" role="img" aria-label="난이도별 문항 수">${arcs}<text x="100" y="98" text-anchor="middle" font-size="13" fill="var(--ink-2)">난이도별</text><text x="100" y="116" text-anchor="middle" font-size="13" fill="var(--ink-2)">학습량</text></svg></div>`;
  }
  function lvBars(st) {
    const w = 380, H = 230, L = 34, T = 24, B = 34, ih = H - T - B, step = (w - L - 10) / st.length;
    let s = `<svg viewBox="0 0 ${w} ${H}" width="100%" role="img" aria-label="난이도별 정답률">`;
    [0, 20, 40, 60, 80, 100].forEach(v => { const y = T + ih - v / 100 * ih; s += `<line x1="${L}" x2="${w - 6}" y1="${y}" y2="${y}" stroke="var(--rule-2)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${v}</text>`; });
    st.forEach((x, i) => { const cx = L + step * (i + .5), v = x.v || 0, hh = v / 100 * ih;
      if (x.v != null && hh > 0) s += `<rect x="${cx - 14}" y="${T + ih - hh}" width="28" height="${hh}" rx="14" fill="${x.c}"><title>${x.l} 정답률 ${x.v}%</title></rect>`;
      s += `<text x="${cx}" y="${T + ih - hh - 6}" text-anchor="middle" font-size="12.5" fill="var(--ink)">${x.v == null ? '–' : x.v + '%'}</text><text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="13" fill="var(--ink)">${x.l}</text>`; });
    return s + '</svg>';
  }
  function radar(st) {
    const cx = 200, cy = 160, R = 100, ang = i => -Math.PI / 2 + i * Math.PI / 2, pt = (i, v) => [cx + R * v / 100 * Math.cos(ang(i)), cy + R * v / 100 * Math.sin(ang(i))];
    let s = `<svg viewBox="0 0 400 330" width="100%" role="img" aria-label="행동 영역별 정답률">`;
    [20, 40, 60, 80, 100].forEach(v => { s += `<polygon points="${st.map((_, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="var(--rule)"/>`; });
    st.forEach((_, i) => { const [x, y] = pt(i, 100); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--rule)"/>`; });
    const poly = (k, col, dash) => st.some(x => x[k] != null) ? `<polygon points="${st.map((x, i) => pt(i, x[k] || 0).join(',')).join(' ')}" fill="${col}" fill-opacity=".08" stroke="${col}" stroke-width="2.5" ${dash ? 'stroke-dasharray="5 4"' : ''}/>${st.map((x, i) => x[k] == null ? '' : `<circle cx="${pt(i, x[k])[0]}" cy="${pt(i, x[k])[1]}" r="4" fill="${col}"/>`).join('')}` : '';
    s += poly('before', 'var(--bad)', true) + poly('now', '#2563EB', false);
    const pos = [[cx, 24, 'middle'], [cx + R + 12, cy - 4, 'start'], [cx, cy + R + 28, 'middle'], [cx - R - 12, cy - 4, 'end']];
    st.forEach((x, i) => { const [px, py, an] = pos[i]; s += `<text x="${px}" y="${py}" text-anchor="${an}" font-size="13.5" fill="var(--ink)">${x.d}</text><text x="${px}" y="${py + 18}" text-anchor="${an}" font-size="13" font-weight="700"><tspan fill="#2563EB">${x.now == null ? '–' : x.now}</tspan><tspan fill="var(--ink-3)"> / </tspan><tspan fill="var(--bad)">${x.before == null ? '–' : x.before}</tspan></text>`; });
    return s + `</svg><div class="legend" style="justify-content:center"><span><i style="background:#2563EB"></i>최근 3주</span><span><i style="background:var(--bad)"></i>그 전 3주</span></div>`;
  }
  load();
})();
</script>
