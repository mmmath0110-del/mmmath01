<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더블엠 원장실 → 학원관리</title>
<style>
  :root{--paper:#F5F6F9;--ink:#16213A;--ink-2:#5A6379;--cobalt:#2A4BB8}
  @media (prefers-color-scheme: dark){:root{--paper:#0E1220;--ink:#E5E9F2;--ink-2:#A9B1C4;--cobalt:#8AA0F5}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px}
  main{max-width:420px;text-align:center;line-height:1.7}
  a{color:var(--cobalt);font-weight:700}
  p{color:var(--ink-2);font-size:14px}
</style>
</head>
<body>
<main>
  <h1 style="font-size:20px;margin:0 0 8px">원장실은 학원관리로 합쳐졌습니다</h1>
  <p>운영 캘린더 · 기록카드 · 개별 청구 · 테스트 일정 · 점검은 이제 <b>학원관리</b> 왼쪽 메뉴에 있습니다 (원장 아이디로 들어가면 보입니다).</p>
  <p><a id="go" href="academy.html">학원관리로 가기 →</a></p>
</main>
<script>
  // 옛 원장실 주소(admin.html#/calendar …) → 학원관리의 같은 화면
  (function () {
    var map = { calendar: 'cal', records: 'rec', payments: 'bills', tests: 'tests', issues: 'issues' };
    var v = map[(location.hash || '').replace('#/', '')];
    var url = 'academy.html' + (v ? '#' + v : '');
    document.getElementById('go').href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
