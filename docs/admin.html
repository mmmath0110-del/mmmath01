<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더블엠 원장실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F5F7; --surface:#FFFFFF; --surface-2:#FAFAFC; --surface-3:#F1F2F6;
  --ink:#171922; --ink-2:#4C5162; --ink-3:#868C9E;
  --line:#E1E3EA; --line-2:#EDEFF4;
  --accent:#5145B8; --accent-soft:#EDEBF8;
  --paid:#0089A8; --due:#D2551F; --warn:#B0790F;
  --crit-bg:#FCEEE8; --warn-bg:#FBF4E3; --info-bg:#EDEBF8; --good-bg:#E4F2F6;
  --shadow:0 1px 2px rgba(23,25,34,.05), 0 8px 24px -16px rgba(23,25,34,.28);
  --shadow-lg:0 12px 40px -12px rgba(23,25,34,.3);
  --kr:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101219; --surface:#181B23; --surface-2:#1D2029; --surface-3:#222632;
  --ink:#E9EAF0; --ink-2:#A5AAB9; --ink-3:#6E7486;
  --line:#282C37; --line-2:#22262F;
  --accent:#767FD8; --accent-soft:#232739;
  --paid:#2A9EB6; --due:#D8642F; --warn:#D9A43B;
  --crit-bg:#2C1D18; --warn-bg:#2A2317; --info-bg:#232739; --good-bg:#122A31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --ground:#101219; --surface:#181B23; --surface-2:#1D2029; --surface-3:#222632;
  --ink:#E9EAF0; --ink-2:#A5AAB9; --ink-3:#6E7486;
  --line:#282C37; --line-2:#22262F;
  --accent:#767FD8; --accent-soft:#232739;
  --paid:#2A9EB6; --due:#D8642F; --warn:#D9A43B;
  --crit-bg:#2C1D18; --warn-bg:#2A2317; --info-bg:#232739; --good-bg:#122A31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  --shadow-lg:0 12px 40px -12px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--kr);
  font-size:15.5px; line-height:1.68; -webkit-font-smoothing:antialiased; word-break:keep-all}

/* 숫자 표기 — .n0 은 순수 숫자 전용(모노), .n1 은 한글이 섞인 값(본문 서체 + 자릿수 정렬).
   IBM Plex Mono 에는 한글 글리프가 없어 한글에 모노를 쓰면 글자마다 대체 서체로 떨어진다. */
.n0{font-family:var(--mono); font-variant-numeric:tabular-nums}
.n1{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
button{font:inherit; cursor:pointer; font-family:var(--kr)}
input,select,textarea{font:inherit; color:inherit; font-family:var(--kr)}
input[type=number],input[type=date]{font-family:var(--mono)}

/* ── 좌측 사이드바 레이아웃 ── */
.shell{display:grid; grid-template-columns:224px minmax(0,1fr); align-items:start}
.side{position:sticky; top:52px; height:calc(100vh - 52px); background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 14px 14px; gap:18px; z-index:20}
.brand{font-family:"Gowun Batang",var(--kr); font-weight:700; font-size:20px; letter-spacing:-.01em;
  padding:0 10px; line-height:1.3}
.brand em{font-style:normal; color:var(--accent); display:block}
nav{display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1}
nav button{display:flex; align-items:center; gap:8px; width:100%; background:none; border:0;
  padding:10px 12px; border-radius:8px; color:var(--ink-2); font-size:14.5px; font-weight:500; text-align:left}
nav button:hover{background:var(--surface-3); color:var(--ink)}
nav button[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent)}
nav button .c{margin-left:auto; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
nav button[aria-current="page"] .c{color:var(--accent)}
nav button .b{margin-left:auto; font-size:11.5px; font-weight:600; padding:1px 7px; border-radius:999px;
  background:var(--due); color:#fff; font-variant-numeric:tabular-nums}
nav a.ext{display:flex; align-items:center; gap:8px; width:100%; padding:10px 12px; border-radius:8px;
  color:var(--ink-2); font-size:14.5px; font-weight:500; text-decoration:none}
nav a.ext:hover{background:var(--surface-3); color:var(--ink)}
nav a.ext .arr{margin-left:auto; font-size:12px; color:var(--ink-3)}
.linkcard{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.linkcard .ic{width:44px; height:44px; border-radius:10px; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex:none}
.linkcard .t{font-size:15.5px; font-weight:600}
.linkcard .d{font-size:13px; color:var(--ink-2); margin-top:2px}
.linkcard .go{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
a.btn{text-decoration:none; display:inline-flex; align-items:center; gap:6px}
.links{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.links .linkcard{align-items:flex-start; flex-wrap:nowrap; gap:14px}
.links .linkcard .go{margin-left:0; margin-top:10px}
.links .linkcard .body{flex:1; min-width:0}
.navgrp{font-size:12.5px; font-weight:700; color:var(--ink-2); letter-spacing:.02em;
  padding:16px 12px 6px; margin-top:8px; border-top:1px solid var(--line); text-transform:none}
nav button .ico,nav a.ext .ico{width:22px; flex:none; text-align:center; font-size:15px; line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
/* 알림 배너 — 시재 부족 · 임박한 테스트 */
.banner{border-radius:10px; padding:13px 16px; font-size:14px; line-height:1.6; border:1px solid}
.banner b{font-weight:600}
.banner.crit{background:var(--crit-bg); border-color:var(--due); color:var(--due)}
.banner.warn{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.banner.info{background:var(--info-bg); border-color:var(--accent); color:var(--accent)}
.side-foot{font-size:12px; color:var(--ink-3); padding:10px 12px 0; border-top:1px solid var(--line-2); min-height:34px}
/* 열람 전용으로 공유받은 계정에서는 편집 수단을 숨긴다 (쓰기는 서버에서도 거부된다) */
.build{font-size:10.5px; color:var(--ink-3); margin-top:6px; opacity:.7}
/* 저장 실패 알림 띠 — 화면 맨 위, 항상 보임 (샌드박스라 alert 팝업이 안 뜨므로) */
#topbanner{position:fixed; top:0; left:0; right:0; z-index:80; background:var(--due); color:#fff;
  padding:12px 18px; font-size:14px; font-weight:500; display:none; align-items:center; gap:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.25); line-height:1.5}
#topbanner.on{display:flex}
#topbanner span{flex:1}
#topbanner .btn{background:#fff; color:var(--due); flex:none}
#topbanner .tb-x{background:none; border:0; color:#fff; font-size:22px; line-height:1; padding:0 4px; flex:none}
#save-state.busy{color:var(--accent)} #save-state.err{color:var(--due)}
.links-foot{font-size:12px; margin-top:6px} .links-foot a{color:var(--ink-2); text-decoration:none} .links-foot a:hover{color:var(--accent)}
/* 상단 막대 — 학원관리·근무일지와 같은 자리에 같은 정보(이름·역할·나가기·버전) */
.topbar{position:sticky; top:0; z-index:30; height:52px; background:var(--accent); color:#fff; display:flex; align-items:center; gap:12px; padding:0 16px}
.tb-brand{font-family:"Gowun Batang",var(--kr); font-weight:700; font-size:17px; white-space:nowrap}
.tb-brand span{font-family:var(--kr); font-weight:400; font-size:12.5px; opacity:.85; margin-left:6px; letter-spacing:.04em}
.tb-me{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; flex-wrap:wrap; justify-content:flex-end}
.tb-me .chip{background:rgba(255,255,255,.18); border-color:transparent; color:#fff; font-size:12.5px} .tb-me .chip .muted{opacity:.8}
.tb-me .chip.ver{font-family:var(--mono); font-size:11.5px}
.tb-me .btn.ghost{background:transparent; color:#fff; border-color:rgba(255,255,255,.45); text-decoration:none} .tb-me .btn.ghost:hover{background:rgba(255,255,255,.15); color:#fff}
#banner{max-width:1080px; padding:14px 34px 0} #banner:empty{display:none}
#banner .banner{margin:0}
body.locked .shell,body.locked #banner{display:none}
/* 로그인 창 */
.modal-back{position:fixed; inset:0; background:rgba(10,12,18,.55); z-index:90; display:none; align-items:center; justify-content:center; padding:16px}
.modal-back.on{display:flex}
.modal{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:22px 24px; width:100%; max-width:400px; box-shadow:var(--shadow-lg)}
.login-err{color:var(--due); font-size:13px; min-height:18px; margin-top:8px}

main{max-width:1080px; padding:30px 34px 90px; display:flex; flex-direction:column; gap:34px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}
.pad{padding:20px 22px}
h2.sec{font-family:"Gowun Batang",var(--kr); font-size:23px; font-weight:700; margin:0; letter-spacing:-.015em}
.sec-row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding-bottom:11px;
  border-bottom:1px solid var(--line)}
.sec-row .hint{font-size:13px; color:var(--ink-3)}
.sec-row .spacer{margin-left:auto}
section{display:flex; flex-direction:column; gap:16px}
.note{font-size:12.5px; color:var(--ink-3); line-height:1.65}
.note b{color:var(--ink-2); font-weight:500}
a{color:var(--accent)}
.sub-h{font-size:13.5px; font-weight:600; margin-bottom:10px}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:12px; overflow:hidden}
.kpi{background:var(--surface); padding:18px 20px}
.kpi .k{font-size:12.5px; color:var(--ink-3); margin-bottom:7px; letter-spacing:.01em}
.kpi .v{font-size:29px; font-weight:600; letter-spacing:-.025em; line-height:1.05; font-family:var(--mono);
  font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13.5px; font-weight:400; color:var(--ink-3); margin-left:4px; font-family:var(--kr)}
.kpi .s{font-size:12.5px; color:var(--ink-2); margin-top:7px}
.kpi.hi .v{color:var(--due)}

.acts{display:flex; flex-direction:column; gap:10px}
.act{display:grid; grid-template-columns:5px 1fr auto; gap:0 18px; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; text-align:left; width:100%; padding:0}
.act:hover{border-color:var(--accent); box-shadow:var(--shadow)}
.act .bar{align-self:stretch}
.act.crit .bar{background:var(--due)} .act.warn .bar{background:var(--warn)} .act.info .bar{background:var(--accent)}
.act .bd{padding:16px 0 16px 6px}
.act .t{font-size:16px; font-weight:600; display:block; letter-spacing:-.005em}
.act .d{font-size:13.5px; color:var(--ink-2); margin-top:3px; display:block}
.act .fg{padding:16px 22px 16px 0; align-self:center; font-size:21px; font-weight:600; white-space:nowrap;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}

.row{display:grid; grid-template-columns:118px 1fr 82px; gap:13px; align-items:center; margin-bottom:9px}
.row.tight{grid-template-columns:118px 1fr 56px}
.row .lab{font-size:12.5px; color:var(--ink-3); text-align:right; line-height:1.35}
.row .lab b{display:block; color:var(--ink); font-weight:600; font-size:14px; line-height:1.3}
.track{position:relative; height:24px; background:var(--line-2); border-radius:5px}
.seg{position:absolute; top:0; bottom:0}
.seg .fill{height:100%; width:100%}
.seg.p .fill{background:var(--paid); border-radius:5px 0 0 5px}
.seg.d .fill{background:var(--due); border-radius:0 5px 5px 0}
.seg.solo{background:var(--accent); border-radius:5px}
.val{font-size:12.5px; color:var(--ink-2); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.legend{display:flex; gap:15px; font-size:12.5px; color:var(--ink-2); margin-bottom:12px; flex-wrap:wrap}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px}

.bar-tools{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.inp{background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:7px 11px;
  font-size:14px; min-width:0; color:var(--ink)}
.inp:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.chip{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 12px;
  font-size:13px; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.btn{background:var(--accent); color:#fff; border:0; border-radius:7px; padding:8px 15px; font-size:14px; font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface); color:var(--ink-2); border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent); color:var(--accent); filter:none}
.btn.sm{padding:5px 11px; font-size:13px}
.btn.danger{background:none; color:var(--due); border:1px solid var(--line)}
.btn:disabled{opacity:.5; cursor:default}

.tw{overflow-x:auto; border-radius:10px}
table{width:100%; border-collapse:collapse; font-size:14px; background:var(--surface)}
th,td{text-align:left; padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:top}
th{font-size:11.5px; font-weight:600; color:var(--ink-3); letter-spacing:.04em; border-bottom:1px solid var(--line); white-space:nowrap; padding-top:12px; padding-bottom:9px}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono); color:var(--ink-3)}
.clk tbody tr{cursor:pointer}
.clk tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.cut{max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap}
.pill.ok{background:var(--good-bg); color:var(--paid)}
.pill.no{background:var(--crit-bg); color:var(--due)}
.pill.wr{background:var(--warn-bg); color:var(--warn)}
.pill.nu{background:var(--surface-3); color:var(--ink-3)}
.flagdot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warn); margin-right:6px; vertical-align:1px}
.due-amt{color:var(--due); font-weight:600}
.empty{padding:40px 20px; text-align:center; color:var(--ink-3); font-size:14px}

.scrim{position:fixed; inset:0; background:rgba(10,12,18,.42); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(470px,100%); background:var(--surface);
  border-left:1px solid var(--line); box-shadow:var(--shadow-lg); z-index:41; transform:translateX(100%);
  transition:transform .2s; display:flex; flex-direction:column}
.drawer.on{transform:none}
.dr-head{padding:17px 22px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:14px}
.dr-head h3{margin:0; font-family:"Gowun Batang",var(--kr); font-size:21px; font-weight:700; letter-spacing:-.01em}
.dr-head .sub{font-size:12.5px; color:var(--ink-3); margin-top:2px}
.dr-head .x{margin-left:auto; background:none; border:0; color:var(--ink-3); font-size:22px; line-height:1; padding:2px 6px}
.dr-body{padding:18px 22px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px}
.dr-foot{padding:13px 22px; border-top:1px solid var(--line); display:flex; gap:9px; align-items:center}
/* 저장 거부 사유 — 서랍 발치, 버튼 바로 위 */
.dr-err{padding:10px 22px; font-size:13px; line-height:1.55; color:var(--due); background:var(--crit-bg);
  border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.dr-err .btn{flex:none}
.dr-foot .sp{margin-left:auto}
.fld{display:flex; flex-direction:column; gap:5px}
.fld label{font-size:12px; color:var(--ink-3); font-weight:500}
.fld .inp{width:100%}
.fld textarea.inp{resize:vertical; min-height:64px; line-height:1.55}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.ro{font-size:13px; color:var(--ink-2); background:var(--surface-2); border-radius:7px; padding:9px 12px; line-height:1.6}
.ro b{color:var(--ink); font-weight:600}

.flags{display:flex; flex-direction:column}
.flag{display:flex; gap:13px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line-2)}
.flag:last-child{border-bottom:0}
.flag .code{font-size:11.5px; color:var(--ink-3); min-width:112px}
.flag .txt{font-size:13.5px; color:var(--ink-2); flex:1}
.flag .txt b{color:var(--ink); font-weight:600}
.depts{display:grid; grid-template-columns:repeat(4,1fr); gap:9px}
.dept{background:var(--surface-2); border:1px solid var(--line-2); border-radius:8px; padding:11px 13px}
.dept .k{font-size:12px; color:var(--ink-3)}
.dept .v{font-size:20px; font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums}
.dept .v small{font-size:12px; font-weight:400; color:var(--ink-3); font-family:var(--kr)}
.two{display:grid; grid-template-columns:1.15fr .85fr; gap:18px; align-items:start}
.issue{display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:start; padding:12px 0; border-bottom:1px solid var(--line-2)}
.issue:last-child{border-bottom:0}
.issue.done{opacity:.5} .issue.done .ti{text-decoration:line-through}
.issue input[type=checkbox]{width:17px; height:17px; margin-top:3px; accent-color:var(--accent)}
.issue .ti{font-size:14px; font-weight:600}
.issue .de{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.issue .ac{font-size:12.5px; color:var(--accent); margin-top:3px}

/* 달력 */
.cal-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cal-head .m{font-family:"Gowun Batang",var(--kr); font-size:22px; font-weight:700; min-width:150px;
  font-variant-numeric:tabular-nums}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:10px; overflow:hidden}
.cal .dow{background:var(--surface-2); padding:8px 0; text-align:center; font-size:12px; color:var(--ink-3); font-weight:600}
.cal .dow.sun{color:var(--due)}
/* min-width:0 이 없으면 nowrap 인 일정 제목이 칸 너비를 밀어내 토요일 칸이 화면 밖으로 나간다 */
.cell{background:var(--surface); min-height:104px; min-width:0; padding:7px 8px; display:flex;
  flex-direction:column; gap:4px; border:0; text-align:left; border-radius:0; overflow:hidden}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-3); opacity:.55}
.cell .dn{font-size:12.5px; color:var(--ink-2); font-family:var(--mono); font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--due)}
.cell.today .dn{background:var(--accent); color:#fff; border-radius:50%; width:21px; height:21px;
  display:inline-flex; align-items:center; justify-content:center; font-size:11.5px}
.ev{display:block; max-width:100%; min-width:0; font-size:11.5px; padding:2px 6px; border-radius:4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:3px solid;
  background:var(--surface-3); color:var(--ink-2); line-height:1.5}
.ev.시험{border-color:var(--due); background:var(--crit-bg); color:var(--due)}
.ev.특강{border-color:var(--accent); background:var(--info-bg); color:var(--accent)}
.ev.상담{border-color:var(--paid); background:var(--good-bg); color:var(--paid)}
.ev.휴원{border-color:var(--ink-3)}
.ev.특이사항{border-color:var(--ink); color:var(--ink)}

/* 라벨 / 값 격자 — 기록카드의 성향·방향성·진로 */
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 18px; font-size:13.5px; align-items:baseline}
.kv-k{color:var(--ink-3); font-size:12.5px; white-space:nowrap}
.kv-v{color:var(--ink); overflow-wrap:anywhere}

@media print{
  @page{margin:14mm}
  .side,.scrim,.drawer,.toast,.no-print,.sec-row .spacer,#rec-print,.topbar,#banner{display:none!important}
  body{background:#fff; color:#000; font-size:11pt}
  .shell{display:block}
  main{padding:0; gap:12px; max-width:none}
  .panel{box-shadow:none; border:1px solid #bbb; break-inside:avoid}
  .two{grid-template-columns:1fr 1fr}
  .btn,.chip{display:none!important}
  h2.sec{font-size:15pt}
  .kv-k,.note{color:#444}
}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); background:var(--ink); color:var(--ground);
  padding:10px 18px; border-radius:8px; font-size:13.5px; z-index:60; opacity:0; pointer-events:none; transition:.2s}
.toast.on{opacity:1; transform:translate(-50%,0)}
.toast.err{background:var(--due); color:#fff}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1080px){ main{padding:26px 24px 80px} }
@media (max-width:900px){
  /* 좁은 화면에서는 사이드바를 상단 가로 막대로 접는다 */
  .shell{grid-template-columns:minmax(0,1fr)}
  /* 상단 막대: 이름·버튼이 두 줄로 넘쳐도 아래 메뉴를 덮지 않게 높이를 내용에 맞춘다 */
  .topbar{height:auto; min-height:52px; padding:6px 14px; flex-wrap:wrap; row-gap:4px}
  .tb-brand{overflow:hidden; text-overflow:ellipsis; min-width:0}
  .tb-me{flex-wrap:nowrap; gap:5px}
  .tb-me .btn{padding:5px 9px; font-size:12.5px}
  .side{position:static; height:auto; flex-direction:row; align-items:center; gap:12px; min-width:0; overflow:hidden;
    border-right:0; border-bottom:1px solid var(--line); padding:10px 14px}
  .brand{font-size:17px; padding:0; white-space:nowrap; flex:none}
  .brand em{display:inline}
  /* nav 가 flex 항목이라 min-width:0 이 없으면 메뉴 전체 너비만큼 페이지가 넓어져 휴대폰에서 화면이 축소된다 */
  nav{flex-direction:row; overflow-x:auto; overflow-y:hidden; gap:2px; scrollbar-width:none; min-width:0; -webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{width:auto; white-space:nowrap; padding:8px 12px; box-shadow:none!important}
  nav button .c{display:none}
  .navgrp{display:none}
  nav button .ico,nav a.ext .ico{width:auto; margin-right:2px}
  nav a.ext{width:auto; white-space:nowrap; padding:8px 12px}
  nav button .b{margin-left:5px}
  .side-foot{border:0; padding:0; margin-left:auto; min-height:0; white-space:nowrap; flex:none;
    flex-direction:row; align-items:center; gap:10px}
  .links-foot,.build{display:none}
  #banner{padding:12px 18px 0}
  main{max-width:none; padding:22px 18px 80px; gap:26px}
  /* 1fr 은 minmax(auto,1fr) 이라 표가 넓으면 칸이 화면 밖으로 밀린다 → minmax(0,1fr) */
  .two,.links{grid-template-columns:minmax(0,1fr)} .kpis,.depts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell{min-height:80px}
}
@media (max-width:560px){
  /* 학원관리·근무일지 링크는 홈 화면 카드와 메뉴에도 있으므로 상단 막대에서는 뺀다 */
  .tb-me a.btn{display:none}
  .tb-me .chip .muted{display:none}
  .tb-brand{font-size:15.5px} .tb-brand span{font-size:11.5px; margin-left:4px}
  .side{padding:8px 10px; gap:8px}
  .side-foot{display:none}
  .kpis,.depts{grid-template-columns:minmax(0,1fr)}
  .row,.row.tight{grid-template-columns:88px 1fr 58px; gap:9px}
  .act{grid-template-columns:4px 1fr} .act .fg{grid-column:2; padding:0 18px 14px 6px; align-self:start}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .cell{min-height:62px; padding:5px} .cell .ev{font-size:10.5px; padding:1px 4px}
  .cal-head .m{font-size:19px; min-width:0}
  .brand em{display:none}
  h2.sec{font-size:20px}
  main{padding:18px 14px 70px}
}
</style>
</head>
<body>
<script src="config.js"></script>

<header class="topbar">
  <div class="tb-brand">더블엠수학학원 <span>원장실</span></div>
  <div class="tb-me" id="meBox"></div>
</header>
<div id="banner"></div>

<div class="shell">
  <aside class="side">
    <div class="brand">더블엠 <em>원장실</em></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="save-state"></span>
      <div class="links-foot"><a href="academy.html">학원관리 ↗</a> · <a href="index.html">근무일지 ↗</a></div>
      <div class="build" id="build"></div></div>
  </aside>
  <main id="app"><div class="empty">불러오는 중…</div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title"></aside>
<div class="toast" id="toast"></div>

<!-- 로그인 (학원관리·근무일지와 같은 아이디, 같은 세션) -->
<div class="modal-back" id="loginModal">
  <form class="modal" id="loginForm" autocomplete="off">
    <h2 class="sec" style="font-size:20px;margin-bottom:4px">더블엠수학학원 · 원장실</h2>
    <p class="note" style="margin:0 0 14px">원장(관리자) 아이디로만 들어올 수 있습니다. 학원관리·근무일지와 같은 아이디입니다.</p>
    <div class="fld"><label for="lId">아이디</label><input class="inp" id="lId" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
    <div class="fld" style="margin-top:10px"><label for="lPin">비밀번호</label><input class="inp" id="lPin" type="password" autocomplete="current-password" required></div>
    <div class="login-err" id="loginErr"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:14px"><span class="note" id="loginStatus"></span><span style="margin-left:auto"></span><button type="submit" class="btn" id="loginBtn">들어가기</button></div>
  </form>
</div>

<script>
"use strict";
const $ = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (Number(n)||0).toLocaleString("ko-KR");
const pct = (a,b) => b ? Math.round(a/b*1000)/10 : 0;
const pad = n => String(n).padStart(2,"0");
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let serverToday = null;
const today = () => serverToday || fmtDate(new Date());

/* 학원관리(academy.html)·근무일지(index.html)와 같은 서버(Apps Script)·같은 시트·같은 아이디를 쓴다.
   학생·반·수강·상담·납부는 학원관리 데이터 그대로이고, 원장실에만 있는 자료(달력·테스트·시재·점검·기록카드·개별 청구)는
   같은 시트의 별도 탭(events·tests·supplies·issues·gradebook·profiles·bills)에 있다. 저장소가 하나라 따로 맞출 것이 없다. */
const LS_SESSION = "mm-tutor-web-session";
const API_URL = (window.MM_API_URL || "").trim();
const EXPECTED_SERVER = 28;   // 이 화면이 필요로 하는 서버(Code.gs SERVER_VERSION) 버전 (adminBootstrap 등이 v27 부터)
const DEPLOYMENT_ID = (API_URL.match(/\/macros\/s\/([^/]+)\/exec/) || [])[1] || "";
const LINKS = { academy:"academy.html", attend:"index.html",
  sheet:"https://docs.google.com/spreadsheets/d/1TNHAyqMIj43wRvaFtAp8eu4KOIPItcWzYy3ZFtxusMs/edit" };
const BUILD = "웹-1";

const GRADES = ["초1","초2","초3","초4","초5","초6","중1","중2","중3","고1","고2","고3","기타"];
const PAYSTATUS = ["완납","미납","부분납","청강","환불","면제","확인필요"];
const METHODS = ["","카드","계좌이체","현금","기타"];
const ENROLSTATUS = ["재원","휴원","퇴원","대기"];
const EVTYPES = ["시험","특강","상담","휴원","특이사항"];
const CONSULT_TYPES = ["신규상담","학부모상담","학생상담","전화상담","기타"];
const BILL_KINDS = ["특강","선행","정규","보충","교재비","기타"];

let TOKEN=null, ME=null, MEMBERS=new Map(), TEACHERS=["확인필요"];
let view="home", ready=false, loggingIn=false, serverVersion=null, updating=false, loadErr="";
let S={students:[],teachers:[],classes:[],rows:[],payments:[],issues:[],meta:null,
       records:{exams:[],mocks:[],tasks:[],counsels:[],profiles:[]}, events:[], ops:{supplies:[],tests:[]}, paid:[]};

/* ---------- 서버 ---------- */
async function api(action, payload){
  if(!API_URL) throw {code:"no_api", message:"config.js 에 MM_API_URL 이 비어 있습니다."};
  let res;
  try{
    res = await fetch(API_URL, {method:"POST", redirect:"follow", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({action, token:TOKEN||""}, payload||{}))});
  }catch(e){ throw {code:"network", message:"서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요."}; }
  let out; try{ out = await res.json(); }
  catch(e){ throw {code:"server_error", message:`서버가 오류 페이지를 돌려줬습니다 (HTTP ${res.status}). 잠시 뒤 다시 시도하거나 배포 설정(액세스: 모든 사용자)을 확인하세요.`}; }
  if(out.today) serverToday = out.today;
  serverVersion = Number(out.version) || 3;
  if(!out.ok){
    if(out.error==="unauthorized") logoutLocal();
    throw {code:out.error, message:out.message};
  }
  return out.data;
}
function friendly(ex){
  const code = ex && ex.code;
  if(code==="unauthorized") return "로그인이 풀렸습니다. 다시 로그인하세요.";
  if(code==="forbidden") return "원장(관리자) 아이디로만 할 수 있습니다.";
  if(code==="bad_action") return "서버가 아직 원장실 기능이 없는 이전 버전입니다. 학원관리 화면의 [서버 업데이트] 를 누르거나 Apps Script 를 새 버전으로 배포해 주세요.";
  if(code==="busy") return "서버가 다른 작업을 처리 중입니다. 잠시 뒤 다시 시도하세요.";
  return (ex && ex.message) || "요청을 처리하지 못했습니다.";
}
const session = {
  load(){ try{ return JSON.parse(localStorage.getItem(LS_SESSION)||"null"); }catch(e){ return null; } },
  save(o){ try{ o ? localStorage.setItem(LS_SESSION, JSON.stringify(o)) : localStorage.removeItem(LS_SESSION); }catch(e){} },
};
function logoutLocal(){ TOKEN=null; ME=null; ready=false; session.save(null); closeDrawer(); renderGate(); renderMe(); render(); }
async function logout(){ const t=TOKEN; logoutLocal(); if(t){ try{ await api("logout",{token:t}); }catch(e){} } }
const isAdmin = () => !!ME && ME.role==="admin";

/* ---------- 학원관리 데이터를 원장실 모양으로 ---------- */
const deptOfGrade = g => /^초/.test(g||"") ? "초등부" : /^중/.test(g||"") ? "중등부" : /^고/.test(g||"") ? "고등부" : "확인필요";
const deptOfName  = n => /^초/.test(n||"") ? "초등부" : /^중/.test(n||"") ? "중등부" : /^고/.test(n||"") ? "고등부" : "확인필요";
const gradeNum = g => { const n=Number(String(g||"").replace(/\D/g,"")); return n||null; };
function teacherLabel(id){ const m=MEMBERS.get(id); if(!m) return ""; return /T$/.test(m.name) ? m.name : m.name+"T"; }
function adapt(d){
  MEMBERS = new Map((d.members||[]).map(m=>[m.id,m]));
  TEACHERS = [...MEMBERS.values()].filter(m=>m.active!==false).map(m=>teacherLabel(m.id)).concat(["확인필요"]);
  const tk = today();
  const clsMap = new Map((d.classes||[]).map(c=>[c.id,c]));
  S.classes = (d.classes||[]).map(c=>({id:c.id, name:c.name, dept:c.kind==="선행" ? "선행반" : deptOfName(c.name),
    teacher:teacherLabel(c.teacherId)||"확인필요", teacherId:c.teacherId||"", day:(c.days||"").replace(/,/g,""),
    program:c.progress||"", type:c.subject||"", kind:c.kind||"", fee:Number(c.fee)||0, note:c.memo||"", status:c.status||"운영", slots:c.slots||[]}));
  S.rows = (d.enrollments||[]).filter(e => !e.endDate || e.endDate >= tk).filter(e => clsMap.has(e.classId))
    .map(e=>({id:e.id, studentId:e.studentId, classId:e.classId, startDate:e.startDate||""}));
  const regOf = {};
  S.rows.forEach(r=>{ const c=clsMap.get(r.classId); if(c && c.kind!=="선행") (regOf[r.studentId]=regOf[r.studentId]||[]).push(c); });
  S.students = (d.students||[]).map(s=>{
    const hr = (regOf[s.id]||[]).map(c=>teacherLabel(c.teacherId)).filter(Boolean)[0] || "확인필요";
    return {id:s.id, extId:s.extId||"", name:s.name, dept:deptOfGrade(s.grade), grade:gradeNum(s.grade), gradeKey:s.grade||"",
      school:s.school||"", status:s.status||"재원", phone:s.phone||"", guardianPhone:s.parentPhone||"", parentName:s.parentName||"",
      birth:s.birth||"", enrolledAt:s.enrolledAt||"", leftAt:s.leftAt||"", note:s.memo||"", homeroom:hr,
      flag:/확인\s*필요|확인필요/.test(s.memo||"")};
  });
  S.teachers = [...MEMBERS.values()];
  const nameOf = id => { const s=S.students.find(x=>x.id===id); return s ? s.name : id; };
  S.payments = (d.bills||[]).map(b => Object.assign({}, b, {name:nameOf(b.studentId), billed:Number(b.billed)||0, discount:Number(b.discount)||0, paid:Number(b.paid)||0}));
  S.paid = d.payments || [];
  S.issues = d.issues||[]; S.events = d.events||[];
  S.ops = {supplies:d.supplies||[], tests:d.tests||[]};
  const g = d.gradebook||[];
  S.records = {exams:g.filter(x=>x.kind==="내신"), mocks:g.filter(x=>x.kind==="모의"), tasks:g.filter(x=>x.kind==="과제"),
    counsels:d.consults||[], profiles:d.profiles||[]};
  S.meta = d.meta || null;
  ready = S.students.length>0 || S.classes.length>0;
}

/* ---------- 시작 · 새로 읽기 ---------- */
async function boot(){
  const bd=$("#build"); if(bd) bd.textContent="버전 "+BUILD;
  renderGate(); renderMe();
  if(!TOKEN || !API_URL){ render(); return; }
  try{
    const d = await api("adminBootstrap");
    ME = d.me; session.save({token:TOKEN, me:d.me});
    adapt(d); loadErr=""; render();
  }catch(err){
    if(err.code==="unauthorized") return;
    loadErr = friendly(err); ready=false; render(); renderMe();
  }
}
let refreshing=false;
/** 저장 뒤 서버에서 다시 읽는다 (서랍이 닫힌 뒤에 그리므로 입력 중인 화면을 건드리지 않는다) */
async function refresh(){
  if(refreshing) return; refreshing=true;
  try{ const d=await api("adminBootstrap"); adapt(d); if(!$("#drawer").classList.contains("on")) render(); }
  catch(err){ console.error(err); }
  finally{ refreshing=false; }
}
let saveTimer=null;
function setSave(t,cls){ const el=$("#save-state"); if(el){ el.textContent=t||""; el.className=cls||""; } }
/** 저장 요청. 실패하면 서랍 발치와 화면 위 띠, 토스트로 이유를 보이고 다시 던진다 (버튼이 풀린다) */
async function call(action, payload){
  setSave("저장 중…","busy");
  try{
    const r = await api(action, payload);
    setSave("저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}));
    clearTimeout(saveTimer); saveTimer=setTimeout(()=>setSave(""),4000);
    return r;
  }catch(err){
    const text = friendly(err);
    setSave("저장 실패","err");
    showDrawerError(text, false); showBanner("저장 실패 · "+text, false); toast(text, true);
    throw err;
  }
}
function showBanner(text, reload){
  let el=$("#topbanner");
  if(!el){ el=document.createElement("div"); el.id="topbanner"; document.body.appendChild(el); }
  el.innerHTML = `<span>${esc(text)}</span>` + (reload ? `<button class="btn sm" id="tb-reload">새로고침</button>` : "")
    + `<button class="tb-x" id="tb-x" aria-label="닫기">×</button>`;
  el.className="on";
  const r=$("#tb-reload"); if(r) r.onclick=()=>location.reload();
  $("#tb-x").onclick=()=>{ el.className=""; };
}
function showDrawerError(text, reload){
  const foot=$("#drawer .dr-foot"); if(!foot) return;
  let el=$("#dr-err");
  if(!el){ el=document.createElement("div"); el.id="dr-err"; el.className="dr-err"; foot.before(el); }
  el.innerHTML = esc(text) + (reload ? ` <button class="btn sm ghost" id="dr-reload">새로고침</button>` : "");
  const r=$("#dr-reload"); if(r) r.onclick=()=>location.reload();
}
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" err":"");
  setTimeout(()=>t.className="toast",2600); }

/* ---------- 로그인 · 상단 ---------- */
function renderGate(){
  const locked = !TOKEN;
  document.body.classList.toggle("locked", locked);
  $("#loginModal").classList.toggle("on", locked);
  $("#loginBtn").disabled = loggingIn;
  $("#loginStatus").textContent = loggingIn ? "확인 중…" : (!API_URL ? "config.js 에 서버 주소가 없습니다" : "");
  if(locked) setTimeout(()=>$("#lId").focus(), 0);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  const id=$("#lId").value.trim(), pw=$("#lPin").value;
  if(!id||!pw) return;
  loggingIn=true; renderGate();
  try{
    const d = await api("login",{id,pw});
    TOKEN=d.token; ME=d.me; session.save({token:d.token, me:d.me});
    $("#lPin").value=""; loggingIn=false;
    await boot(); toast(`${d.me.name}님, 들어왔습니다`);
  }catch(ex){ loggingIn=false; renderGate(); $("#loginErr").textContent=friendly(ex); $("#lPin").value=""; $("#lPin").focus(); }
};
function renderMe(){
  const box=$("#meBox"); box.innerHTML="";
  if(!ME) return;
  box.innerHTML = `<span class="chip">${esc(ME.name)} <span class="muted">${isAdmin()?"관리자":"강사"}</span></span>`
    + `<a class="btn sm ghost" href="${LINKS.academy}">학원관리</a><a class="btn sm ghost" href="${LINKS.attend}">근무일지</a>`

    + `<span class="chip ver" title="화면 v${EXPECTED_SERVER} · 서버 v${serverVersion||"?"}">v${EXPECTED_SERVER}${serverVersion&&serverVersion!==EXPECTED_SERVER?` <span class="muted">서버 v${serverVersion}</span>`:""}</span>`;
  $("#logoutBtn").onclick=logout;
}
/** 서버(Apps Script)가 이 화면보다 오래됐으면 안내. 관리자는 버튼으로 바로 업데이트 (학원관리와 같은 방식) */
function serverBanner(){
  const v=serverVersion;
  if(!v || v>=EXPECTED_SERVER) return "";
  if(updating) return `<div class="banner warn">서버를 업데이트하는 중입니다… 30초쯤 걸립니다.</div>`;
  if(!isAdmin()) return `<div class="banner warn">서버가 이전 버전(v${v})입니다. 원장님이 서버를 업데이트하면 원장실이 켜집니다.</div>`;
  if(v<4) return `<div class="banner warn">서버가 이전 버전(v${v})이라 원장실이 아직 켜지지 않았습니다. Apps Script 에서 <b>Code.gs · Academy.gs · appsscript.json</b> 을 새 내용으로 바꾸고 새 버전으로 배포해 주세요. <a href="https://github.com/mmmath0110-del/mmmath01#서버-자동-업데이트-설정-한-번만" target="_blank" rel="noopener">방법 보기</a></div>`;
  return `<div class="banner warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>서버가 이전 버전(v${v} → v${EXPECTED_SERVER})입니다. 원장실을 쓰려면 서버를 업데이트하세요.</span><button class="btn sm" id="serverUpdate">서버 업데이트</button></div>`;
}
async function serverUpdate(){
  if(updating) return;
  if(!confirm("GitHub 의 최신 서버 코드를 받아 Apps Script 를 새 버전으로 배포합니다. 30초쯤 걸립니다. 진행할까요?")) return;
  updating=true; render();
  try{
    const r = await api("selfUpdate",{deploymentId:DEPLOYMENT_ID});
    if(!r.updated){ toast(r.message||"이미 최신 버전입니다"); serverVersion=r.version; return; }
    for(let i=0;i<20;i++){
      await new Promise(res=>setTimeout(res,3000));
      try{ const o=await (await fetch(API_URL+"?t="+Date.now(),{redirect:"follow"})).json(); if(Number(o.version)>=r.version){ serverVersion=Number(o.version); break; } }catch(e){}
    }
    if(serverVersion>=r.version){ toast(`서버를 v${r.version} 으로 업데이트했습니다`); await boot(); }
    else toast("업데이트는 됐지만 아직 이전 버전이 응답합니다. 잠시 뒤 새로고침하세요.");
  }catch(ex){ alert(friendly(ex)); }
  finally{ updating=false; render(); }
}

/* ---------- derived ---------- */
const money = () => { let bill=0,paid=0; S.payments.forEach(p=>{bill+=(p.billed||0)-(p.discount||0); paid+=(p.paid||0);});
  return {bill,paid,due:bill-paid,rate:pct(paid,bill)}; };
const byKind = k => { const rs=S.payments.filter(p=>p.kind===k); let bill=0,paid=0;
  rs.forEach(p=>{bill+=(p.billed||0)-(p.discount||0); paid+=(p.paid||0);});
  return {n:rs.length,bill,paid,due:bill-paid,rate:pct(paid,bill)}; };
const dueOf = p => (p.billed||0)-(p.discount||0)-(p.paid||0);
const unpaid = () => S.payments.filter(p => dueOf(p) > 0 && p.status!=="청강" && p.status!=="면제" && p.status!=="환불");
const needCheck = () => S.payments.filter(p => p.status==="확인필요");
const openIssues = () => S.issues.filter(i => !i.done);
const teacherLoad = () => { const m={},cls={};
  S.students.filter(s=>s.status==="재원").forEach(s=>{const t=s.homeroom||"확인필요"; m[t]=(m[t]||0)+1;});
  S.classes.filter(c=>c.status!=="종료").forEach(c=>{cls[c.teacher]=(cls[c.teacher]||0)+1;});
  return TEACHERS.filter(t=>t!=="확인필요").map(t=>({t,n:m[t]||0,c:cls[t]||0})).filter(x=>x.n||x.c).sort((a,b)=>b.n-a.n); };
const deptCount = d => S.students.filter(s=>s.dept===d && s.status==="재원").length;
const stu = id => S.students.find(x=>x.id===id);
const stuName = id => { const s=stu(id); return s?s.name:id; };
const memberName = id => { const m=MEMBERS.get(id); return m ? m.name : (id||""); };
/* 고1 최상위반 바로가기: 이름에 '고1' 과 '최상위' 가 들어간 반 */
const topClass = () => { const c=S.classes.find(c=>/고1/.test(c.name)&&/최상위/.test(c.name)&&c.status!=="종료");
  return c ? S.rows.filter(r=>r.classId===c.id).map(r=>r.studentId) : []; };
const classesOf = id => S.rows.filter(r=>r.studentId===id).map(r=>S.classes.find(c=>c.id===r.classId)).filter(Boolean);

/* ── 운영: 시재 · 테스트 ── */
const lowStock = () => S.ops.supplies.filter(x =>
  x.qty!=="" && x.qty!=null && x.minQty!=="" && x.minQty!=null && Number(x.qty) <= Number(x.minQty));
const noCount  = () => S.ops.supplies.filter(x => x.qty==="" || x.qty==null);
const dday = d => Math.round((new Date(d+"T00:00:00") - new Date(today()+"T00:00:00"))/86400000);
const soonTests = () => S.ops.tests.filter(t => !t.done && t.date && dday(t.date)>=0 && dday(t.date)<=2)
  .sort((a,b)=>a.date<b.date?-1:1);
const nextTests = () => S.ops.tests.filter(t => !t.done && t.date && dday(t.date)>=0)
  .sort((a,b)=>a.date<b.date?-1:1);
const ddayLabel = d => { const n=dday(d); return n===0?"오늘":n===1?"내일":n===2?"모레":n>0?"D-"+n:"지남"; };

function renderNav(){
  const due=unpaid().length+needCheck().length, iss=openIssues().length;

  $("#nav").innerHTML = NAVGROUPS.map(([title,items])=>

      const icon = `<span class="ico" aria-hidden="true">${ico||""}</span>`;
      if(href) return `<a class="ext" href="${href}">${icon}${label}<span class="arr">↗</span></a>`;
      let tail="";
      if(k==="payments"&&due) tail=`<span class="b">${due}</span>`;

      else if(k==="supplies"&&low) tail=`<span class="b">${low}</span>`;

      else if(counts[k]) tail=`<span class="c">${counts[k]}</span>`;
      return `<button data-tab="${k}"${view===k?' aria-current="page"':""}>${icon}${label}${tail}</button>`;

let calY=null, calM=null;
function vCalendar(){
  const now=new Date();
  if(calY==null){ calY=now.getFullYear(); calM=now.getMonth(); }
  const first=new Date(calY,calM,1), start=new Date(first); start.setDate(1-first.getDay());
  const cells=[]; const t=today();
  for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i);
    const iso=fmtDate(d);
    cells.push({iso, day:d.getDate(), out:d.getMonth()!==calM, sun:d.getDay()===0, today:iso===t}); }
  while(cells.length>35 && cells.slice(35).every(c=>c.out)) cells.length=35;
  const byDate={}; S.events.forEach(e=>(byDate[e.date]=byDate[e.date]||[]).push(e));
  const monthEv=S.events.filter(e=>String(e.date).startsWith(`${calY}-${pad(calM+1)}`)).length;
  return `<section>
    <div class="sec-row"><h2 class="sec">달력</h2><span class="hint">이번 달 일정 ${monthEv}건</span></div>
    <div class="cal-head">
      <button class="btn ghost sm" data-cal="-1">‹ 이전</button>
      <span class="m">${calY}년 ${calM+1}월</span>
      <button class="btn ghost sm" data-cal="1">다음 ›</button>
      <button class="btn ghost sm" data-cal="0">오늘</button>
      <span class="legend" style="margin:0 0 0 auto">${EVTYPES.map(t=>`<span><i class="ev ${t}" style="width:11px;height:11px;padding:0;border-radius:3px;border-left-width:11px"></i>${t}</span>`).join("")}</span>
    </div>
    <div class="cal">
      ${["일","월","화","수","목","금","토"].map((d,i)=>`<div class="dow${i===0?" sun":""}">${d}</div>`).join("")}
      ${cells.map(c=>`<button class="cell${c.out?" out":""}${c.sun?" sun":""}${c.today?" today":""}" data-day="${c.iso}">
        <span class="dn">${c.day}</span>
        ${(byDate[c.iso]||[]).slice(0,3).map(e=>`<span class="ev ${e.type}" data-ev="${e.id}">${esc(e.title)}</span>`).join("")}
        ${(byDate[c.iso]||[]).length>3?`<span class="ev" style="border:0;background:none;color:var(--ink-3)">+${(byDate[c.iso]||[]).length-3}건</span>`:""}
      </button>`).join("")}
    </div>
    <p class="note">날짜를 누르면 일정을 추가하고, 일정을 누르면 수정합니다.</p>
  </section>`;
}

  const soon=soonTests();
  const row=t=>{const n=t.date?dday(t.date):null, near=n!=null&&n>=0&&n<=2;
    return `<tr data-op="test:${t.id}"${near&&!t.done?' style="background:var(--warn-bg)"':""}>
    <td class="n0">${esc(t.date||"—")}</td>
    <td>${t.date?`<span class="pill ${n===0?"no":near?"wr":"nu"}">${ddayLabel(t.date)}</span>`:""}</td>
    <td><b>${esc(t.title)}</b></td><td>${esc(t.type||"")}</td><td>${esc(t.target||"")}</td>
    <td class="cut">${esc(t.scope||"")}</td><td>${esc(t.teacher||"")}</td>
    <td>${t.done?'<span class="pill ok">완료</span>':'<span class="pill nu">예정</span>'}</td></tr>`;};
  return `<section>
    <div class="sec-row"><h2 class="sec">테스트 일정</h2><span class="hint">예정 ${up.length}건</span>
      <span class="spacer"></span><button class="btn sm" data-addop="test">+ 테스트 추가</button></div>
    ${soon.length?`<div class="banner warn"><b>이틀 안에 테스트가 ${soon.length}건 있습니다.</b><br>
      ${soon.map(t=>`${ddayLabel(t.date)} · ${esc(t.title)}${t.target?" ("+esc(t.target)+")":""}`).join("<br>")}</div>`:""}
    <div class="tw panel"><table class="clk" style="min-width:760px"><thead><tr><th>일자</th><th>남은날</th>
      <th>테스트명</th><th>구분</th><th>대상</th><th>범위</th><th>담당T</th><th>상태</th></tr></thead><tbody>
      ${up.map(row).join("") || `<tr><td colspan="8" class="empty">예정된 테스트가 없습니다</td></tr>`}
    </tbody></table></div>
    ${donePast.length?`<div class="sec-row" style="margin-top:8px"><h2 class="sec" style="font-size:18px">지난 테스트</h2>
      <span class="hint">${donePast.length}건</span></div>
      <div class="tw panel"><table class="clk" style="min-width:760px"><thead><tr><th>일자</th><th></th>
        <th>테스트명</th><th>구분</th><th>대상</th><th>범위</th><th>담당T</th><th>상태</th></tr></thead>
        <tbody>${donePast.slice(0,25).map(row).join("")}</tbody></table></div>`:""}
    <p class="note">테스트 날짜가 <b>이틀 앞</b>으로 다가오면 이 화면과 대시보드 맨 위에 경고가 뜹니다. 반 단위 시험 점수 입력은 학원관리 [성적]입니다.</p></section>`;
}

/* ---------- 운영 항목 편집 (시재 · 테스트) ---------- */
const OPS={
  supply:{list:"supplies", sheet:"supplies", title:"시재 품목", fields:[
    ["name","품목명","text"],["category","구분","select",SUP_CAT],
    ["qty","현재 수량","number"],["minQty","최소 보유량","number"],
    ["unit","단위","text"],["lastIn","최근 입고일","date"],
    ["vendor","구입처","text"],["note","비고","textarea"]]},
  test:{list:"tests", sheet:"tests", title:"테스트", fields:[
    ["date","일자","date"],["title","테스트명","text"],
    ["type","구분","select",TEST_TYPE],["target","대상 반 / 학생","text"],
    ["teacher","담당T","select",TEACHERS],["scope","범위","text"],
    ["note","준비물 · 비고","textarea"]]},
};
function editOp(kind, id){
  const cfg=OPS[kind], arr=S.ops[cfg.list];
  const rec = id ? arr.find(x=>x.id===id) : null;
  const wide=f=>f[2]==="textarea";
  const one=([k,label,type,opt])=>{
    const cur = rec ? (rec[k]==null?"":rec[k]) : (k==="date"?today():"");
    const opts = k==="teacher" ? TEACHERS : opt;
    if(type==="select") return `<div class="fld"><label for="o-${k}">${label}</label><select class="inp" id="o-${k}">
      <option value=""></option>${opts.map(o=>`<option${String(cur)===o?" selected":""}>${o}</option>`).join("")}</select></div>`;
    if(type==="textarea") return `<div class="fld"><label for="o-${k}">${label}</label><textarea class="inp" id="o-${k}">${esc(cur)}</textarea></div>`;
    return `<div class="fld"><label for="o-${k}">${label}</label><input class="inp" id="o-${k}" type="${type}" value="${esc(cur)}"></div>`;
  };
  const pair=cfg.fields.filter(f=>!wide(f)), full=cfg.fields.filter(wide);
  openDrawer(cfg.title, id?"수정":"새 항목",
    `<div class="grid2">${pair.map(one).join("")}</div>${full.map(one).join("")}
     ${kind==="supply"?`<p class="note">현재 수량을 비워두면 알림 대상에서 빠집니다.</p>`:""}
     ${kind==="test"&&rec?`<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)">
       <input type="checkbox" id="o-done" ${rec.done?"checked":""} style="width:16px;height:16px;accent-color:var(--accent)">완료 처리</label>`:""}`,
    async ()=>{ const o = {id: rec?rec.id:""};
      cfg.fields.forEach(([k,,type])=>{ const el=$("#o-"+k); if(!el) return; o[k] = type==="number" ? (el.value===""?"":Number(el.value)) : el.value.trim(); });
      if($("#o-done")) o.done=$("#o-done").checked; else o.done = rec ? !!rec.done : false;
      const saved=await call("adminSave",{sheet:cfg.sheet, row:o});
      const i=arr.findIndex(x=>x.id===saved.id); if(i>=0) arr[i]=saved; else arr.push(saved);
      toast("저장했습니다"); render(); },
    id?"저장":"추가",
    id ? async ()=>{ await call("adminDelete",{sheet:cfg.sheet, id}); S.ops[cfg.list]=arr.filter(x=>x.id!==id); toast("삭제했습니다"); render(); } : null);
}

/* ---------- 점검 · 옛 자료 가져오기 ---------- */
function vIssues(){
  const P={"높음":0,"중간":1,"낮음":2};
  const list=[...S.issues].sort((a,b)=>(a.done-b.done)||((P[a.priority]??3)-(P[b.priority]??3)));
  const n=p=>S.issues.filter(i=>i.priority===p&&!i.done).length, tot=Math.max(openIssues().length,1);
  return `<section><div class="sec-row"><h2 class="sec">데이터 정합성</h2><span class="hint">미처리 ${openIssues().length} / ${S.issues.length}건</span></div>
  <div class="panel pad">
    <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px">
      <i style="background:var(--due);width:${n("높음")/tot*100}%"></i>
      <i style="background:var(--warn);width:${n("중간")/tot*100}%"></i>
      <i style="background:var(--accent);width:${n("낮음")/tot*100}%"></i></div>
    <div class="legend" style="margin:10px 0 0">
      <span><i style="background:var(--due)"></i>높음 ${n("높음")}건</span>
      <span><i style="background:var(--warn)"></i>중간 ${n("중간")}건</span>
      <span><i style="background:var(--accent)"></i>낮음 ${n("낮음")}건</span></div></div>
  <div class="panel pad"><div class="flags">${list.map(i=>`<div class="issue${i.done?" done":""}">
    <input type="checkbox" data-iss="${i.id}"${i.done?" checked":""} aria-label="${esc(i.target)} 처리 완료">
    <div><div class="ti">${esc(i.category)} — ${esc(i.target)}</div><div class="de">${esc(i.detail)}</div>
    <div class="ac">→ ${esc(i.action)}</div></div>
    <span class="pill ${i.priority==="높음"?"no":i.priority==="중간"?"wr":"nu"}">${esc(i.priority||"")}</span></div>`).join("") || `<div class="empty">점검 항목이 없습니다</div>`}</div></div>
  <p class="note">체크하면 처리 완료로 저장됩니다. 원본 데이터는 <a href="${LINKS.sheet}" target="_blank" rel="noopener">구글 시트</a>에 그대로 있습니다.</p>
  <div class="panel pad"><div class="sub-h">옛 원장실(Claude) 자료 가져오기</div>
    <p class="note">Claude 원장실에서 내려받은 JSON 파일(달력·시재·점검·개별 청구·기록카드)을 이 시트에 넣습니다.
      학생·반·수강은 이미 학원관리에 있으므로 가져오지 않습니다. 같은 파일을 다시 넣어도 중복되지 않습니다.</p>
    <div class="bar-tools"><input type="file" id="imp-file" accept=".json,application/json" class="inp">
      <button class="btn sm" id="imp-go" disabled>가져오기</button></div>
    <p class="note" style="margin-top:8px">휴대폰이라 파일을 올리기 어려우면, 옛 자료를 옮겨 둔 <b>구글 시트 주소</b>를 넣어 가져올 수 있습니다
      (첫 탭 A열에 내보내기 JSON 을 그대로 붙여 넣은 시트, 또는 탭 이름이 events·supplies·issues·gradebook·profiles·bills·meta 인 시트).
      원장 구글 계정이 열 수 있는 시트여야 합니다.</p>
    <div class="bar-tools"><button class="btn sm" id="imp-sheet">구글 시트에서 가져오기</button></div>
    <div class="note" id="imp-out" style="margin-top:8px;white-space:pre-wrap">${esc(impReport)}</div></div>
  </section>`;
}
let impData=null, impReport="";
function impDone(r){
  const label={events:"달력",tests:"테스트",supplies:"시재",issues:"점검",gradebook:"기록",profiles:"프로필",bills:"청구",meta:"학기/수강료표"};
  impReport = "가져오기 완료 (" + new Date().toLocaleString("ko-KR") + "): " + Object.keys(r).filter(k=>label[k]).map(k=>`${label[k]} ${r[k]===true?"저장":r[k]}`).join(" · ")
    + (r.sheet ? `\n시트: ${r.sheet}` : "")
    + (r.skippedCount ? `\n건너뜀 ${r.skippedCount}건: ${r.skipped.join(", ")}` : "");
}
async function importSheet(){
  const id=prompt("옛 자료가 든 구글 시트의 주소(URL) 또는 ID 를 넣어 주세요.");
  if(!id || !id.trim()) return;
  if(!confirm("이 시트의 자료를 원장실 시트에 넣습니다.\n청구의 납부액은 학원관리 수납에도 기록됩니다. 진행할까요?")) return;
  const btn=$("#imp-sheet"), out=$("#imp-out"); btn.disabled=true; btn.textContent="넣는 중… (1~2분)"; out.textContent="";
  try{
    const r = await call("adminImportSheet", {sheetId:id.trim()});
    impDone(r); await refresh(); render(); toast("옛 자료를 넣었습니다");
  }catch(err){ out.textContent="실패: "+friendly(err); btn.disabled=false; btn.textContent="구글 시트에서 가져오기"; }
}
async function importOld(){
  if(!impData) return;
  const cnt=k=>Array.isArray(impData[k])?impData[k].length:0;
  const summary=`달력 ${cnt("events")} · 테스트 ${cnt("tests")} · 시재 ${cnt("supplies")} · 점검 ${cnt("issues")} · 기록 ${cnt("gradebook")} · 프로필 ${cnt("profiles")} · 청구 ${cnt("bills")}`;
  if(!confirm("옛 원장실 자료를 시트에 넣습니다.\n"+summary+"\n\n청구의 납부액은 학원관리 수납에도 기록됩니다. 진행할까요?")) return;
  const btn=$("#imp-go"), out=$("#imp-out"); btn.disabled=true; btn.textContent="넣는 중… (1~2분)"; out.textContent="";
  try{
    const r = await call("adminImport", impData);
    impDone(r); impData=null; await refresh(); render(); toast("옛 자료를 넣었습니다");
  }catch(err){ out.textContent="실패: "+friendly(err); btn.disabled=false; btn.textContent="가져오기"; }
}

/* ---------- drawer ---------- */
let onSave=null;
function openDrawer(title, sub, body, saver, label, remover){
  onSave=saver;
  $("#drawer").innerHTML=`<div class="dr-head"><div><h3 id="dr-title">${title}</h3><div class="sub">${sub}</div></div>
    <button class="x" id="dr-x" aria-label="닫기">×</button></div>
    <div class="dr-body">${body}</div>
    ${saver?`<div class="dr-foot"><button class="btn" id="dr-save">${label||"저장"}</button>
      <button class="btn ghost" id="dr-cancel">취소</button>
      ${remover?`<button class="btn danger sp" id="dr-del">삭제</button>`:""}</div>`:""}`;
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on");
  const f=$(".dr-body input,.dr-body select,.dr-body textarea"); if(f) f.focus();
  $("#dr-x").onclick=closeDrawer;
  if($("#dr-cancel")) $("#dr-cancel").onclick=closeDrawer;
  if($("#dr-save")) $("#dr-save").onclick=async e=>{ e.target.disabled=true;
    try{ await onSave(); closeDrawer(); }
    catch(err){ e.target.disabled=false; failedInDrawer(err); } };
  /* 삭제는 두 번 누르기로 확인한다 */
  if($("#dr-del")) $("#dr-del").onclick=async e=>{
    const b=e.target;
    if(b.dataset.arm!=="1"){ b.dataset.arm="1"; b.textContent="정말 삭제"; setTimeout(()=>{ if(b.isConnected){ b.dataset.arm=""; b.textContent="삭제"; } }, 4000); return; }
    b.disabled=true;
    try{ await remover(); closeDrawer(); }catch(err){ b.disabled=false; failedInDrawer(err); } };
}
/* 서버가 거부한 게 아니라 그 전에 화면 스크립트가 터진 경우도 숨기지 않는다 */
function failedInDrawer(err){
  if(err && err.code) return;   // 서버 오류는 call() 이 이미 알렸다
  const text = "저장 전에 오류가 났습니다: " + (err && (err.name + ": " + err.message) || String(err));
  console.error("drawer", err);
  showDrawerError(text, false); showBanner(text, false); toast("저장하지 못했습니다", true);
}
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); onSave=null; }
$("#scrim").onclick=closeDrawer;
addEventListener("keydown", e=>{ if(e.key==="Escape") closeDrawer(); });

/* ---------- wiring ---------- */
function wire(){
  const app=$("#app");
  $$("[data-goto]",app).forEach(b=>b.onclick=e=>{e.preventDefault(); go(b.dataset.goto);});
  $$("[data-stu]",app).forEach(r=>r.onclick=e=>{e.stopPropagation(); editStudent(r.dataset.stu);});
  $$("[data-pay]",app).forEach(r=>r.onclick=()=>editPayment(r.dataset.pay));
  $$("[data-cls]",app).forEach(r=>r.onclick=()=>showClass(r.dataset.cls));
  $$("[data-fp]",app).forEach(b=>b.onclick=()=>{fP=b.dataset.fp; render();});
  $$("[data-rec]",app).forEach(b=>b.onclick=()=>{recStu=b.dataset.rec; render();});
  $$("[data-ed]",app).forEach(r=>r.onclick=()=>{const [k,id]=r.dataset.ed.split(":"); editRec(k,id);});
  $$("[data-add]",app).forEach(b=>b.onclick=()=>editRec(b.dataset.add,null));
  $$("[data-prof]",app).forEach(b=>b.onclick=()=>editProfile(b.dataset.prof));
  $$("[data-op]",app).forEach(r=>r.onclick=()=>{const [k,id]=r.dataset.op.split(":"); editOp(k,id);});
  $$("[data-addop]",app).forEach(b=>b.onclick=()=>editOp(b.dataset.addop,null));
  const pr=$("#rec-print"); if(pr) pr.onclick=()=>window.print();
  $$("[data-cal]",app).forEach(b=>b.onclick=()=>{ const d=+b.dataset.cal;
    if(d===0){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
    else { calM+=d; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} } render(); });
  $$("[data-day]",app).forEach(c=>c.onclick=e=>{ const ev=e.target.closest("[data-ev]");
    if(ev) editEvent(ev.dataset.ev); else editEvent(null, c.dataset.day); });
  const rs=$("#rec-stu"); if(rs) rs.onchange=()=>{recStu=rs.value; render();};
  const q=$("#q"); if(q) q.oninput=()=>{ const p=q.selectionStart; fS.q=q.value.trim(); render();
    const n=$("#q"); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const st=$("#st"); if(st) st.onchange=()=>{fS.status=st.value; render();};
  const d=$("#dept"); if(d) d.onchange=()=>{fS.dept=d.value; render();};
  const h=$("#hr"); if(h) h.onchange=()=>{fS.hr=h.value; render();};
  const fl=$("#flag"); if(fl) fl.onclick=()=>{fS.flag=!fS.flag; render();};
  const cc=$("#cls-closed"); if(cc) cc.onclick=()=>{fC.closed=!fC.closed; render();};
  const ap=$("#addpay"); if(ap) ap.onclick=addPayment;
  $$("[data-iss]",app).forEach(cb=>cb.onchange=async()=>{ const i=S.issues.find(x=>x.id===cb.dataset.iss); if(!i) return;
    const was=i.done; i.done=cb.checked;
    try{ await call("adminSave",{sheet:"issues", row:i}); render(); }catch(e){ i.done=was; cb.checked=was; } });
  const f=$("#imp-file"); if(f) f.onchange=()=>{ const file=f.files[0]; impData=null; $("#imp-go").disabled=true; if(!file) return;
    file.text().then(t=>{ try{ const j=JSON.parse(t); if(!j || typeof j!=="object" || !("events" in j || "bills" in j || "supplies" in j)) throw new Error("형식");
      impData=j; $("#imp-go").disabled=false; $("#imp-out").textContent=`파일 확인: 달력 ${(j.events||[]).length} · 시재 ${(j.supplies||[]).length} · 점검 ${(j.issues||[]).length} · 청구 ${(j.bills||[]).length} · 기록 ${(j.gradebook||[]).length} · 프로필 ${(j.profiles||[]).length}`; }
      catch(e){ $("#imp-out").textContent="원장실 내보내기 파일이 아닙니다."; } }); };
  const ig=$("#imp-go"); if(ig) ig.onclick=importOld;
  const is=$("#imp-sheet"); if(is) is.onclick=importSheet;
}
const h0=(location.hash||"").replace("#/",""); if(h0 && TABS.some(t=>t[0]===h0)) view=h0;
const saved=session.load();
if(saved && saved.token && saved.me){ TOKEN=saved.token; ME=saved.me; }
boot();
</script>
