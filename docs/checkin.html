<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2A5E">
<title>출결 · 더블엠수학학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{ --bg:#1B2A5E; --bg2:#122048; --card:#FFFFFF; --ink:#16213A; --ink-2:#5A6379; --ink-3:#9AA3B5; --rule:#E3E7EF; --cobalt:#2A4BB8; --ok:#2E8B57; --ok-soft:#E3F3EA; --warn:#B45309; --warn-soft:#FEF3C7; --danger:#C8423C; --danger-soft:#FBE4E3; --key:#F3F5FA; }
  *{box-sizing:border-box} [hidden]{display:none!important} html,body{height:100%} body{margin:0;font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);-webkit-user-select:none;user-select:none;overflow:hidden;touch-action:manipulation}
  .top{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:14px 22px;font-weight:700} .top .name{font-size:20px} .top .name small{opacity:.75;font-weight:500;margin-left:8px;font-size:14px} .top .clock{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em} .top .clock small{display:block;font-size:12.5px;opacity:.75;text-align:right;font-weight:500}
  .wrap{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:18px;padding:0 22px 22px;height:calc(100% - 62px)}
  .pad{background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .side{background:rgba(255,255,255,.08);border-radius:22px;padding:18px 20px;color:#fff;overflow:auto;border:1px solid rgba(255,255,255,.12)}
  .hint{color:var(--ink-2);font-size:15px;margin:0 0 10px;text-align:center;line-height:1.45}
  .digits{display:flex;justify-content:center;gap:14px;margin:6px 0 16px}
  .digits span{width:56px;height:68px;border:2px solid var(--rule);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;background:var(--key);font-variant-numeric:tabular-nums}
  .digits span.on{border-color:var(--cobalt);background:#fff;color:var(--cobalt)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}
  .keys button{border:0;border-radius:16px;background:var(--key);font:inherit;font-size:34px;font-weight:700;color:var(--ink);cursor:pointer;min-height:64px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
  .keys button:active{background:#DDE3F3;transform:translateY(1px)} .keys button.fn{font-size:18px;color:var(--ink-2);background:#fff;border:1.5px solid var(--rule)}
  .result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(10,16,40,.78);z-index:5} .result.on{display:flex}
  .box{background:#fff;border-radius:24px;padding:26px 28px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .box h2{margin:0 0 6px;font-size:26px;font-weight:900} .box p{margin:0 0 16px;color:var(--ink-2);font-size:16px}
  .stu{display:flex;align-items:center;gap:14px;border:2px solid var(--rule);border-radius:16px;padding:14px 16px;margin-bottom:10px;background:#fff;cursor:pointer;font:inherit;width:100%;text-align:left}
  .stu:active{background:var(--key)} .stu .nm{font-size:24px;font-weight:900} .stu .sub{color:var(--ink-2);font-size:14px} .stu .st{margin-left:auto;font-size:14px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .stu .st.in{color:var(--ok)} .stu .st.out{color:var(--warn)}
  .acts{display:flex;gap:12px;margin-top:8px} .acts button{flex:1;border:0;border-radius:18px;font:inherit;font-size:26px;font-weight:900;padding:22px 10px;cursor:pointer;color:#fff}
  .acts .in{background:var(--ok)} .acts .out{background:var(--warn)} .acts .cancel{flex:0 0 auto;background:var(--key);color:var(--ink-2);font-size:18px;font-weight:700;padding:0 22px}
  .done{text-align:center} .done .big{font-size:64px;line-height:1;margin:6px 0 12px} .done h2{font-size:30px} .done .sub{font-size:17px;color:var(--ink-2);line-height:1.5} .done .bar{height:6px;background:var(--rule);border-radius:3px;margin-top:18px;overflow:hidden} .done .bar i{display:block;height:100%;background:var(--ok);width:100%;transition:width 3s linear}
  .done.warn .bar i{background:var(--warn)}
  .side h3{margin:0 0 4px;font-size:17px;display:flex;align-items:baseline;gap:10px} .side h3 small{font-weight:500;opacity:.8;font-size:13px}
  .side .cnt{display:flex;gap:18px;margin:8px 0 14px} .side .cnt b{font-size:30px;font-weight:900} .side .cnt span{font-size:13px;opacity:.85;display:block}
  .side ul{list-style:none;margin:0;padding:0} .side li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15px} .side li .t{font-variant-numeric:tabular-nums;opacity:.85;width:52px} .side li .k{margin-left:auto;font-size:12.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.15)} .side li .k.in{background:rgba(99,192,138,.35)} .side li .k.out{background:rgba(251,191,36,.3)}
  .side .empty{opacity:.7;font-size:14px;padding:12px 0}
  .setup{max-width:520px;margin:6vh auto;background:#fff;border-radius:22px;padding:26px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .setup h2{margin:0 0 6px} .setup p{color:var(--ink-2);font-size:14.5px;line-height:1.5;margin:0 0 14px} .setup label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px} .setup input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px} .setup button{width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--cobalt);color:#fff;font:inherit;font-size:19px;font-weight:700;padding:16px;cursor:pointer}
  .err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16213A;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw} .toast.show{opacity:1}
  .gear{position:fixed;right:10px;bottom:8px;opacity:.35;color:#fff;font-size:12px;background:transparent;border:0;cursor:pointer}
  @media (max-width:820px){ .wrap{grid-template-columns:1fr;height:auto;padding-bottom:12px} body{overflow:auto} .side{max-height:36vh} .keys button{min-height:58px;font-size:30px} .digits span{width:50px;height:60px;font-size:30px} }
</style>
</head>
<body>
<script src="config.js"></script>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const API_URL = (window.MM_API_URL || '').trim();
  const LS = 'mm-checkin-device';
  const ACADEMY = '더블엠수학학원';
  let device = null; try { device = JSON.parse(localStorage.getItem(LS) || 'null'); } catch { device = null; }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500); };
  async function api(action, payload = {}) {
    if (!API_URL) throw { message: 'config.js 에 서버 주소가 없습니다.' };
    let res; try { res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, device: device ? device.token : '', ...payload }) }); }
    catch { throw { code: 'network', message: '인터넷 연결을 확인하세요.' }; }
    let out; try { out = await res.json(); } catch { throw { code: 'server', message: '서버가 응답하지 않습니다. 잠시 뒤 다시 시도하세요.' }; }
    if (!out.ok) { if (out.error === 'unauthorized') { localStorage.removeItem(LS); device = null; renderSetup(out.message); } throw { code: out.error, message: out.message }; }
    return out.data;
  }
  // ---------- 기기 등록 ----------
  function renderSetup(msg) {
    $('#app').innerHTML = `<div class="setup"><h2>출결 태블릿 등록</h2><p>${ACADEMY} 출결 태블릿입니다. 관리자가 학원관리 → 출석부 → [출결 태블릿]에서 정한 PIN 을 넣으면 이 기기가 등록됩니다. 한 번만 하면 됩니다.</p>
      <label>태블릿 이름</label><input id="dName" placeholder="예: 데스크 태블릿" maxlength="30" value="${esc(device && device.name || '데스크 태블릿')}">
      <label>관리자 PIN</label><input id="dPin" type="password" inputmode="numeric" placeholder="숫자 4~8자리" maxlength="8">
      <div class="err" id="dErr">${esc(msg || '')}</div><button id="dGo">등록</button></div>`;
    $('#dGo').onclick = async () => {
      const name = $('#dName').value.trim() || '태블릿', pin = $('#dPin').value.trim(); if (!pin) { $('#dErr').textContent = 'PIN 을 넣으세요.'; return; }
      $('#dGo').disabled = true; $('#dErr').textContent = '';
      try { const d = await api('kioskRegister', { pin, name }); device = { token: d.device, name: d.name }; localStorage.setItem(LS, JSON.stringify(device)); renderMain(); toast('등록됐습니다'); }
      catch (ex) { $('#dErr').textContent = ex.message || '등록하지 못했습니다'; $('#dGo').disabled = false; }
    };
    setTimeout(() => $('#dPin').focus(), 50);
  }
  // ---------- 본 화면 ----------
  let digits = '', busy = false, today = null;
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function renderMain() {
    $('#app').innerHTML = `<div class="top"><div class="name">${ACADEMY}<small>출결 · ${esc(device.name)}</small></div><div class="clock" id="clock"></div></div>
      <div class="wrap"><div class="pad" style="position:relative">
        <p class="hint">학생 휴대폰 또는 학부모 휴대폰 번호 <b>뒷자리 4개</b>를 누르세요</p>
        <div class="digits" id="digits"></div>
        <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="fn" data-k="clear">지우기</button><button data-k="0">0</button><button class="fn" data-k="back">←</button></div>
      </div>
      <div class="side"><h3>오늘 등하원 <small id="sideDate"></small></h3><div class="cnt"><div><b id="cntIn">-</b><span>등원</span></div><div><b id="cntOut">-</b><span>하원</span></div></div><ul id="sideList"><li class="empty">불러오는 중…</li></ul></div></div>
      <div class="result" id="result"></div><button class="gear" id="gear">기기 설정</button>`;
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
    $('#gear').onclick = () => { if (confirm('이 태블릿의 등록을 지우고 다시 등록할까요?')) { localStorage.removeItem(LS); device = null; renderSetup(); } };
    drawDigits(); tick(); loadToday();
  }
  function tick() { const c = $('#clock'); if (!c) return; const d = new Date(); c.innerHTML = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}<small>${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</small>`; }
  setInterval(tick, 1000);
  function drawDigits() { const b = $('#digits'); if (!b) return; b.innerHTML = [0, 1, 2, 3].map(i => `<span class="${digits[i] ? 'on' : ''}">${digits[i] || ''}</span>`).join(''); }
  async function press(k) {
    if (busy) return;
    if (k === 'clear') { digits = ''; drawDigits(); return; }
    if (k === 'back') { digits = digits.slice(0, -1); drawDigits(); return; }
    if (digits.length >= 4) return;
    digits += k; drawDigits();
    if (digits.length === 4) { busy = true; try { const list = await api('kioskLookup', { digits }); showPick(list); } catch (ex) { toast(ex.message || '찾지 못했습니다'); digits = ''; drawDigits(); } finally { busy = false; } }
  }
  function showPick(list) {
    const r = $('#result');
    if (!list.length) { r.innerHTML = `<div class="box done warn"><div class="big">🔍</div><h2>번호를 찾지 못했습니다</h2><p class="sub">뒷자리 <b>${esc(digits)}</b> 로 등록된 재원생이 없습니다. 다시 눌러 보거나 데스크에 말씀해 주세요.</p><div class="acts"><button class="cancel" style="flex:1" id="rClose">다시 입력</button></div></div>`; r.classList.add('on'); $('#rClose').onclick = closeResult; setTimeout(() => { if (r.classList.contains('on') && $('#rClose')) closeResult(); }, 6000); return; }
    r.innerHTML = `<div class="box"><h2>${list.length === 1 ? '본인이 맞나요?' : '누구인가요?'}</h2><p>이름을 누른 뒤 등원 또는 하원을 고르세요</p>
      ${list.map(s => `<button class="stu" data-sid="${s.id}"><span><span class="nm">${esc(s.name)}</span> <span class="sub">${esc(s.grade)}${s.school ? ' · ' + esc(s.school) : ''}</span></span><span class="st ${s.lastKind === '등원' ? 'in' : s.lastKind === '하원' ? 'out' : ''}">${s.lastKind ? `${esc(s.lastTime)} ${esc(s.lastKind)}` : '오늘 첫 기록'}</span></button>`).join('')}
      <div class="acts" id="kindActs" hidden><button class="in" data-kind="등원">등원</button><button class="out" data-kind="하원">하원</button><button class="cancel" id="rCancel">취소</button></div>
      <div class="acts" id="cancelOnly"><button class="cancel" style="flex:1" id="rClose">취소</button></div></div>`;
    r.classList.add('on');
    let picked = list.length === 1 ? list[0] : null;
    const highlight = () => { r.querySelectorAll('.stu').forEach(b => { b.style.borderColor = picked && b.dataset.sid === picked.id ? 'var(--cobalt)' : ''; b.style.background = picked && b.dataset.sid === picked.id ? '#EEF2FF' : ''; }); $('#kindActs').hidden = !picked; $('#cancelOnly').hidden = !!picked; const nx = picked ? picked.next : ''; r.querySelectorAll('[data-kind]').forEach(b => b.style.opacity = nx && b.dataset.kind !== nx ? '.55' : '1'); };
    r.querySelectorAll('.stu').forEach(b => b.onclick = () => { picked = list.find(s => s.id === b.dataset.sid); highlight(); });
    r.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => doCheck(picked, b.dataset.kind));
    $('#rCancel').onclick = closeResult; $('#rClose').onclick = closeResult;
    highlight();
  }
  async function doCheck(s, kind) {
    if (!s || busy) return; busy = true;
    const r = $('#result'); r.innerHTML = `<div class="box done"><div class="big">⏳</div><h2>${esc(s.name)} ${kind} 처리 중…</h2></div>`;
    try {
      const d = await api('kioskCheck', { studentId: s.id, kind });
      const smsTxt = d.sms === '문자 발송' ? '학부모님께 알림 문자를 보냈습니다' : d.sms === '학부모 번호 없음' ? '학부모 번호가 없어 문자는 보내지 않았습니다' : d.sms === '문자 끔' || d.sms === '문자 API 미설정' ? '' : d.sms ? '알림 문자: ' + d.sms : '';
      r.innerHTML = `<div class="box done ${d.dup ? 'warn' : ''}"><div class="big">${d.dup ? '⚠️' : kind === '등원' ? '✅' : '👋'}</div><h2>${esc(s.name)} 학생 ${d.dup ? '이미 ' + kind + ' 처리됨' : kind + ' 완료'}</h2><p class="sub">${esc(d.time)}${d.att ? ' · ' + esc(d.att) : ''}${smsTxt ? '<br>' + esc(smsTxt) : ''}${d.dup ? '<br>' + esc(d.message) : ''}</p><div class="bar"><i></i></div></div>`;
      requestAnimationFrame(() => { const i = r.querySelector('.bar i'); if (i) i.style.width = '0%'; });
      loadToday(); setTimeout(closeResult, 3200);
    } catch (ex) { r.innerHTML = `<div class="box done warn"><div class="big">⚠️</div><h2>처리하지 못했습니다</h2><p class="sub">${esc(ex.message || '')}</p><div class="acts"><button class="cancel" style="flex:1" id="rClose">닫기</button></div></div>`; $('#rClose').onclick = closeResult; }
    finally { busy = false; }
  }
  function closeResult() { const r = $('#result'); if (r) { r.classList.remove('on'); r.innerHTML = ''; } digits = ''; drawDigits(); }
  async function loadToday() {
    try { today = await api('kioskToday'); } catch { return; }
    const d = $('#sideDate'); if (!d) return; d.textContent = today.date.slice(5).replace('-', '/');
    $('#cntIn').textContent = today.inCount; $('#cntOut').textContent = today.outCount;
    $('#sideList').innerHTML = today.rows.length ? today.rows.map(x => `<li><span class="t">${esc(x.time)}</span><span>${esc(x.name)}</span><span class="k ${x.kind === '등원' ? 'in' : 'out'}">${esc(x.kind)}</span></li>`).join('') : '<li class="empty">아직 기록이 없습니다</li>';
  }
  setInterval(() => { if (device && !busy && !$('#result')?.classList.contains('on')) loadToday(); }, 60000);
  document.addEventListener('keydown', e => { if (!device || $('#result')?.classList.contains('on')) return; if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('back'); else if (e.key === 'Escape') press('clear'); });
  if (device && device.token) renderMain(); else renderSetup();
})();
</script>
</body>
</html>
