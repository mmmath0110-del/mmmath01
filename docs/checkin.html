<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2A5E">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="checkin.webmanifest">
<link rel="icon" href="icons/checkin-192.png">
<link rel="apple-touch-icon" href="icons/checkin-192.png">
<title>출결 · 더블엠수학학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{ --bg:#1B2A5E; --bg2:#122048; --card:#FFFFFF; --ink:#16213A; --ink-2:#5A6379; --ink-3:#9AA3B5; --rule:#E3E7EF; --cobalt:#2A4BB8; --ok:#2E8B57; --ok-soft:#E3F3EA; --warn:#B45309; --warn-soft:#FEF3C7; --danger:#C8423C; --danger-soft:#FBE4E3; --key:#F3F5FA; }
  *{box-sizing:border-box} [hidden]{display:none!important} html,body{height:100%} body{margin:0;font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);-webkit-user-select:none;user-select:none;overflow:hidden;touch-action:manipulation}
  .top{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:14px 22px;font-weight:700} .top .name{font-size:20px} .top .name small{opacity:.75;font-weight:500;margin-left:8px;font-size:14px} .top .clock{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em} .top .clock small{display:block;font-size:12.5px;opacity:.75;text-align:right;font-weight:500}
  .wrap{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:18px;padding:0 22px 22px;height:calc(100% - 62px)}
  .pad{background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .side{background:rgba(255,255,255,.08);border-radius:22px;padding:18px 20px;color:#fff;overflow:auto;border:1px solid rgba(255,255,255,.12)}
  .hint{color:var(--ink-2);font-size:15px;margin:0 0 10px;text-align:center;line-height:1.45}
  .digits{display:flex;justify-content:center;gap:14px;margin:6px 0 16px}
  .digits span{width:56px;height:68px;border:2px solid var(--rule);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;background:var(--key);font-variant-numeric:tabular-nums}
  .digits span.on{border-color:var(--cobalt);background:#fff;color:var(--cobalt)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}
  .keys button{border:0;border-radius:16px;background:var(--key);font:inherit;font-size:34px;font-weight:700;color:var(--ink);cursor:pointer;min-height:64px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
  .keys button:active{background:#DDE3F3;transform:translateY(1px)} .keys button.fn{font-size:18px;color:var(--ink-2);background:#fff;border:1.5px solid var(--rule)}
  .modes{display:flex;gap:8px;margin:0 0 12px}
  .modes button{flex:1;border:1.5px solid var(--rule);background:#fff;border-radius:14px;padding:10px 6px;font:inherit;font-size:16px;font-weight:700;color:var(--ink-2);cursor:pointer}
  .modes button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
  .staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;flex:1;align-content:start;overflow:auto;padding-bottom:4px}
  .staffgrid button{border:1.5px solid var(--rule);background:var(--key);border-radius:16px;padding:12px 12px;font:inherit;text-align:left;cursor:pointer;min-height:74px;color:inherit}
  .staffgrid button:active{background:#DDE3F3}
  .staffgrid .nm{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800}
  .staffgrid .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .staffgrid .st{display:block;font-size:13px;color:var(--ink-3);margin-top:5px}
  .staffgrid .st.on{color:var(--ok);font-weight:700} .staffgrid .st.done{color:var(--warn);font-weight:700}
  .staffgrid button.nopin{opacity:.5}
  .staffacts{display:flex;gap:10px;margin-top:12px}
  .staffacts button{flex:1;border:0;border-radius:16px;font:inherit;font-size:22px;font-weight:900;padding:16px 8px;color:#fff;cursor:pointer}
  .staffacts .in{background:var(--ok)} .staffacts .out{background:var(--warn)}
  .staffacts .back{flex:0 0 auto;background:var(--key);color:var(--ink-2);font-size:16px;font-weight:700;padding:0 20px}
  .staffacts button:disabled{opacity:.4}
  .pad.staffpin .digits{margin:2px 0 10px}
  .pad.staffpin .keys{min-height:0}
  .result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(10,16,40,.78);z-index:5} .result.on{display:flex}
  .box{background:#fff;border-radius:24px;padding:26px 28px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .box h2{margin:0 0 6px;font-size:26px;font-weight:900} .box p{margin:0 0 16px;color:var(--ink-2);font-size:16px}
  .stu{display:flex;align-items:center;gap:14px;border:2px solid var(--rule);border-radius:16px;padding:14px 16px;margin-bottom:10px;background:#fff;cursor:pointer;font:inherit;width:100%;text-align:left}
  .stu:active{background:var(--key)} .stu .nm{font-size:24px;font-weight:900} .stu .sub{color:var(--ink-2);font-size:14px} .stu .st{margin-left:auto;font-size:14px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .stu .st.in{color:var(--ok)} .stu .st.out{color:var(--warn)}
  .acts{display:flex;gap:12px;margin-top:8px} .acts button{flex:1;border:0;border-radius:18px;font:inherit;font-size:26px;font-weight:900;padding:22px 10px;cursor:pointer;color:#fff}
  .acts .in{background:var(--ok)} .acts .out{background:var(--warn)} .acts .cancel{flex:0 0 auto;background:var(--key);color:var(--ink-2);font-size:18px;font-weight:700;padding:0 22px}
  .done{text-align:center} .done .big{font-size:64px;line-height:1;margin:6px 0 12px} .done h2{font-size:30px} .done .sub{font-size:17px;color:var(--ink-2);line-height:1.5} .done .bar{height:6px;background:var(--rule);border-radius:3px;margin-top:18px;overflow:hidden} .done .bar i{display:block;height:100%;background:var(--ok);width:100%;transition:width 3s linear}
  .done.warn .bar i{background:var(--warn)}
  .side h3{margin:0 0 4px;font-size:17px;display:flex;align-items:baseline;gap:10px} .side h3 small{font-weight:500;opacity:.8;font-size:13px}
  .side .cnt{display:flex;gap:18px;margin:8px 0 14px} .side .cnt b{font-size:30px;font-weight:900} .side .cnt span{font-size:13px;opacity:.85;display:block}
  .side ul{list-style:none;margin:0;padding:0} .side li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15px} .side li .t{font-variant-numeric:tabular-nums;opacity:.85;width:52px} .side li .k{margin-left:auto;font-size:12.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.15)} .side li .k.in{background:rgba(99,192,138,.35)} .side li .k.out{background:rgba(251,191,36,.3)}
  .side .empty{opacity:.7;font-size:14px;padding:12px 0}
  .setup{max-width:520px;margin:6vh auto;background:#fff;border-radius:22px;padding:26px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .setup h2{margin:0 0 6px} .setup p{color:var(--ink-2);font-size:14.5px;line-height:1.5;margin:0 0 14px} .setup label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px} .setup input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px} .setup button{width:100%;margin-top:16px;border:0;border-radius:14px;background:var(--cobalt);color:#fff;font:inherit;font-size:19px;font-weight:700;padding:16px;cursor:pointer}
  .err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#16213A;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw} .toast.show{opacity:1}
  .gear{position:fixed;right:10px;bottom:8px;opacity:.35;color:#fff;font-size:12px;background:transparent;border:0;cursor:pointer}
  .fsbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-left:14px} .fsbtn[hidden]{display:none}
  .fstip{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:13.5px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:8;display:flex;gap:10px;align-items:center} .fstip button{border:0;background:var(--key);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
  @media (max-width:820px){ .wrap{grid-template-columns:1fr;height:auto;padding-bottom:12px} body{overflow:auto} .side{max-height:36vh} .keys button{min-height:58px;font-size:30px} .digits span{width:50px;height:60px;font-size:30px} }
  /* 태블릿 가로 화면: 번호 입력 70% · 오늘 등하원 30%. 학생이 손가락으로 누르는 곳이라 실제 터치 영역(버튼 크기)을 키운다.
     화면 크기에 맞춰 늘어나되(clamp), 4줄 키패드 + 입력칸이 한 화면에 들어가도록 최대값을 묶어 둔다 (스크롤 없음). */
  @media (min-width:821px) and (max-width:1600px), (min-width:1601px) and (pointer:coarse){
    #app{height:100%;display:flex;flex-direction:column}   /* 화면 높이를 그대로 받아 키패드가 남는 공간을 채우게 한다 */
    .wrap{grid-template-columns:70fr 30fr;gap:16px;padding:0 16px 16px;height:auto;flex:1;min-height:0}
    .pad{padding:18px 20px;border-radius:26px;min-height:0}
    .hint{font-size:clamp(16px,1.7vw,24px);margin:0 0 12px}
    .digits{gap:clamp(14px,1.8vw,26px);margin:4px 0 16px}
    .digits span{width:clamp(74px,8vw,132px);height:clamp(88px,12.5vh,160px);font-size:clamp(44px,5vw,78px);border-radius:18px;border-width:3px}
    .keys{gap:clamp(12px,1.3vw,20px);width:100%;max-width:820px;margin:0 auto;grid-auto-rows:1fr}   /* 남는 세로 공간까지 버튼이 나눠 갖는다 (실제 터치 영역 확대) */
    .keys button{min-height:clamp(72px,11.5vh,146px);font-size:clamp(38px,4.2vw,62px);border-radius:20px}
    .keys button.fn{font-size:clamp(20px,2.1vw,30px)}
    .side{padding:16px 18px;border-radius:26px}
    .side h3{font-size:16px} .side .cnt b{font-size:26px} .side .cnt{gap:14px;margin:6px 0 10px}
    .side li{font-size:14px;padding:7px 0} .side li .t{width:46px}
    .top{padding:12px 18px} .top .name{font-size:19px} .top .clock{font-size:21px}
    .fstip{left:auto;right:14px;bottom:14px;transform:none;max-width:330px}   /* 키패드·모드 버튼을 가리지 않게 오른쪽 아래 구석에 */
    .modes button{font-size:19px;padding:13px 8px;border-radius:16px}
    .staffgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
    .staffgrid button{min-height:100px;padding:16px} .staffgrid .nm{font-size:25px} .staffgrid .st{font-size:15px}
    .staffacts button{font-size:26px;padding:20px 8px}
    .pad.staffpin .digits span{width:clamp(56px,5.6vw,92px);height:clamp(60px,8vh,104px);font-size:clamp(32px,3.4vw,54px)}
    .pad.staffpin .keys button{min-height:clamp(54px,8vh,104px);font-size:clamp(30px,3.2vw,50px)}
    .pad.staffpin .keys button.fn{font-size:clamp(17px,1.8vw,26px)}
  }
</style>
</head>
<body>
<script src="config.js"></script>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const API_URL = (window.MM_API_URL || '').trim();
  const LS = 'mm-checkin-device';
  const ACADEMY = '더블엠수학학원';
  let device = null; try { device = JSON.parse(localStorage.getItem(LS) || 'null'); } catch { device = null; }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500); };
  async function api(action, payload = {}) {
    if (!API_URL) throw { message: 'config.js 에 서버 주소가 없습니다.' };
    let res; try { res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, device: device ? device.token : '', ...payload }) }); }
    catch { throw { code: 'network', message: '인터넷 연결을 확인하세요.' }; }
    let out; try { out = await res.json(); } catch { throw { code: 'server', message: '서버가 응답하지 않습니다. 잠시 뒤 다시 시도하세요.' }; }
    if (!out.ok) { if (out.error === 'unauthorized') { localStorage.removeItem(LS); device = null; renderSetup(out.message); } throw { code: out.error, message: out.message }; }
    return out.data;
  }
  // ---------- 기기 등록 ----------
  function renderSetup(msg) {
    $('#app').innerHTML = `<div class="setup"><h2>출결 태블릿 등록</h2><p>${ACADEMY} 출결 태블릿입니다. 관리자가 학원관리 → 출석부 → [출결 태블릿]에서 정한 PIN 을 넣으면 이 기기가 등록됩니다. 한 번만 하면 됩니다.</p>
      <label>태블릿 이름</label><input id="dName" placeholder="예: 데스크 태블릿" maxlength="30" value="${esc(device && device.name || '데스크 태블릿')}">
      <label>관리자 PIN</label><input id="dPin" type="password" inputmode="numeric" placeholder="숫자 4~8자리" maxlength="8">
      <div class="err" id="dErr">${esc(msg || '')}</div><button id="dGo">등록</button></div>`;
    $('#dGo').onclick = async () => {
      const name = $('#dName').value.trim() || '태블릿', pin = $('#dPin').value.trim(); if (!pin) { $('#dErr').textContent = 'PIN 을 넣으세요.'; return; }
      $('#dGo').disabled = true; $('#dErr').textContent = '';
      try { const d = await api('kioskRegister', { pin, name }); device = { token: d.device, name: d.name }; localStorage.setItem(LS, JSON.stringify(device)); renderMain(); toast('등록됐습니다'); }
      catch (ex) { $('#dErr').textContent = ex.message || '등록하지 못했습니다'; $('#dGo').disabled = false; }
    };
    setTimeout(() => $('#dPin').focus(), 50);
  }
  // ---------- 본 화면 ----------
  // mode: student 학생 등하원(번호 뒷자리 4개) | staff 선생님 출퇴근(이름 → 근무번호). 키패드는 그대로 같이 쓴다
  let digits = '', busy = false, today = null, mode = 'student', staff = null, picked = null;
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const KEYPAD = `<div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button class="fn" data-k="clear">지우기</button><button data-k="0">0</button><button class="fn" data-k="back">←</button></div>`;
  function renderMain() {
    $('#app').innerHTML = `<div class="top"><div class="name">${ACADEMY}<small>출결 · ${esc(device.name)}</small><button type="button" class="fsbtn" id="fsBtn" hidden>⛶ 전체화면</button></div><div class="clock" id="clock"></div></div>
      <div class="wrap"><div class="pad" id="pad" style="position:relative"></div>
      <div class="side" id="side"></div></div>
      <div class="result" id="result"></div><button class="gear" id="gear">기기 설정</button>`;
    renderPad(); renderSide();
    $('#gear').onclick = () => { if (confirm('이 태블릿의 등록을 지우고 다시 등록할까요?')) { localStorage.removeItem(LS); device = null; renderSetup(); } };
    tick(); loadToday(); syncFs();
    if (!isStandalone() && !localStorage.getItem('mm-checkin-fstip')) showFsTip();
  }
  const modesHtml = () => `<div class="modes"><button type="button" data-mode="student" aria-pressed="${mode === 'student'}">학생 등하원</button><button type="button" data-mode="staff" aria-pressed="${mode === 'staff'}">선생님 출퇴근</button></div>`;
  function renderPad() {
    const pad = $('#pad'); if (!pad) return;
    let body;
    if (mode === 'student') {
      body = `<p class="hint">학생 휴대폰 또는 학부모 휴대폰 번호 <b>뒷자리 4개</b>를 누르세요</p><div class="digits" id="digits"></div>${KEYPAD}`;
    } else if (!picked) {
      body = `<p class="hint">본인 <b>이름</b>을 누른 뒤 근무번호를 누르세요</p><div class="staffgrid" id="staffGrid">${staffGridHtml()}</div>`;
    } else {
      const st = picked.checkOut ? `오늘 ${picked.checkIn} 출근 · ${picked.checkOut} 퇴근` : picked.checkIn ? `오늘 ${picked.checkIn} 출근` : '오늘 아직 출근 전';
      body = `<p class="hint"><b>${esc(picked.name)}</b> 선생님 · <b>근무번호</b>를 누르세요 <span style="color:var(--ink-3)">(${esc(st)})</span></p>
        <div class="digits" id="digits"></div>${KEYPAD}
        <div class="staffacts"><button type="button" class="back" data-staff="back">◀ 이름 다시</button><button type="button" class="in" data-staff="출근" ${picked.checkIn ? 'disabled' : ''}>출근</button><button type="button" class="out" data-staff="퇴근" ${picked.checkIn && !picked.checkOut ? '' : 'disabled'}>퇴근</button></div>`;
    }
    pad.className = 'pad' + (mode === 'staff' && picked ? ' staffpin' : '');   // 근무번호 화면은 [출근]/[퇴근] 줄만큼 키패드를 줄인다
    pad.innerHTML = modesHtml() + body;
    pad.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
    pad.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
    pad.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => pickStaff(b.dataset.sid));
    pad.querySelectorAll('[data-staff]').forEach(b => b.onclick = () => { if (b.dataset.staff === 'back') { picked = null; digits = ''; renderPad(); } else doClock(b.dataset.staff); });
    drawDigits();
  }
  function staffGridHtml() {
    if (!staff) return '<div class="empty" style="color:var(--ink-3);padding:16px">불러오는 중…</div>';
    if (!staff.length) return '<div class="empty" style="color:var(--ink-3);padding:16px">등록된 선생님이 없습니다</div>';
    return staff.map(m => `<button type="button" data-sid="${esc(m.id)}" class="${m.pinSet ? '' : 'nopin'}">
      <span class="nm"><i class="dot" style="background:${esc(m.color || '#2A4BB8')}"></i>${esc(m.name)}</span>
      <span class="st ${m.checkOut ? 'done' : m.checkIn ? 'on' : ''}">${m.checkOut ? `${esc(m.checkIn)} 출근 · ${esc(m.checkOut)} 퇴근` : m.checkIn ? `${esc(m.checkIn)} 출근` : m.pinSet ? '아직 출근 전' : '근무번호 없음'}</span></button>`).join('');
  }
  function setMode(m) {
    if (mode === m) return;
    mode = m; digits = ''; picked = null;
    renderPad(); renderSide();
    if (m === 'staff') loadStaff(); else loadToday();
  }
  function pickStaff(id) {
    const m = (staff || []).find(x => x.id === id); if (!m) return;
    if (!m.pinSet) { toast(m.name + ' 선생님의 근무번호가 없습니다. 원장님께 요청하세요'); return; }
    picked = m; digits = ''; renderPad();
  }
  async function loadStaff() {
    try { staff = await api('kioskStaff'); } catch (ex) { staff = []; toast(ex.message || '선생님 목록을 불러오지 못했습니다'); }
    if (mode === 'staff') { if (picked) { const f = staff.find(x => x.id === picked.id); if (f) picked = f; } renderPad(); renderSide(); }
  }
  /** 선생님 출퇴근 기록 (근무일지에 그대로 들어간다) */
  async function doClock(kind) {
    if (!picked || busy) return;
    if (digits.length < 4) { toast('근무번호 4자리 이상을 누르세요'); return; }
    busy = true;
    const r = $('#result'); r.innerHTML = `<div class="box done"><div class="big">⏳</div><h2>${esc(picked.name)} 선생님 ${esc(kind)} 처리 중…</h2></div>`; r.classList.add('on');
    try {
      const d = await api('kioskClock', { memberId: picked.id, pin: digits, kind });
      r.innerHTML = `<div class="box done"><div class="big">${kind === '출근' ? '✅' : '👋'}</div><h2>${esc(d.name)} 선생님 ${esc(d.kind)} 완료</h2><p class="sub">${esc(d.time)}${d.checkOut ? ` · 오늘 근무 ${esc(d.checkIn)} ~ ${esc(d.checkOut)}` : ''}<br>근무일지에 기록했습니다</p><div class="bar"><i></i></div></div>`;
      requestAnimationFrame(() => { const i = r.querySelector('.bar i'); if (i) i.style.width = '0%'; });
      digits = ''; picked = null; loadStaff(); setTimeout(closeResult, 3200);
    } catch (ex) {
      r.innerHTML = `<div class="box done warn"><div class="big">⚠️</div><h2>${esc(ex.code === 'bad_pin' ? '근무번호가 맞지 않습니다' : '처리하지 못했습니다')}</h2><p class="sub">${esc(ex.message || '')}</p><div class="acts"><button class="cancel" style="flex:1" id="rClose">다시</button></div></div>`;
      $('#rClose').onclick = () => { digits = ''; closeResult(); };
    } finally { busy = false; }
  }
  function renderSide() {
    const side = $('#side'); if (!side) return;
    side.innerHTML = mode === 'staff'
      ? `<h3>오늘 선생님 근무 <small id="sideDate"></small></h3><div class="cnt"><div><b id="cntIn">-</b><span>출근</span></div><div><b id="cntOut">-</b><span>퇴근</span></div></div><ul id="sideList"><li class="empty">불러오는 중…</li></ul>`
      : `<h3>오늘 등하원 <small id="sideDate"></small></h3><div class="cnt"><div><b id="cntIn">-</b><span>등원</span></div><div><b id="cntOut">-</b><span>하원</span></div></div><ul id="sideList"><li class="empty">불러오는 중…</li></ul>`;
    if (mode === 'staff') drawStaffSide(); else if (today) drawTodaySide();
  }
  function drawStaffSide() {
    const list = (staff || []).filter(m => m.checkIn || m.checkOut);
    const d = $('#sideDate'); if (d) d.textContent = new Date().toISOString().slice(5, 10).replace('-', '/');
    const ci = $('#cntIn'), co = $('#cntOut'); if (ci) ci.textContent = (staff || []).filter(m => m.checkIn).length; if (co) co.textContent = (staff || []).filter(m => m.checkOut).length;
    const ul = $('#sideList'); if (!ul) return;
    ul.innerHTML = list.length ? list.map(m => `<li><span class="t">${esc(m.checkOut || m.checkIn)}</span><span>${esc(m.name)}</span><span class="k ${m.checkOut ? 'out' : 'in'}">${m.checkOut ? '퇴근' : '출근'}</span></li>`).join('') : '<li class="empty">아직 출근한 선생님이 없습니다</li>';
  }
  // ---------- 전체화면 (주소창 숨기기) ----------
  // 가장 좋은 방법은 크롬 메뉴 → [홈 화면에 추가]로 설치해 여는 것(매니페스트 display: fullscreen). 그 전엔 [전체화면] 버튼이나 첫 터치로 전체화면 API 를 쓴다
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  async function enterFs() { const el = document.documentElement; try { if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch (e) {} syncFs(); }
  function syncFs() { const b = $('#fsBtn'); if (!b) return; b.hidden = isStandalone() || isFs() || !(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
  document.addEventListener('fullscreenchange', syncFs); document.addEventListener('webkitfullscreenchange', syncFs);
  document.addEventListener('click', e => { const b = e.target.closest('#fsBtn'); if (b) enterFs(); });
  let fsTried = false;
  document.addEventListener('pointerdown', () => { if (!fsTried && device && !isStandalone() && !isFs()) { fsTried = true; enterFs(); } }, true);
  function showFsTip() {
    const tip = document.createElement('div'); tip.className = 'fstip';
    tip.innerHTML = `<span>주소창 없이 쓰려면 크롬 메뉴(⋮) → <b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 누르고, 홈 화면의 "출결" 아이콘으로 여세요.</span><button type="button" id="fsTipOk">알겠어요</button>`;
    document.body.append(tip); $('#fsTipOk').onclick = () => { localStorage.setItem('mm-checkin-fstip', '1'); tip.remove(); };
  }
  function tick() { const c = $('#clock'); if (!c) return; const d = new Date(); c.innerHTML = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}<small>${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</small>`; }
  setInterval(tick, 1000);
  function drawDigits() {
    const b = $('#digits'); if (!b) return;
    if (mode === 'staff') { const n = Math.max(4, digits.length); b.innerHTML = Array.from({ length: n }, (_, i) => `<span class="${digits[i] ? 'on' : ''}">${digits[i] ? '●' : ''}</span>`).join(''); return; }
    b.innerHTML = [0, 1, 2, 3].map(i => `<span class="${digits[i] ? 'on' : ''}">${digits[i] || ''}</span>`).join('');
  }
  async function press(k) {
    if (busy) return;
    if (k === 'clear') { digits = ''; drawDigits(); return; }
    if (k === 'back') { digits = digits.slice(0, -1); drawDigits(); return; }
    if (mode === 'staff') {   // 선생님 근무번호: 4~8자리, [출근]/[퇴근] 을 눌러야 처리
      if (!picked || digits.length >= 8) return;
      digits += k; drawDigits(); return;
    }
    if (digits.length >= 4) return;
    digits += k; drawDigits();
    if (digits.length === 4) { busy = true; try { const list = await api('kioskLookup', { digits }); showPick(list); } catch (ex) { toast(ex.message || '찾지 못했습니다'); digits = ''; drawDigits(); } finally { busy = false; } }
  }
  function showPick(list) {
    const r = $('#result');
    if (!list.length) { r.innerHTML = `<div class="box done warn"><div class="big">🔍</div><h2>번호를 찾지 못했습니다</h2><p class="sub">뒷자리 <b>${esc(digits)}</b> 로 등록된 재원생이 없습니다. 다시 눌러 보거나 데스크에 말씀해 주세요.</p><div class="acts"><button class="cancel" style="flex:1" id="rClose">다시 입력</button></div></div>`; r.classList.add('on'); $('#rClose').onclick = closeResult; setTimeout(() => { if (r.classList.contains('on') && $('#rClose')) closeResult(); }, 6000); return; }
    r.innerHTML = `<div class="box"><h2>${list.length === 1 ? '본인이 맞나요?' : '누구인가요?'}</h2><p>이름을 누른 뒤 등원 또는 하원을 고르세요</p>
      ${list.map(s => `<button class="stu" data-sid="${s.id}"><span><span class="nm">${esc(s.name)}</span> <span class="sub">${esc(s.grade)}${s.school ? ' · ' + esc(s.school) : ''}</span></span><span class="st ${s.lastKind === '등원' ? 'in' : s.lastKind === '하원' ? 'out' : ''}">${s.lastKind ? `${esc(s.lastTime)} ${esc(s.lastKind)}` : '오늘 첫 기록'}</span></button>`).join('')}
      <div class="acts" id="kindActs" hidden><button class="in" data-kind="등원">등원</button><button class="out" data-kind="하원">하원</button><button class="cancel" id="rCancel">취소</button></div>
      <div class="acts" id="cancelOnly"><button class="cancel" style="flex:1" id="rClose">취소</button></div></div>`;
    r.classList.add('on');
    let picked = list.length === 1 ? list[0] : null;
    const highlight = () => { r.querySelectorAll('.stu').forEach(b => { b.style.borderColor = picked && b.dataset.sid === picked.id ? 'var(--cobalt)' : ''; b.style.background = picked && b.dataset.sid === picked.id ? '#EEF2FF' : ''; }); $('#kindActs').hidden = !picked; $('#cancelOnly').hidden = !!picked; const nx = picked ? picked.next : ''; r.querySelectorAll('[data-kind]').forEach(b => b.style.opacity = nx && b.dataset.kind !== nx ? '.55' : '1'); };
    r.querySelectorAll('.stu').forEach(b => b.onclick = () => { picked = list.find(s => s.id === b.dataset.sid); highlight(); });
    r.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => doCheck(picked, b.dataset.kind));
    $('#rCancel').onclick = closeResult; $('#rClose').onclick = closeResult;
    highlight();
  }
  async function doCheck(s, kind) {
    if (!s || busy) return; busy = true;
    const r = $('#result'); r.innerHTML = `<div class="box done"><div class="big">⏳</div><h2>${esc(s.name)} ${kind} 처리 중…</h2></div>`;
    try {
      const d = await api('kioskCheck', { studentId: s.id, kind });
      const smsTxt = d.sms === '문자 발송' ? '학부모님께 알림 문자를 보냈습니다' : d.sms === '학부모 번호 없음' ? '학부모 번호가 없어 문자는 보내지 않았습니다' : d.sms === '문자 끔' || d.sms === '문자 API 미설정' ? '' : d.sms ? '알림 문자: ' + d.sms : '';
      r.innerHTML = `<div class="box done ${d.dup ? 'warn' : ''}"><div class="big">${d.dup ? '⚠️' : kind === '등원' ? '✅' : '👋'}</div><h2>${esc(s.name)} 학생 ${d.dup ? '이미 ' + kind + ' 처리됨' : kind + ' 완료'}</h2><p class="sub">${esc(d.time)}${d.att ? ' · ' + esc(d.att) : ''}${smsTxt ? '<br>' + esc(smsTxt) : ''}${d.dup ? '<br>' + esc(d.message) : ''}</p><div class="bar"><i></i></div></div>`;
      requestAnimationFrame(() => { const i = r.querySelector('.bar i'); if (i) i.style.width = '0%'; });
      loadToday(); setTimeout(closeResult, 3200);
    } catch (ex) { r.innerHTML = `<div class="box done warn"><div class="big">⚠️</div><h2>처리하지 못했습니다</h2><p class="sub">${esc(ex.message || '')}</p><div class="acts"><button class="cancel" style="flex:1" id="rClose">닫기</button></div></div>`; $('#rClose').onclick = closeResult; }
    finally { busy = false; }
  }
  function closeResult() { const r = $('#result'); if (r) { r.classList.remove('on'); r.innerHTML = ''; } digits = ''; if (mode === 'staff') renderPad(); else drawDigits(); }
  async function loadToday() {
    try { today = await api('kioskToday'); } catch { return; }
    if (mode === 'student') drawTodaySide();
  }
  function drawTodaySide() {
    const d = $('#sideDate'); if (!d || !today) return; d.textContent = today.date.slice(5).replace('-', '/');
    $('#cntIn').textContent = today.inCount; $('#cntOut').textContent = today.outCount;
    $('#sideList').innerHTML = today.rows.length ? today.rows.map(x => `<li><span class="t">${esc(x.time)}</span><span>${esc(x.name)}</span><span class="k ${x.kind === '등원' ? 'in' : 'out'}">${esc(x.kind)}</span></li>`).join('') : '<li class="empty">아직 기록이 없습니다</li>';
  }
  setInterval(() => { if (device && !busy && !$('#result')?.classList.contains('on')) { if (mode === 'staff') loadStaff(); else loadToday(); } }, 60000);
  document.addEventListener('keydown', e => { if (!device || $('#result')?.classList.contains('on')) return; if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('back'); else if (e.key === 'Escape') press('clear'); });
  if (device && device.token) renderMain(); else renderSetup();
})();
</script>
</body>
</html>
