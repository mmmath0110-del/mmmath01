<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>외부 일정 입력 · 더블엠수학학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#F5F6F9; --sheet:#FFFFFF; --ink:#16213A; --ink-2:#5A6379; --ink-3:#9AA3B5;
    --rule:#D8DDE6; --rule-2:#EBEEF3; --cobalt:#2A4BB8; --cobalt-ink:#FFFFFF; --cobalt-soft:#E7ECFA;
    --danger:#C8423C; --danger-soft:#FBE4E3; --ok:#2E8B57; --ok-soft:#E3F3EA; --violet:#6D28D9; --violet-soft:#EDE7FB;
    --shadow:0 12px 32px rgba(22,33,58,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1220; --sheet:#171D2E; --ink:#E5E9F2; --ink-2:#A9B1C4; --ink-3:#6F778A;
      --rule:#2B3346; --rule-2:#222A3C; --cobalt:#8AA0F5; --cobalt-ink:#0E1220; --cobalt-soft:#1F2A4A;
      --danger:#F07C76; --danger-soft:#3A1F1F; --ok:#63C08A; --ok-soft:#173224; --violet:#B39CF5; --violet-soft:#2A2145;
      --shadow:0 12px 32px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1220; --sheet:#171D2E; --ink:#E5E9F2; --ink-2:#A9B1C4; --ink-3:#6F778A;
    --rule:#2B3346; --rule-2:#222A3C; --cobalt:#8AA0F5; --cobalt-ink:#0E1220; --cobalt-soft:#1F2A4A;
    --danger:#F07C76; --danger-soft:#3A1F1F; --ok:#63C08A; --ok-soft:#173224; --violet:#B39CF5; --violet-soft:#2A2145;
    --shadow:0 12px 32px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 11px;min-width:0;width:100%;font-size:16px}
  input:focus,button:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
  header{background:var(--cobalt);color:var(--cobalt-ink);padding:14px 16px}
  header .brand{font-weight:700;font-size:17px}
  header .sub{font-size:12.5px;opacity:.85}
  main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
  .card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;margin-bottom:12px}
  .intro h1{font-size:19px;margin:0 0 6px}
  .intro p{margin:0;color:var(--ink-2);font-size:14px}
  .intro .last{margin-top:8px;font-size:13px;color:var(--ok);font-weight:500}
  .blk{position:relative;border-left:4px solid var(--violet)}
  .blk .row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .blk .row:last-child{margin-bottom:0}
  .blk label{font-size:12.5px;color:var(--ink-2)}
  .blk .n{font-weight:700;color:var(--violet);font-size:13px;margin-bottom:8px;display:flex;align-items:center}
  .blk .del{margin-left:auto;border:0;background:transparent;color:var(--ink-3);font-size:13px;padding:2px 4px}
  .blk .del:hover{color:var(--danger)}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .days button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:9px 0;font-weight:700;font-size:15px}
  .days button.wk{color:var(--danger)}
  .days button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
  .times{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
  .times input{min-width:0}
  .times .tilde{color:var(--ink-3)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .presets button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2)}
  .presets button:hover{border-color:var(--cobalt);color:var(--cobalt)}
  .add{width:100%;border:1px dashed var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt);border-radius:12px;padding:13px;font-weight:700;font-size:15px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(22,33,58,.08)}
  .bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .bar .msg{flex:1;font-size:13px;color:var(--ink-2);min-width:0}
  .bar .msg.err{color:var(--danger);font-weight:500}
  .bar .msg.ok{color:var(--ok);font-weight:500}
  .save{border:0;background:var(--cobalt);color:var(--cobalt-ink);border-radius:10px;padding:12px 22px;font-weight:700;font-size:16px;white-space:nowrap}
  .save[disabled]{opacity:.5}
  .empty{text-align:center;color:var(--ink-2);padding:24px 8px;font-size:14px}
  .err{color:var(--danger);font-size:13px;margin-top:6px}
  .hint{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
  .done{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ink);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:14px}
  .done b{color:var(--ok)}
  .gone{padding:40px 16px;text-align:center}
  .gone h1{font-size:19px;margin:0 0 8px}
  .gone p{color:var(--ink-2);margin:0}
  .summary{font-size:13.5px;color:var(--ink-2);margin:0 0 10px}
  .summary b{color:var(--ink)}
</style>
</head>
<body>
<header><div class="brand">더블엠수학학원</div><div class="sub">외부 일정 입력</div></header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<div class="bar" id="bar" hidden><div class="in"><div class="msg" id="msg">입력 후 [저장]을 눌러 주세요</div><button class="save" id="saveBtn">저장</button></div></div>
<script src="config.js"></script>
<script>
(() => {
  const API_URL = (window.MM_API_URL || '').trim();
  const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
  const PRESETS = ['영어학원', '태권도', '피아노', '미술', '학교 방과후', '과외', '운동'];
  const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const token = (new URLSearchParams(location.search).get('t') || (location.pathname.match(/\/schedule\/([0-9a-f]{40})/i) || [])[1] || '').toLowerCase();
  const main = $('#main'), bar = $('#bar'), msg = $('#msg'), saveBtn = $('#saveBtn');
  let blocks = [], name = '', lastSaved = '';

  async function api(action, payload) {
    let res;
    try { res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, link: token, ...payload }) }); }
    catch { throw new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.'); }
    let out; try { out = await res.json(); } catch { throw new Error('서버 응답을 읽을 수 없습니다. 잠시 뒤 다시 시도해 주세요.'); }
    if (!out.ok) { const e = new Error(out.message || '요청을 처리하지 못했습니다.'); e.code = out.error; throw e; }
    return out.data;
  }
  const localDT = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

  /** 서버의 (이름·요일) 행들을 화면 블록(이름 + 요일 여러 개 + 시간)으로 묶는다 */
  function toBlocks(items) {
    const map = new Map();
    for (const x of items) {
      const k = `${x.name}|${x.start}|${x.end}|${x.memo || ''}`;
      if (!map.has(k)) map.set(k, { name: x.name, start: x.start, end: x.end, memo: x.memo || '', days: new Set() });
      map.get(k).days.add(x.day);
    }
    return [...map.values()].sort((a, b) => Math.min(...[...a.days].map(d => DAYS.indexOf(d))) - Math.min(...[...b.days].map(d => DAYS.indexOf(d))) || a.start.localeCompare(b.start));
  }
  const newBlock = (preset = {}) => ({ name: preset.name || '', start: preset.start || '', end: preset.end || '', memo: '', days: new Set() });

  function gone(title, text) {
    main.innerHTML = `<div class="card gone"><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`; bar.hidden = true;
  }
  function render() {
    const cnt = blocks.reduce((n, b) => n + b.days.size, 0);
    let html = `<div class="card intro"><h1>${esc(name)} 학생의 외부 일정</h1><p>다른 학원(영어·태권도·피아노 등)이나 매주 반복되는 고정 일정을 알려 주세요. 수학 수업 시간을 겹치지 않게 정하는 데만 사용합니다.</p>${lastSaved ? `<div class="last">최근 저장: ${esc(localDT(lastSaved))} · 이 링크로 언제든 다시 고칠 수 있습니다</div>` : ''}</div>`;
    if (!blocks.length) html += `<div class="card empty">아직 입력한 일정이 없습니다.<br>아래 [+ 일정 추가]를 눌러 시작하세요.<div class="presets" style="justify-content:center;margin-top:12px">${PRESETS.map(p => `<button type="button" data-preset="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>`;
    blocks.forEach((b, i) => {
      html += `<div class="card blk" data-i="${i}">
        <div class="n">일정 ${i + 1}<button type="button" class="del" data-del="${i}" aria-label="이 일정 삭제">삭제 ✕</button></div>
        <div class="row"><label>일정명 / 학원명</label><input data-f="name" value="${esc(b.name)}" maxlength="40" placeholder="예: 영어학원" autocomplete="off"><div class="presets">${PRESETS.map(p => `<button type="button" data-fill="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>
        <div class="row"><label>요일 <span style="color:var(--ink-3)">(여러 개 선택 가능)</span></label><div class="days">${DAYS.map(d => `<button type="button" data-day="${d}" aria-pressed="${b.days.has(d)}" class="${d === '토' || d === '일' ? 'wk' : ''}">${d}</button>`).join('')}</div></div>
        <div class="row"><label>시간</label><div class="times"><input type="time" data-f="start" value="${esc(b.start)}" step="300"><span class="tilde">~</span><input type="time" data-f="end" value="${esc(b.end)}" step="300"></div></div>
        <div class="row"><label>메모 <span style="color:var(--ink-3)">(선택)</span></label><input data-f="memo" value="${esc(b.memo)}" maxlength="200" placeholder="예: 셔틀 타고 이동, 격주로 감"></div>
      </div>`;
    });
    html += `<button type="button" class="add" id="add">＋ 일정 추가</button><p class="hint">요일마다 시간이 다르면 일정을 따로 추가해 주세요. 예) 영어학원 월·수 17:00~19:00 / 영어학원 토 10:00~12:00</p>`;
    main.innerHTML = html;
    bar.hidden = false;
    if (!$('#msg').classList.contains('err') && !$('#msg').classList.contains('ok')) msg.textContent = cnt ? `일정 ${cnt}건 · 바뀐 내용은 [저장]을 눌러야 반영됩니다` : '입력 후 [저장]을 눌러 주세요';
    $('#add').onclick = () => { blocks.push(newBlock()); dirty(); render(); setTimeout(() => { const last = $$('.blk').pop(); if (last) { last.scrollIntoView({ behavior: 'smooth', block: 'start' }); $('[data-f=name]', last).focus(); } }, 0); };
    $$('[data-preset]').forEach(b => b.onclick = () => { blocks.push(newBlock({ name: b.dataset.preset })); dirty(); render(); const last = $$('.blk').pop(); if (last) $('[data-f=start]', last).focus(); });
    $$('.blk').forEach(el => {
      const b = blocks[Number(el.dataset.i)];
      $$('[data-f]', el).forEach(inp => inp.oninput = () => { b[inp.dataset.f] = inp.value; dirty(); });
      $$('[data-fill]', el).forEach(p => p.onclick = () => { b.name = p.dataset.fill; $('[data-f=name]', el).value = b.name; dirty(); });
      $$('[data-day]', el).forEach(d => d.onclick = () => { const k = d.dataset.day; b.days.has(k) ? b.days.delete(k) : b.days.add(k); d.setAttribute('aria-pressed', b.days.has(k)); dirty(); });
    });
    $$('[data-del]').forEach(b => b.onclick = () => { const i = Number(b.dataset.del); if (blocks[i].name || blocks[i].days.size) { if (!confirm(`"${blocks[i].name || '일정 ' + (i + 1)}" 을 지울까요?`)) return; } blocks.splice(i, 1); dirty(); render(); });
  }
  function dirty() { msg.className = 'msg'; msg.textContent = '바뀐 내용이 있습니다. [저장]을 눌러 주세요'; }
  function collect() {
    const items = [];
    for (const [i, b] of blocks.entries()) {
      const label = b.name.trim() || `일정 ${i + 1}`;
      if (!b.name.trim()) throw new Error(`${label}: 일정명(학원명)을 적어 주세요.`);
      if (!b.days.size) throw new Error(`${label}: 요일을 하나 이상 골라 주세요.`);
      if (!b.start || !b.end) throw new Error(`${label}: 시작·종료 시간을 넣어 주세요.`);
      if (b.end <= b.start) throw new Error(`${label}: 종료 시간이 시작 시간보다 늦어야 합니다.`);
      for (const d of DAYS) if (b.days.has(d)) items.push({ name: b.name.trim(), day: d, start: b.start, end: b.end, memo: b.memo.trim() });
    }
    return items;
  }
  saveBtn.onclick = async () => {
    let items; try { items = collect(); } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; return; }
    saveBtn.disabled = true; msg.className = 'msg'; msg.textContent = '저장하는 중…';
    try {
      const r = await api('pubScheduleSave', { items });
      blocks = toBlocks(r.items); lastSaved = r.submittedAt; render();
      msg.className = 'msg ok'; msg.textContent = `저장했습니다 (${items.length}건). 고마워요!`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) { msg.className = 'msg err'; msg.textContent = e.code === 'bad_link' ? '링크가 더 이상 유효하지 않습니다. 학원에 새 링크를 요청해 주세요.' : e.message; }
    finally { saveBtn.disabled = false; }
  };

  (async () => {
    if (!API_URL) return gone('설정이 필요합니다', 'config.js 에 서버 주소가 없습니다.');
    if (!token) return gone('링크가 올바르지 않습니다', '학원에서 받은 일정 입력 링크를 그대로 열어 주세요.');
    try {
      const d = await api('pubSchedule', {});
      name = d.name; blocks = toBlocks(d.items || []); lastSaved = d.submittedAt || '';
      document.title = `${name} 학생 외부 일정 · 더블엠수학학원`;
      render();
    } catch (e) {
      if (e.code === 'bad_link') gone('링크가 유효하지 않습니다', '링크가 만료되었거나 새 링크가 발급되었습니다. 학원에 새 링크를 요청해 주세요.');
      else gone('불러오지 못했습니다', e.message);
    }
  })();
})();
</script>
</body>
</html>
