<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더블엠 문제풀이 근무일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --paper:#F5F6F9; --sheet:#FFFFFF; --ink:#16213A; --ink-2:#5A6379; --ink-3:#9AA3B5;
    --rule:#D8DDE6; --rule-2:#EBEEF3; --cobalt:#2A4BB8; --cobalt-ink:#FFFFFF; --cobalt-soft:#E7ECFA;
    --today:#E09A2E; --today-soft:#FBF1DF; --danger:#C8423C; --ok:#2E8B57; --ok-soft:#E3F3EA;
    --shadow:0 12px 32px rgba(22,33,58,.16);
    --grid:rgba(42,75,184,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1220; --sheet:#171D2E; --ink:#E5E9F2; --ink-2:#A9B1C4; --ink-3:#6F778A;
      --rule:#2B3346; --rule-2:#222A3C; --cobalt:#8AA0F5; --cobalt-ink:#0E1220; --cobalt-soft:#1F2A4A;
      --today:#F0B657; --today-soft:#332913; --danger:#F07C76; --ok:#63C08A; --ok-soft:#173224;
      --shadow:0 12px 32px rgba(0,0,0,.5); --grid:rgba(138,160,245,.08);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1220; --sheet:#171D2E; --ink:#E5E9F2; --ink-2:#A9B1C4; --ink-3:#6F778A;
    --rule:#2B3346; --rule-2:#222A3C; --cobalt:#8AA0F5; --cobalt-ink:#0E1220; --cobalt-soft:#1F2A4A;
    --today:#F0B657; --today-soft:#332913; --danger:#F07C76; --ok:#63C08A; --ok-soft:#173224;
    --shadow:0 12px 32px rgba(0,0,0,.5); --grid:rgba(138,160,245,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;
  }
  .num{font-family:"IBM Plex Mono","Noto Sans KR",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:7px 9px}
  textarea{resize:vertical;line-height:1.5}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
  .btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
  .btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
  .btn.danger{color:var(--danger)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--rule-2)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:4px 9px;font-size:12.5px}
  .btn.big{padding:12px 22px;font-size:16px;font-weight:700;border-radius:8px}

  header{
    position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);
    padding:0 20px;display:flex;align-items:stretch;gap:20px;min-height:56px
  }
  .brand{display:flex;flex-direction:column;justify-content:center;min-width:150px}
  .brand .name{font-family:"Noto Serif KR","Noto Sans KR",serif;font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.15}
  .brand .sub{font-size:11px;color:var(--ink-2);letter-spacing:.08em}
  .tabs{display:flex;gap:2px;align-self:stretch;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:0;background:transparent;padding:0 14px;font-size:14.5px;font-weight:500;color:var(--ink-2);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{color:var(--cobalt);border-bottom-color:var(--cobalt);font-weight:700}
  .me{display:flex;align-items:center;gap:8px;margin-left:auto}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:999px;background:var(--rule-2);font-size:12.5px;font-weight:500}
  .chip.status{cursor:pointer;border:0;background:var(--ok-soft);color:var(--ok)}
  .chip.status.off{background:var(--rule-2);color:var(--ink-2)}
  .chip.status.done{background:var(--cobalt-soft);color:var(--cobalt)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--cobalt);flex:none}

  .subbar{display:flex;align-items:center;gap:8px;padding:8px 20px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
  .subbar .spacer{flex:1}
  .subbar .acts{display:flex;gap:6px}
  .periodnav{display:flex;align-items:center;gap:6px}
  .periodnav .range{font-weight:700;min-width:180px;text-align:center;font-size:15px}
  .subbar[hidden]{display:none}

  main{padding:4px 20px 60px;max-width:1500px;margin:0 auto}
  .banner{background:var(--today-soft);border:1px solid var(--today);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}

  /* 오늘 */
  .todaygrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.5fr);gap:14px;margin-bottom:14px}
  .card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
  .cardhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .cardhead .ttl{font-weight:700;font-size:14px}
  .cardhead .d{color:var(--ink-2);font-size:13px}
  .cardhead .saved{margin-left:auto;color:var(--ink-3);font-size:11.5px}
  .mecard{border-left:5px solid var(--today)}
  .status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 14px}
  .status .t{font-size:26px;font-weight:700;line-height:1.1}
  .status .t small{font-size:11.5px;color:var(--ink-2);font-weight:500;display:block;letter-spacing:.06em;margin-top:2px}
  .status .arrow{color:var(--ink-3)}
  .pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--rule-2);color:var(--ink-2);font-weight:500}
  .pill.on{background:var(--ok-soft);color:var(--ok)}
  .pill.done{background:var(--cobalt-soft);color:var(--cobalt)}
  .clockbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .weekline{margin-top:12px;font-size:12.5px;color:var(--ink-2)}
  .memo textarea{width:100%;min-height:118px}
  .memo .row{display:flex;gap:8px;margin-top:8px;align-items:center}
  .memo .row input{flex:1}
  .rosterlist{display:flex;flex-direction:column}
  .rrow{display:grid;grid-template-columns:150px 92px 150px 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule-2);font-size:13.5px}
  .rrow:first-child{border-top:0}
  .rrow .nm{font-weight:700;display:flex;align-items:center;gap:7px}
  .rrow .wk{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .me-tag{font-size:11px;color:var(--ink-3);font-weight:500}

  /* 주간 */
  .board{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));min-width:1190px}
  .col{border-right:1px solid var(--rule-2);display:flex;flex-direction:column;min-height:300px}
  .col:last-child{border-right:0}
  .col.today .dhead{background:var(--today-soft)}
  .col.weekend .dhead .dname{color:var(--danger)}
  .dhead{padding:10px 12px 8px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:8px;position:sticky;top:0;background:var(--sheet)}
  .dhead .dname{font-weight:700;font-size:15px}
  .dhead .ddate{color:var(--ink-2);font-size:12px}
  .dhead .dcount{margin-left:auto;color:var(--ink-3);font-size:12px}
  .cells{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
  .log{
    border:1px solid var(--rule);border-left:4px solid var(--c,var(--cobalt));border-radius:6px;background:var(--sheet);
    padding:8px 10px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%
  }
  .log.editable:hover{border-color:var(--ink-3);box-shadow:0 2px 8px rgba(22,33,58,.08)}
  .log .who{display:flex;align-items:center;gap:6px;font-weight:700}
  .log .who .hrs{margin-left:auto;color:var(--ink-2);font-weight:500;font-size:12px}
  .log .time{font-size:13.5px}
  .log .time .on{color:var(--ok);font-family:"Noto Sans KR",sans-serif;font-size:12px;font-weight:700}
  .log .work{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .log .note{font-size:12px;color:var(--ink-3)}
  .fixed{display:inline-block;font-size:10.5px;color:var(--today);border:1px solid var(--today);border-radius:4px;padding:0 5px;line-height:1.5}
  .addcell{border:1px dashed var(--rule);border-radius:6px;padding:8px;color:var(--ink-3);background:transparent;width:100%}
  .addcell:hover{color:var(--cobalt);border-color:var(--cobalt)}

  /* 월간 */
  .month{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));min-width:920px}
  .month .mh{padding:8px 10px;border-bottom:1px solid var(--rule);font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--paper);position:sticky;top:0}
  .month .mh.weekend{color:var(--danger)}
  .mcell{border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-height:104px;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
  .mcell:nth-child(7n){border-right:0}
  .mcell.dim{background:var(--paper);color:var(--ink-3)}
  .mcell.today .dn{background:var(--today);color:#fff}
  .mcell .dn{font-weight:700;font-size:12.5px;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
  .mcell .dn.weekend{color:var(--danger)}
  .mcell.today .dn.weekend{color:#fff}
  .mrow{display:flex;align-items:center;gap:5px;font-size:12px;border:0;background:transparent;padding:1px 2px;border-radius:4px;text-align:left;width:100%;color:inherit}
  .mrow.editable:hover{background:var(--cobalt-soft)}
  .mrow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .h{margin-left:auto;color:var(--ink-2);flex:none}
  .mrow .h.on{color:var(--ok);font-weight:700}
  .maddbtn{border:0;background:transparent;color:var(--ink-3);font-size:12px;padding:1px 2px;text-align:left;margin-top:auto;opacity:0}
  .mcell:hover .maddbtn{opacity:1}
  .maddbtn:hover{color:var(--cobalt)}

  /* 요약 */
  .summary{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .sumcard{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
  .sumcard .nm{font-weight:700}
  .sumcard .meta{color:var(--ink-2);font-size:12px}
  .sumcard .tot{margin-left:auto;font-size:18px;font-weight:700}
  .sumcard .tot small{font-size:11px;color:var(--ink-2);font-weight:500;margin-left:2px}

  /* 시트 */
  .sheetwrap{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
  table.sheet{border-collapse:collapse;width:100%;min-width:900px}
  table.sheet th,table.sheet td{border-bottom:1px solid var(--rule-2);padding:8px 12px;text-align:left;vertical-align:top}
  table.sheet th{font-size:12px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;background:var(--paper);position:sticky;top:0;white-space:nowrap}
  table.sheet tr.today td{background:var(--today-soft)}
  table.sheet td.r{text-align:right}
  table.sheet td.wrap{white-space:pre-wrap;min-width:260px}
  table.sheet tr.hover:hover td{background:var(--cobalt-soft)}
  table.sheet .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
  table.sheet tfoot td{font-weight:700;background:var(--paper)}
  .empty{padding:36px 20px;text-align:center;color:var(--ink-2)}

  /* 모달 */
  .backdrop{position:fixed;inset:0;background:rgba(10,14,25,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
  .backdrop.open{display:flex}
  .modal{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:540px;padding:20px 22px}
  .modal.wide{max-width:760px}
  .modal h2{margin:0 0 4px;font-size:17px;text-wrap:balance}
  .modal .hint{color:var(--ink-2);font-size:12.5px;margin:0 0 14px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .form .full{grid-column:1/-1}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--ink-2);letter-spacing:.03em}
  .field input,.field select,.field textarea{width:100%}
  .actions{display:flex;gap:8px;margin-top:16px;align-items:center}
  .actions .spacer{flex:1}
  .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:8px}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .swatches button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0}
  .swatches button[aria-pressed="true"]{border-color:var(--ink)}
  table.members{border-collapse:collapse;width:100%;font-size:13px}
  table.members th,table.members td{padding:7px 8px;border-bottom:1px solid var(--rule-2);text-align:left}
  table.members th{color:var(--ink-2);font-weight:500;font-size:12px}
  .role{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--rule-2);color:var(--ink-2)}
  .role.admin{background:var(--cobalt-soft);color:var(--cobalt)}
  .muted{color:var(--ink-3)}
  code.k{background:var(--rule-2);padding:1px 6px;border-radius:4px;font-size:12.5px}
  body.locked main, body.locked .subbar, body.locked .tabs, body.locked .me{display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  @media (max-width:760px){
    header{padding:0 12px;gap:10px;flex-wrap:wrap;min-height:0}
    .brand{padding:8px 0 4px;min-width:0}
    .brand .name{font-size:15px}
    .me{padding:8px 0 4px}
    .tabs{order:3;width:100%;border-top:1px solid var(--rule-2)}
    .tabs button{flex:1;padding:10px 6px}
    .subbar{padding:8px 10px}
    .periodnav .range{min-width:0;flex:1}
    main{padding:4px 10px 60px}
    .form{grid-template-columns:1fr}
    .todaygrid{grid-template-columns:1fr}
    .status .t{font-size:30px}
    .btn.big{padding:16px 10px;font-size:18px}
    .rrow{grid-template-columns:1fr auto;grid-auto-rows:auto}
    .rrow .wk{grid-column:1/-1}
  }
</style>
</head>
<body>
<script src="config.js"></script>

<header>
  <div class="brand">
    <div class="name">더블엠수학학원</div>
    <div class="sub">문제풀이 근무일지</div>
  </div>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button data-view="today" role="tab" aria-selected="true">오늘</button>
    <button data-view="week" role="tab" aria-selected="false">주간</button>
    <button data-view="month" role="tab" aria-selected="false">월간</button>
    <button data-view="sheet" role="tab" aria-selected="false">시트</button>
  </nav>
  <div class="me" id="meBox"></div>
</header>

<div class="subbar" id="subbar">
  <div class="periodnav" id="periodNav">
    <button class="btn sm" id="prevBtn" aria-label="이전">◀</button>
    <div class="range num" id="rangeLabel">-</div>
    <button class="btn sm" id="nextBtn" aria-label="다음">▶</button>
    <button class="btn sm ghost" id="todayBtn">오늘로</button>
  </div>
  <div class="spacer"></div>
  <div class="acts">
    <button class="btn sm" id="addLog">일지 쓰기</button>
    <button class="btn sm" id="exportCsv">CSV 내려받기</button>
    <button class="btn sm" id="manageMembers" hidden>아이디 관리</button>
  </div>
</div>

<main>
  <div id="banner"></div>

  <!-- 오늘 -->
  <section id="todayView">
    <div class="todaygrid">
      <div class="card mecard">
        <div class="cardhead"><span class="ttl">내 출퇴근</span><span class="d num" id="todayLabel"></span></div>
        <div class="status" id="myStatus"></div>
        <div class="clockbtns">
          <button class="btn big ok" id="clockIn">출근</button>
          <button class="btn big" id="clockOut">퇴근</button>
        </div>
        <div class="weekline" id="myWeek"></div>
      </div>
      <div class="card memo">
        <div class="cardhead"><label class="ttl" for="todayWork">오늘 업무내용</label><span class="saved" id="workSaved"></span></div>
        <textarea id="todayWork" placeholder="오늘 진행한 업무를 적어주세요. 예) 중2 도형 문제풀이 12명, 오답노트 점검, 9시 클리닉"></textarea>
        <div class="row"><input id="todayNote" placeholder="비고 (대타, 조퇴 등)"><button class="btn primary" id="saveToday">저장</button></div>
      </div>
    </div>
    <div class="card roster">
      <div class="cardhead"><span class="ttl">오늘 출근 현황</span><span class="muted" id="rosterCount"></span></div>
      <div class="rosterlist" id="rosterList"></div>
    </div>
  </section>

  <section id="weekView" class="board" hidden><div class="grid" id="grid"></div></section>
  <section id="monthView" class="board" hidden><div class="month" id="month"></div></section>
  <section id="sheetView" class="sheetwrap" hidden></section>
  <section class="summary" id="summary"></section>
</main>

<!-- 일지 입력/수정 -->
<div class="backdrop" id="logModal">
  <form class="modal" id="logForm" autocomplete="off">
    <h2 id="logTitle">일지 입력</h2>
    <p class="hint" id="logHint"></p>
    <div class="form">
      <div class="field"><label for="fDate">날짜</label><input type="date" id="fDate" required></div>
      <div class="field"><label for="fMember">선생님</label><select id="fMember"></select></div>
      <div class="field"><label for="fIn">출근</label><input type="time" id="fIn"></div>
      <div class="field"><label for="fOut">퇴근</label><input type="time" id="fOut"></div>
      <div class="field full"><label for="fWork">업무내용</label><textarea id="fWork" rows="4"></textarea></div>
      <div class="field full"><label for="fNote">비고</label><input id="fNote"></div>
    </div>
    <div class="err" id="logErr"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="logDelete" hidden>삭제</button>
      <div class="spacer"></div>
      <button type="button" class="btn" data-close>취소</button>
      <button type="submit" class="btn primary" id="logSave">저장</button>
    </div>
  </form>
</div>

<!-- 로그인 -->
<div class="backdrop" id="loginModal">
  <form class="modal" id="loginForm" autocomplete="off">
    <h2>더블엠수학학원 · 문제풀이 근무일지</h2>
    <p class="hint">이 페이지는 아이디를 받은 분만 볼 수 있습니다. 원장님이 알려준 아이디와 비밀번호를 입력하세요.</p>
    <div class="form">
      <div class="field"><label for="lId">아이디</label><input id="lId" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label for="lPin">비밀번호</label><input id="lPin" type="password" autocomplete="current-password" required></div>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="actions"><span class="muted" id="loginStatus"></span><div class="spacer"></div><button type="submit" class="btn primary" id="loginBtn">들어가기</button></div>
  </form>
</div>

<!-- 아이디 관리 -->
<div class="backdrop" id="memberModal">
  <div class="modal wide">
    <h2>아이디 관리</h2>
    <p class="hint">선생님마다 아이디를 하나씩 부여합니다. 이 페이지 주소와 아이디·비밀번호를 함께 전달하세요.</p>
    <div style="overflow-x:auto"><table class="members"><thead><tr><th>색</th><th>아이디</th><th>이름</th><th>역할</th><th>상태</th><th></th></tr></thead><tbody id="memberRows"></tbody></table></div>
    <form id="memberForm" autocomplete="off" style="margin-top:16px;border-top:1px solid var(--rule);padding-top:14px">
      <div style="font-weight:700;margin-bottom:8px" id="memberFormTitle">새 아이디</div>
      <div class="form">
        <div class="field"><label for="mId">아이디 (영문·숫자)</label><input id="mId" pattern="[A-Za-z0-9_.\-]{2,20}" required></div>
        <div class="field"><label for="mName">이름</label><input id="mName" required placeholder="예: 김민수"></div>
        <div class="field"><label for="mPin">비밀번호 (4자 이상)</label><input id="mPin" minlength="4" required></div>
        <div class="field"><label for="mRole">역할</label><select id="mRole"><option value="teacher">문제풀이 선생님</option><option value="admin">관리자</option></select></div>
        <div class="field full"><label>표시 색</label><div class="swatches" id="mColors"></div></div>
      </div>
      <div class="err" id="memberErr"></div>
      <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button><button type="submit" class="btn primary">아이디 만들기</button></div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
  const COLORS = ['#2A4BB8', '#C8423C', '#2E8B57', '#D97706', '#7C3AED', '#0E7490', '#BE185D', '#4B5563'];
  const LS_SESSION = 'mm-tutor-web-session';
  const API_URL = (window.MM_API_URL || '').trim();

  const state = {
    token: null, me: null, loggingIn: false, membersLoaded: false,
    view: 'today', anchor: null,        // anchor: 보고 있는 기간의 기준 날짜 (Date)
    members: new Map(), logs: [], loading: true, serverToday: null,
    unsub: null, editing: null, editingMember: null,
  };

  // ---------- 날짜 ----------
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
  const dow = k => (parse(k).getDay() + 6) % 7;   // 0=월
  const todayKey = () => state.serverToday || fmt(new Date());
  const toMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };
  const hoursOf = l => (l.checkIn && l.checkOut) ? Math.max(0, toMin(l.checkOut) - toMin(l.checkIn)) / 60 : 0;
  const fmtH = h => { const r = Math.round(h * 100) / 100; return Number.isInteger(r) ? String(r) : r.toFixed(r * 10 % 1 ? 2 : 1); };
  const mdLabel = k => { const d = parse(k); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };

  /** 현재 보기의 조회 기간 [from, to] 와 표시 기간 */
  function period() {
    const a = state.anchor;
    if (state.view === 'today') { const mon = mondayOf(parse(todayKey())); return { from: fmt(mon), to: fmt(addDays(mon, 6)), mFrom: fmt(mon), mTo: fmt(addDays(mon, 6)) }; }
    if (state.view === 'week') { const mon = mondayOf(a); return { from: fmt(mon), to: fmt(addDays(mon, 6)), mFrom: fmt(mon), mTo: fmt(addDays(mon, 6)) }; }
    const first = new Date(a.getFullYear(), a.getMonth(), 1), last = new Date(a.getFullYear(), a.getMonth() + 1, 0);
    const gridFrom = mondayOf(first), gridTo = addDays(mondayOf(last), 6);
    return { from: fmt(gridFrom), to: fmt(gridTo), mFrom: fmt(first), mTo: fmt(last) };
  }
  function rangeLabel() {
    const a = state.anchor;
    if (state.view === 'week') { const mon = mondayOf(a), sun = addDays(mon, 6); return `${mon.getFullYear()}.${pad(mon.getMonth() + 1)}.${pad(mon.getDate())} – ${pad(sun.getMonth() + 1)}.${pad(sun.getDate())}`; }
    return `${a.getFullYear()}년 ${a.getMonth() + 1}월`;
  }

  // ---------- API ----------
  async function api(action, payload = {}) {
    if (!API_URL) throw { code: 'no_api', message: 'config.js 에 MM_API_URL 이 비어 있습니다.' };
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, token: state.token || '', ...payload }) });
    } catch { throw { code: 'network', message: '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.' }; }
    let out; try { out = await res.json(); } catch { throw { code: 'server_error', message: '서버 응답을 읽을 수 없습니다. 배포 설정(액세스: 모든 사용자)을 확인하세요.' }; }
    if (out.today) state.serverToday = out.today;
    if (!out.ok) {
      if (out.error === 'unauthorized') logoutLocal();
      throw { code: out.error, message: out.message };
    }
    return out.data;
  }
  function friendly(ex) {
    const code = ex && ex.code;
    if (code === 'unauthorized') return '로그인이 풀렸습니다. 다시 로그인하세요.';
    if (code === 'bad_action') return '서버가 아직 새 버전이 아닙니다. Apps Script 를 새 버전으로 배포해 주세요.';
    return (ex && ex.message) || '요청을 처리하지 못했습니다.';
  }

  // ---------- 세션 ----------
  const session = {
    load() { try { return JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); } catch { return null; } },
    save(o) { try { o ? localStorage.setItem(LS_SESSION, JSON.stringify(o)) : localStorage.removeItem(LS_SESSION); } catch {} },
  };
  function logoutLocal() {
    state.token = null; state.me = null; state.members = new Map(); state.logs = [];
    if (state.unsub) { state.unsub(); state.unsub = null; }
    session.save(null); renderAll();
  }
  async function logout() { const t = state.token; logoutLocal(); if (t) { try { await api('logout', { token: t }); } catch {} } }
  const isAdmin = () => state.me && state.me.role === 'admin';
  const canEdit = l => !!state.me && (isAdmin() || l.memberId === state.me.id);
  const memberOf = id => state.members.get(id) || { id, name: id, color: '#9AA3B5' };

  // ---------- 데이터 ----------
  function subscribe() {
    if (state.unsub) state.unsub();
    const { from, to } = period();
    let alive = true;
    state.loading = true; state.logs = [];
    const run = async () => {
      if (!alive || !state.token) return;
      try { const list = await api('listLogs', { from, to }); if (alive) { state.logs = list; state.loading = false; renderAll(); } }
      catch (ex) { if (alive) { state.loading = false; toast(friendly(ex)); renderAll(); } }
    };
    run();
    const t = setInterval(() => { if (document.visibilityState === 'visible') run(); }, 30000);
    state.refresh = run;
    state.unsub = () => { alive = false; clearInterval(t); if (state.refresh === run) state.refresh = null; };
    renderAll();
  }
  const refresh = () => state.refresh && state.refresh();

  // ---------- 렌더 ----------
  function renderGate() {
    const locked = !state.me;
    document.body.classList.toggle('locked', locked);
    const lm = $('#loginModal');
    if (locked) {
      if (!lm.classList.contains('open')) { $('#loginErr').textContent = ''; lm.classList.add('open'); }
      $('#loginBtn').disabled = !API_URL || state.loggingIn;
      $('#loginStatus').textContent = !API_URL ? '서버 주소 미설정' : (state.loggingIn ? '확인 중…' : '');
    } else lm.classList.remove('open');
  }
  function renderHeader() {
    $('#rangeLabel').textContent = rangeLabel();
    const box = $('#meBox'); box.innerHTML = '';
    if (state.me) {
      const m = memberOf(state.me.id), me = myToday();
      if (state.view !== 'today') {
        const st = document.createElement('button'); st.type = 'button';
        const cin = me && me.checkIn, cout = me && me.checkOut;
        st.className = 'chip status' + (cout ? ' done' : cin ? '' : ' off');
        st.innerHTML = cout ? `퇴근 <span class="num">${esc(cout)}</span>` : cin ? `근무중 <span class="num">${esc(cin)}~</span>` : '출근 전';
        st.title = '오늘 탭으로'; st.onclick = () => setView('today'); box.append(st);
      }
      const chip = document.createElement('span'); chip.className = 'chip';
      chip.innerHTML = `<span class="dot" style="background:${m.color || COLORS[0]}"></span>${esc(m.name)} <span class="muted">· ${isAdmin() ? '관리자' : '선생님'}</span>`;
      const out = document.createElement('button'); out.className = 'btn sm ghost'; out.textContent = '로그아웃'; out.onclick = logout;
      box.append(chip, out);
    }
    document.querySelectorAll('.tabs [data-view]').forEach(b => b.setAttribute('aria-selected', b.dataset.view === state.view));
    const v = state.view;
    $('#subbar').hidden = v === 'today';
    $('#periodNav').hidden = v === 'today';
    $('#exportCsv').hidden = v !== 'sheet' && v !== 'month';
    $('#manageMembers').hidden = !isAdmin();
    $('#todayView').hidden = v !== 'today';
    $('#weekView').hidden = v !== 'week';
    $('#monthView').hidden = v !== 'month';
    $('#sheetView').hidden = v !== 'sheet';
    $('#summary').hidden = v !== 'week' && v !== 'month';
  }
  function renderBanner() {
    const b = $('#banner'); b.innerHTML = '';
    if (!API_URL) b.innerHTML = `<div class="banner">아직 서버 주소가 설정되지 않았습니다. Apps Script 웹 앱 URL을 <code class="k">config.js</code> 의 <code class="k">MM_API_URL</code> 에 넣어주세요.</div>`;
  }

  const myToday = () => state.logs.find(l => l.date === todayKey() && state.me && l.memberId === state.me.id) || null;
  let todayDirty = false;
  function renderToday() {
    if (!state.me || state.view !== 'today') return;
    const tk = todayKey(), me = myToday();
    $('#todayLabel').textContent = `${tk.slice(0, 4)}.${mdLabel(tk)} (${DAYS[dow(tk)]})`;
    const cin = me && me.checkIn, cout = me && me.checkOut;
    const pill = cout ? '<span class="pill done">퇴근 완료</span>' : cin ? '<span class="pill on">근무중</span>' : '<span class="pill">출근 전</span>';
    $('#myStatus').innerHTML = `<div class="t num">${cin || '--:--'}<small>출근</small></div><span class="arrow">→</span><div class="t num">${cout || '--:--'}<small>퇴근</small></div>${pill}${cin && cout ? `<span class="muted num">${fmtH(hoursOf(me))}h</span>` : ''}`;
    $('#clockIn').disabled = !!cin || state.loading; $('#clockOut').disabled = !cin || !!cout || state.loading;
    const mine = state.logs.filter(l => l.memberId === state.me.id);
    const wh = mine.reduce((a, l) => a + hoursOf(l), 0), wd = mine.filter(l => l.checkIn).length;
    $('#myWeek').innerHTML = state.loading ? '불러오는 중…' : `이번 주 <b class="num">${wd}</b>일 출근 · <b class="num">${fmtH(wh)}</b>h`;
    if (!todayDirty) { $('#todayWork').value = me ? me.work || '' : ''; $('#todayNote').value = me ? me.note || '' : ''; }
    $('#workSaved').textContent = me && me.updatedAt ? `마지막 저장 ${new Date(me.updatedAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}` : '';
    // 출근 현황: 활성 선생님 전원
    const members = [...state.members.values()].filter(m => m.active !== false);
    const rows = members.map(m => ({ m, l: state.logs.find(l => l.date === tk && l.memberId === m.id) || null }));
    rows.sort((a, b) => {
      const ra = a.l && a.l.checkIn ? (a.l.checkOut ? 1 : 0) : 2, rb = b.l && b.l.checkIn ? (b.l.checkOut ? 1 : 0) : 2;
      return ra - rb || toMin((a.l && a.l.checkIn) || '99:99') - toMin((b.l && b.l.checkIn) || '99:99') || a.m.name.localeCompare(b.m.name, 'ko');
    });
    const working = rows.filter(r => r.l && r.l.checkIn && !r.l.checkOut).length, done = rows.filter(r => r.l && r.l.checkOut).length;
    $('#rosterCount').textContent = `근무중 ${working} · 퇴근 ${done} · 출근 전 ${rows.length - working - done}`;
    const rl = $('#rosterList'); rl.innerHTML = '';
    for (const { m, l } of rows) {
      const cin2 = l && l.checkIn, cout2 = l && l.checkOut;
      const row = document.createElement(canEdit({ memberId: m.id }) && l ? 'button' : 'div');
      row.className = 'rrow'; if (row.tagName === 'BUTTON') { row.type = 'button'; row.style.cssText = 'text-align:left;background:none;border:0;border-top:1px solid var(--rule-2);width:100%;color:inherit'; row.onclick = () => openLog(l); row.title = '일지 열기'; }
      row.innerHTML = `<span class="nm"><span class="dot" style="background:${m.color || COLORS[0]}"></span>${esc(m.name)}${m.id === state.me.id ? ' <span class="me-tag">나</span>' : ''}</span>
        ${cout2 ? '<span class="pill done">퇴근</span>' : cin2 ? '<span class="pill on">근무중</span>' : '<span class="pill">출근 전</span>'}
        <span class="num">${cin2 ? esc(cin2) : '--:--'} – ${cout2 ? esc(cout2) : '--:--'}${cin2 && cout2 ? ` <span class="muted">(${fmtH(hoursOf(l))}h)</span>` : ''}</span>
        <span class="wk">${l && l.work ? esc(l.work.split('\n')[0]) : '<span class="muted">업무내용 없음</span>'}</span>`;
      rl.append(row);
    }
  }

  function logCard(l) {
    const m = memberOf(l.memberId);
    const el = document.createElement(canEdit(l) ? 'button' : 'div');
    el.className = 'log' + (canEdit(l) ? ' editable' : '');
    el.style.setProperty('--c', m.color || COLORS[0]);
    if (canEdit(l)) { el.type = 'button'; el.onclick = () => openLog(l); el.title = '눌러서 수정'; }
    const working = l.checkIn && !l.checkOut;
    el.innerHTML = `
      <div class="who"><span class="dot" style="background:${m.color || COLORS[0]}"></span>${esc(m.name)}<span class="hrs num">${l.checkIn && l.checkOut ? fmtH(hoursOf(l)) + 'h' : ''}</span></div>
      <div class="time num">${esc(l.checkIn || '--:--')} – ${working ? '<span class="on">근무중</span>' : esc(l.checkOut || '--:--')}</div>
      ${l.work ? `<div class="work">${esc(l.work)}</div>` : ''}
      ${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}
      ${l.fixedBy ? `<div class="note fixed" title="${esc(l.fixedBy)}">관리자 수정</div>` : ''}`;
    return el;
  }
  const sorted = () => [...state.logs].sort((a, b) => a.date.localeCompare(b.date) || toMin(a.checkIn || '99:99') - toMin(b.checkIn || '99:99') || memberOf(a.memberId).name.localeCompare(memberOf(b.memberId).name, 'ko'));

  function renderWeek() {
    if (state.view !== 'week') return;
    const g = $('#grid'); g.innerHTML = '';
    const mon = parse(period().from), list = sorted();
    for (let d = 0; d < 7; d++) {
      const key = fmt(addDays(mon, d));
      const col = document.createElement('div');
      col.className = 'col' + (key === todayKey() ? ' today' : '') + (d >= 5 ? ' weekend' : '');
      const items = list.filter(l => l.date === key);
      const tot = items.reduce((a, l) => a + hoursOf(l), 0);
      col.innerHTML = `<div class="dhead"><span class="dname">${DAYS[d]}</span><span class="ddate num">${mdLabel(key)}</span><span class="dcount num">${items.length ? `${items.length}명 · ${fmtH(tot)}h` : ''}</span></div>`;
      const cells = document.createElement('div'); cells.className = 'cells';
      items.forEach(l => cells.append(logCard(l)));
      const add = document.createElement('button'); add.className = 'addcell'; add.type = 'button'; add.textContent = '+ 일지'; add.onclick = () => openLog(null, key); cells.append(add);
      col.append(cells); g.append(col);
    }
  }

  function renderMonth() {
    if (state.view !== 'month') return;
    const box = $('#month'); box.innerHTML = '';
    const { from, to, mFrom, mTo } = period();
    DAYS.forEach((d, i) => { const h = document.createElement('div'); h.className = 'mh' + (i >= 5 ? ' weekend' : ''); h.textContent = d; box.append(h); });
    const list = sorted();
    for (let d = parse(from); fmt(d) <= to; d = addDays(d, 1)) {
      const key = fmt(d), inMonth = key >= mFrom && key <= mTo, wk = (d.getDay() + 6) % 7 >= 5;
      const cell = document.createElement('div');
      cell.className = 'mcell' + (inMonth ? '' : ' dim') + (key === todayKey() ? ' today' : '');
      cell.innerHTML = `<span class="dn${wk ? ' weekend' : ''}">${d.getDate()}</span>`;
      for (const l of list.filter(x => x.date === key)) {
        const m = memberOf(l.memberId), working = l.checkIn && !l.checkOut;
        const row = document.createElement(canEdit(l) ? 'button' : 'div');
        row.className = 'mrow' + (canEdit(l) ? ' editable' : ''); if (canEdit(l)) { row.type = 'button'; row.onclick = () => openLog(l); }
        row.title = `${m.name} ${l.checkIn || '--:--'}–${l.checkOut || '--:--'}${l.work ? '\n' + l.work : ''}`;
        row.innerHTML = `<span class="dot" style="background:${m.color};width:8px;height:8px"></span><span class="nm">${esc(m.name)}</span><span class="h num${working ? ' on' : ''}">${working ? '근무중' : (l.checkIn && l.checkOut ? fmtH(hoursOf(l)) + 'h' : (l.checkIn || ''))}</span>`;
        cell.append(row);
      }
      const add = document.createElement('button'); add.className = 'maddbtn'; add.type = 'button'; add.textContent = '+'; add.title = '일지 입력'; add.onclick = () => openLog(null, key); cell.append(add);
      box.append(cell);
    }
  }

  function renderSheet() {
    if (state.view !== 'sheet') return;
    const w = $('#sheetView'); w.innerHTML = '';
    const { mFrom, mTo } = period();
    const list = sorted().filter(l => l.date >= mFrom && l.date <= mTo);
    if (!list.length) { w.innerHTML = `<div class="empty">${state.loading ? '불러오는 중…' : '이 달에 기록이 없습니다.'}</div>`; return; }
    let html = `<table class="sheet"><thead><tr><th>날짜</th><th>요일</th><th>선생님</th><th>출근</th><th>퇴근</th><th class="r">시간</th><th>업무내용</th><th>비고</th><th></th></tr></thead><tbody>`;
    let tot = 0;
    for (const l of list) {
      const m = memberOf(l.memberId), h = hoursOf(l); tot += h;
      html += `<tr class="hover${l.date === todayKey() ? ' today' : ''}"><td class="num">${esc(l.date)}</td><td>${DAYS[dow(l.date)]}</td><td><span class="swatch" style="background:${m.color || COLORS[0]}"></span>${esc(m.name)}</td><td class="num">${esc(l.checkIn || '')}</td><td class="num">${l.checkIn && !l.checkOut ? '<span style="color:var(--ok);font-weight:700">근무중</span>' : esc(l.checkOut || '')}</td><td class="r num">${l.checkIn && l.checkOut ? fmtH(h) : ''}</td><td class="wrap">${esc(l.work || '')}</td><td class="muted wrap">${esc(l.note || '')}${l.fixedBy ? ` <span class="fixed" title="${esc(l.fixedBy)}">관리자 수정</span>` : ''}</td><td>${canEdit(l) ? `<button class="btn sm" data-edit="${esc(l.id)}">수정</button>` : ''}</td></tr>`;
    }
    html += `</tbody><tfoot><tr><td colspan="5">합계 · ${list.length}건</td><td class="r num">${fmtH(tot)}</td><td colspan="3"></td></tr></tfoot></table>`;
    w.innerHTML = html;
    w.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openLog(state.logs.find(l => l.id === b.dataset.edit)));
  }

  function renderSummary() {
    const box = $('#summary'); box.innerHTML = '';
    if (state.view !== 'week' && state.view !== 'month') return;
    const { mFrom, mTo } = period();
    const per = new Map();
    for (const l of state.logs) {
      if (l.date < mFrom || l.date > mTo) continue;
      const p = per.get(l.memberId) || { hours: 0, days: new Set(), open: 0 };
      p.hours += hoursOf(l); if (l.checkIn) p.days.add(l.date); if (l.checkIn && !l.checkOut && l.date !== todayKey()) p.open++;
      per.set(l.memberId, p);
    }
    const ids = [...per.keys()].sort((a, b) => memberOf(a).name.localeCompare(memberOf(b).name, 'ko'));
    const unit = state.view === 'week' ? '주' : '월';
    for (const id of ids) {
      const m = memberOf(id), p = per.get(id);
      const c = document.createElement('div'); c.className = 'sumcard';
      c.innerHTML = `<span class="dot" style="background:${m.color || COLORS[0]}"></span><div><div class="nm">${esc(m.name)}</div><div class="meta">${p.days.size}일 출근${p.open ? ` · <span style="color:var(--danger)">퇴근 미처리 ${p.open}건</span>` : ''}</div></div><div class="tot num">${fmtH(p.hours)}<small>h / ${unit}</small></div>`;
      box.append(c);
    }
  }
  function renderAll() { renderGate(); renderHeader(); renderBanner(); renderToday(); renderWeek(); renderMonth(); renderSheet(); renderSummary(); }

  // ---------- 출근/퇴근/오늘 메모 ----------
  async function clock(type) {
    const b = type === 'in' ? $('#clockIn') : $('#clockOut'); b.disabled = true;
    try { const l = await api('clock', { type }); mergeLog(l); toast(type === 'in' ? `출근 처리했습니다 (${l.checkIn})` : `퇴근 처리했습니다 (${l.checkOut})`); }
    catch (ex) { toast(friendly(ex)); refresh(); }
    renderAll();
  }
  $('#clockIn').onclick = () => clock('in');
  $('#clockOut').onclick = () => clock('out');
  $('#todayWork').addEventListener('input', () => { todayDirty = true; });
  $('#todayNote').addEventListener('input', () => { todayDirty = true; });
  $('#saveToday').onclick = async () => {
    const me = myToday();
    const b = $('#saveToday'); b.disabled = true;
    try {
      const l = await api('saveLog', { log: { id: me ? me.id : '', date: todayKey(), memberId: state.me.id, checkIn: me ? me.checkIn : '', checkOut: me ? me.checkOut : '', work: $('#todayWork').value, note: $('#todayNote').value } });
      todayDirty = false; mergeLog(l); toast('업무내용을 저장했습니다');
    } catch (ex) { toast(friendly(ex)); }
    b.disabled = false; renderAll();
  };
  function mergeLog(l) {
    const i = state.logs.findIndex(x => x.id === l.id || (x.date === l.date && x.memberId === l.memberId));
    if (i >= 0) state.logs[i] = l; else state.logs.push(l);
  }

  // ---------- 일지 입력/수정 ----------
  function openLog(l, dateKey) {
    if (!state.me) return;
    state.editing = l || null;
    $('#logTitle').textContent = l ? '일지 수정' : '일지 입력';
    $('#logDelete').hidden = !l || !isAdmin(); $('#logErr').textContent = '';
    $('#logHint').textContent = isAdmin()
      ? '출근·퇴근 버튼을 못 눌렀거나 잘못 찍힌 시각을 바로잡을 때 씁니다. 시각을 고치면 "관리자 수정" 표시가 남습니다.'
      : '업무내용과 비고만 쓸 수 있습니다. 출근·퇴근 시각은 버튼으로만 기록되며, 잘못 찍힌 경우 원장님께 말씀해 주세요.';
    $('#fIn').disabled = !isAdmin(); $('#fOut').disabled = !isAdmin(); $('#fDate').disabled = !isAdmin() && !!l;
    $('#fDate').value = l ? l.date : (dateKey || todayKey());
    const mSel = $('#fMember');
    const list = [...state.members.values()].filter(m => m.active !== false || (l && m.id === l.memberId)).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    const opts = isAdmin() ? list : list.filter(m => m.id === state.me.id);
    mSel.innerHTML = opts.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
    mSel.value = l ? l.memberId : state.me.id; mSel.disabled = !isAdmin();
    $('#fIn').value = l ? l.checkIn || '' : ''; $('#fOut').value = l ? l.checkOut || '' : '';
    $('#fWork').value = l ? l.work || '' : ''; $('#fNote').value = l ? l.note || '' : '';
    $('#logModal').classList.add('open'); $('#fIn').focus();
  }
  $('#logForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('#logErr'); err.textContent = '';
    const cin = $('#fIn').value, cout = $('#fOut').value;
    if (cin && cout && toMin(cout) <= toMin(cin)) { err.textContent = '퇴근 시각이 출근 시각보다 늦어야 합니다.'; return; }
    const b = $('#logSave'); b.disabled = true;
    try {
      const l = await api('saveLog', { log: { id: state.editing ? state.editing.id : '', date: $('#fDate').value, memberId: $('#fMember').value, checkIn: cin, checkOut: cout, work: $('#fWork').value, note: $('#fNote').value } });
      if (l.date >= period().from && l.date <= period().to) mergeLog(l);
      if (l.date === todayKey() && l.memberId === state.me.id) todayDirty = false;
      closeModals(); toast(state.editing ? '수정했습니다' : '저장했습니다'); renderAll();
    } catch (ex) { err.textContent = friendly(ex); }
    b.disabled = false;
  };
  $('#logDelete').onclick = async () => {
    if (!state.editing) return;
    if (!confirm('이 일지를 삭제할까요?')) return;
    try { await api('deleteLog', { id: state.editing.id }); state.logs = state.logs.filter(x => x.id !== state.editing.id); closeModals(); toast('삭제했습니다'); renderAll(); }
    catch (ex) { $('#logErr').textContent = friendly(ex); }
  };
  $('#addLog').onclick = () => openLog(null, state.view === 'week' || state.view === 'month' ? (todayKey() >= period().from && todayKey() <= period().to ? todayKey() : period().mFrom) : todayKey());

  // ---------- CSV ----------
  $('#exportCsv').onclick = () => {
    const { mFrom, mTo } = period();
    const list = sorted().filter(l => l.date >= mFrom && l.date <= mTo);
    if (!list.length) { toast('내보낼 기록이 없습니다'); return; }
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['날짜', '요일', '아이디', '선생님', '출근', '퇴근', '시간', '업무내용', '비고']];
    for (const l of list) rows.push([l.date, DAYS[dow(l.date)], l.memberId, memberOf(l.memberId).name, l.checkIn || '', l.checkOut || '', l.checkIn && l.checkOut ? fmtH(hoursOf(l)) : '', l.work || '', l.note || '']);
    const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `문제풀이근무일지_${mFrom}_${mTo}.csv`;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  // ---------- 로그인 ----------
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const id = $('#lId').value.trim(), pw = $('#lPin').value;
    if (!id || !pw) return;
    state.loggingIn = true; renderGate();
    try {
      const d = await api('login', { id, pw });
      state.token = d.token; state.me = d.me; session.save({ token: d.token, me: d.me });
      $('#lPin').value = ''; state.loggingIn = false; state.membersLoaded = true;
      loadMembers(d.members); state.anchor = parse(todayKey()); subscribe(); toast(`${d.me.name}님, 들어왔습니다`);
    } catch (ex) {
      state.loggingIn = false; renderGate();
      $('#loginErr').textContent = friendly(ex); $('#lPin').value = ''; $('#lPin').focus();
    }
  };

  // ---------- 아이디 관리 ----------
  let pickedColor = COLORS[0];
  function openMembers() { if (!isAdmin()) return; renderMemberRows(); resetMemberForm(); $('#memberModal').classList.add('open'); }
  function resetMemberForm(editId) {
    state.editingMember = editId || null;
    $('#memberFormTitle').textContent = editId ? `아이디 수정 · ${editId}` : '새 아이디';
    $('#mId').value = editId || ''; $('#mId').disabled = !!editId;
    const m = editId ? state.members.get(editId) : null;
    $('#mName').value = m ? m.name : '';
    $('#mPin').value = ''; $('#mPin').required = !editId; $('#mPin').placeholder = editId ? '바꿀 때만 입력' : '';
    $('#mRole').value = m ? (m.role || 'teacher') : 'teacher';
    const used = new Set([...state.members.values()].map(x => x.color));
    pickedColor = m ? m.color : (COLORS.find(c => !used.has(c)) || COLORS[state.members.size % COLORS.length]);
    renderSwatches(); $('#memberErr').textContent = '';
    $('#memberForm button[type=submit]').textContent = editId ? '저장' : '아이디 만들기';
  }
  function renderSwatches() {
    const box = $('#mColors'); box.innerHTML = '';
    for (const c of COLORS) { const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.title = c; b.setAttribute('aria-pressed', c === pickedColor); b.onclick = () => { pickedColor = c; renderSwatches(); }; box.append(b); }
  }
  function renderMemberRows() {
    const tb = $('#memberRows'); tb.innerHTML = '';
    const list = [...state.members.values()].sort((a, b) => (a.role === 'admin' ? 0 : 1) - (b.role === 'admin' ? 0 : 1) || a.name.localeCompare(b.name, 'ko'));
    for (const m of list) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><span class="dot" style="background:${m.color || COLORS[0]}"></span></td><td><code class="k">${esc(m.id)}</code></td><td>${esc(m.name)}</td><td><span class="role ${m.role === 'admin' ? 'admin' : ''}">${m.role === 'admin' ? '관리자' : '선생님'}</span></td><td>${m.active === false ? '<span class="muted">비활성</span>' : '사용중'}</td><td style="white-space:nowrap"><button class="btn sm" data-edit>수정</button> <button class="btn sm ghost" data-toggle>${m.active === false ? '다시 활성' : '비활성'}</button></td>`;
      tr.querySelector('[data-edit]').onclick = () => resetMemberForm(m.id);
      tr.querySelector('[data-toggle]').onclick = async () => {
        if (m.id === state.me.id) { toast('자기 자신은 비활성화할 수 없습니다'); return; }
        try { loadMembers(await api('saveMember', { member: { id: m.id, name: m.name, role: m.role, color: m.color, active: m.active === false } })); toast('저장했습니다'); }
        catch (ex) { toast(friendly(ex)); }
      };
      tb.append(tr);
    }
  }
  $('#memberForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('#memberErr'); err.textContent = '';
    const id = state.editingMember || $('#mId').value.trim();
    const name = $('#mName').value.trim(), pw = $('#mPin').value, role = $('#mRole').value;
    if (!state.editingMember && state.members.has(id.toLowerCase())) { err.textContent = '이미 있는 아이디입니다.'; return; }
    if (pw && pw.length < 4) { err.textContent = '비밀번호는 4자 이상입니다.'; return; }
    const prev = state.editingMember ? state.members.get(id) : { active: true };
    const member = { id, name, role, color: pickedColor, active: prev.active !== false };
    if (pw) member.pw = pw;
    try { loadMembers(await api('saveMember', { member })); toast(state.editingMember ? '저장했습니다' : `아이디 ${id.toLowerCase()} 를 만들었습니다`); resetMemberForm(); }
    catch (ex) { err.textContent = friendly(ex); }
  };
  $('#manageMembers').onclick = openMembers;

  // ---------- 공통 ----------
  function closeModals() { document.querySelectorAll('.backdrop').forEach(b => b.classList.remove('open')); renderGate(); }
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModals);
  document.querySelectorAll('.backdrop').forEach(b => b.addEventListener('mousedown', e => { if (e.target === b && b.id !== 'loginModal') closeModals(); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

  // ---------- 기간 이동 / 보기 ----------
  function move(n) { state.anchor = state.view === 'week' ? addDays(mondayOf(state.anchor), 7 * n) : addMonths(state.anchor, n); subscribe(); }
  $('#prevBtn').onclick = () => move(-1);
  $('#nextBtn').onclick = () => move(1);
  $('#todayBtn').onclick = () => { state.anchor = parse(todayKey()); subscribe(); };
  function setView(v) {
    const before = period();
    state.view = v;
    if (v === 'today') state.anchor = parse(todayKey());
    const after = period();
    if (before.from !== after.from || before.to !== after.to) subscribe(); else renderAll();
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll('.tabs [data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));

  function loadMembers(list) {
    state.members = new Map(list.map(m => [m.id, m]));
    if (state.me && state.members.has(state.me.id)) { const m = state.members.get(state.me.id); state.me = { ...state.me, name: m.name, role: m.role }; }
    if ($('#memberModal').classList.contains('open')) renderMemberRows();
    renderAll();
  }

  // ---------- 시작 ----------
  state.anchor = parse(fmt(new Date()));
  const saved = session.load();
  if (saved && saved.token && saved.me) { state.token = saved.token; state.me = saved.me; }
  renderAll();
  (async () => {
    if (!state.token || !API_URL) return;
    try {
      const d = await api('me');
      state.me = d.me; session.save({ token: state.token, me: d.me });
      state.membersLoaded = true; loadMembers(d.members); state.anchor = parse(todayKey()); subscribe();
    } catch (ex) { if (ex.code !== 'unauthorized') toast(friendly(ex)); }
  })();
})();
</script>
</body>
</html>
