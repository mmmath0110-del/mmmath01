<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더블엠 문제풀이 근무표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --paper:#F5F6F9; --sheet:#FFFFFF; --ink:#16213A; --ink-2:#5A6379; --ink-3:#9AA3B5;
    --rule:#D8DDE6; --rule-2:#EBEEF3; --cobalt:#2A4BB8; --cobalt-ink:#FFFFFF; --cobalt-soft:#E7ECFA;
    --today:#E09A2E; --today-soft:#FBF1DF; --danger:#C8423C; --ok:#2E8B57;
    --shadow:0 12px 32px rgba(22,33,58,.16);
    --grid:rgba(42,75,184,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1220; --sheet:#171D2E; --ink:#E5E9F2; --ink-2:#A9B1C4; --ink-3:#6F778A;
      --rule:#2B3346; --rule-2:#222A3C; --cobalt:#8AA0F5; --cobalt-ink:#0E1220; --cobalt-soft:#1F2A4A;
      --today:#F0B657; --today-soft:#332913; --danger:#F07C76; --ok:#63C08A;
      --shadow:0 12px 32px rgba(0,0,0,.5); --grid:rgba(138,160,245,.08);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1220; --sheet:#171D2E; --ink:#E5E9F2; --ink-2:#A9B1C4; --ink-3:#6F778A;
    --rule:#2B3346; --rule-2:#222A3C; --cobalt:#8AA0F5; --cobalt-ink:#0E1220; --cobalt-soft:#1F2A4A;
    --today:#F0B657; --today-soft:#332913; --danger:#F07C76; --ok:#63C08A;
    --shadow:0 12px 32px rgba(0,0,0,.5); --grid:rgba(138,160,245,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.5;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;
  }
  .num{font-family:"IBM Plex Mono","Noto Sans KR",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:7px 9px}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
  .btn{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:7px 12px;font-weight:500;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
  .btn.danger{color:var(--danger)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn.ghost:hover{background:var(--rule-2)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:4px 9px;font-size:12.5px}

  header{
    position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule);
    padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap
  }
  .brand{display:flex;flex-direction:column;gap:0;min-width:180px}
  .brand .name{font-family:"Noto Serif KR","Noto Sans KR",serif;font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.2}
  .brand .sub{font-size:11.5px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
  .weeknav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .weeknav .range{font-weight:500;min-width:190px;text-align:center}
  .seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .seg button{border:0;background:var(--sheet);padding:6px 12px;color:var(--ink-2)}
  .seg button[aria-pressed="true"]{background:var(--cobalt-soft);color:var(--cobalt);font-weight:700}
  .me{display:flex;align-items:center;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:999px;background:var(--rule-2);font-size:12.5px;font-weight:500}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--cobalt);flex:none}

  main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar .spacer{flex:1}
  .banner{background:var(--today-soft);border:1px solid var(--today);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
  .banner.blue{background:var(--cobalt-soft);border-color:var(--cobalt)}

  /* 주간표 */
  .board{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));min-width:1190px}
  .col{border-right:1px solid var(--rule-2);display:flex;flex-direction:column;min-height:360px}
  .col:last-child{border-right:0}
  .col.today .dhead{background:var(--today-soft)}
  .col.weekend .dhead .dname{color:var(--danger)}
  .dhead{padding:10px 12px 8px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:8px;position:sticky;top:0;background:var(--sheet)}
  .dhead .dname{font-weight:700;font-size:15px}
  .dhead .ddate{color:var(--ink-2);font-size:12px}
  .dhead .dcount{margin-left:auto;color:var(--ink-3);font-size:12px}
  .cells{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
  .shift{
    border:1px solid var(--rule);border-left:4px solid var(--c,var(--cobalt));border-radius:6px;background:var(--sheet);
    padding:8px 10px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%
  }
  .shift.editable:hover{border-color:var(--ink-3);box-shadow:0 2px 8px rgba(22,33,58,.08)}
  .shift .who{display:flex;align-items:center;gap:6px;font-weight:700}
  .shift .who .hrs{margin-left:auto;color:var(--ink-2);font-weight:500;font-size:12px}
  .shift .time{color:var(--ink);font-size:13.5px}
  .shift .tasks{display:flex;flex-wrap:wrap;gap:4px}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--rule-2);color:var(--ink-2)}
  .shift .note{font-size:12px;color:var(--ink-2);white-space:pre-wrap}
  .shift.example{border-style:dashed;opacity:.6}
  .shift.example .who::after{content:"예시";font-size:10.5px;color:var(--today);margin-left:4px;font-weight:500}
  .addcell{border:1px dashed var(--rule);border-radius:6px;padding:8px;color:var(--ink-3);background:transparent;width:100%}
  .addcell:hover{color:var(--cobalt);border-color:var(--cobalt)}

  /* 요약 */
  .summary{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .sumcard{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
  .sumcard .nm{font-weight:700}
  .sumcard .meta{color:var(--ink-2);font-size:12px}
  .sumcard .tot{margin-left:auto;font-size:18px;font-weight:700}
  .sumcard .tot small{font-size:11px;color:var(--ink-2);font-weight:500;margin-left:2px}

  /* 시트 */
  .sheetwrap{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
  table.sheet{border-collapse:collapse;width:100%;min-width:820px}
  table.sheet th,table.sheet td{border-bottom:1px solid var(--rule-2);padding:9px 12px;text-align:left;vertical-align:top}
  table.sheet th{font-size:12px;letter-spacing:.06em;color:var(--ink-2);font-weight:500;background:var(--paper);position:sticky;top:0}
  table.sheet tr.dayrow td{background:var(--rule-2);font-weight:700;padding:6px 12px}
  table.sheet tr.today td{background:var(--today-soft)}
  table.sheet td.r{text-align:right}
  table.sheet tr.hover:hover td{background:var(--cobalt-soft)}
  table.sheet .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-2)}

  /* 모달 */
  .backdrop{position:fixed;inset:0;background:rgba(10,14,25,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
  .backdrop.open{display:flex}
  .modal{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:520px;padding:20px 22px}
  .modal.wide{max-width:760px}
  .modal h2{margin:0 0 4px;font-size:17px;text-wrap:balance}
  .modal .hint{color:var(--ink-2);font-size:12.5px;margin:0 0 14px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .form .full{grid-column:1/-1}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--ink-2);letter-spacing:.03em}
  .field input,.field select,.field textarea{width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
  .chips button[aria-pressed="true"]{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:700}
  .actions{display:flex;gap:8px;margin-top:16px;align-items:center}
  .actions .spacer{flex:1}
  .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:8px}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .swatches button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0}
  .swatches button[aria-pressed="true"]{border-color:var(--ink)}
  table.members{border-collapse:collapse;width:100%;font-size:13px}
  table.members th,table.members td{padding:7px 8px;border-bottom:1px solid var(--rule-2);text-align:left}
  table.members th{color:var(--ink-2);font-weight:500;font-size:12px}
  .role{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--rule-2);color:var(--ink-2)}
  .role.admin{background:var(--cobalt-soft);color:var(--cobalt)}
  .muted{color:var(--ink-3)}
  code.k{background:var(--rule-2);padding:1px 6px;border-radius:4px;font-size:12.5px}

  body.locked main, body.locked .weeknav, body.locked .seg, body.locked .me{display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  @media (max-width:720px){
    header{padding:10px 12px}
    main{padding:12px 10px 60px}
    .weeknav{margin-left:0;width:100%}
    .weeknav .range{flex:1}
    .form{grid-template-columns:1fr}
  }
</style>

</head>
<body>
<script src="config.js"></script>
<header>
  <div class="brand">
    <div class="name">더블엠수학학원 · 문제풀이 근무표</div>
    <div class="sub">Tutor shifts · 요일별 근무시간 · 업무</div>
  </div>
  <div class="weeknav">
    <button class="btn sm" id="prevWeek" aria-label="지난주">◀</button>
    <div class="range num" id="weekRange">-</div>
    <button class="btn sm" id="nextWeek" aria-label="다음주">▶</button>
    <button class="btn sm ghost" id="thisWeek">이번주</button>
  </div>
  <div class="seg" role="group" aria-label="보기">
    <button id="viewGrid" aria-pressed="true">주간표</button>
    <button id="viewSheet" aria-pressed="false">시트</button>
  </div>
  <div class="me" id="meBox"></div>
</header>

<main>
  <div id="banner"></div>
  <div class="toolbar">
    <button class="btn primary" id="addShift">+ 근무 등록</button>
    <button class="btn" id="copyPrev">지난주 가져오기</button>
    <div class="spacer"></div>
    <button class="btn" id="exportCsv">CSV 내려받기</button>
    <button class="btn" id="manageMembers" hidden>아이디 관리</button>
  </div>
  <section id="gridView" class="board"><div class="grid" id="grid"></div></section>
  <section id="sheetView" class="sheetwrap" hidden></section>
  <section class="summary" id="summary"></section>
</main>

<!-- 근무 등록/수정 -->
<div class="backdrop" id="shiftModal">
  <form class="modal" id="shiftForm" autocomplete="off">
    <h2 id="shiftTitle">근무 등록</h2>
    <p class="hint" id="shiftHint">요일과 시간을 정하고 그 시간에 하는 업무를 고르세요.</p>
    <div class="form">
      <div class="field"><label for="fDay">요일</label><select id="fDay"></select></div>
      <div class="field"><label for="fMember">선생님</label><select id="fMember"></select></div>
      <div class="field"><label for="fStart">출근</label><input type="time" id="fStart" step="600" required></div>
      <div class="field"><label for="fEnd">퇴근</label><input type="time" id="fEnd" step="600" required></div>
      <div class="field full"><label>업무</label><div class="chips" id="fTasks"></div></div>
      <div class="field full"><label for="fExtra">기타 업무 (쉼표로 구분)</label><input id="fExtra" placeholder="예: 중3 기말 대비 프린트 채점"></div>
      <div class="field full"><label for="fNote">비고</label><textarea id="fNote" rows="2" placeholder="대타, 조퇴 예정 등"></textarea></div>
    </div>
    <div class="err" id="shiftErr"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="shiftDelete" hidden>삭제</button>
      <div class="spacer"></div>
      <button type="button" class="btn" data-close>취소</button>
      <button type="submit" class="btn primary" id="shiftSave">저장</button>
    </div>
  </form>
</div>

<!-- 로그인 -->
<div class="backdrop" id="loginModal">
  <form class="modal" id="loginForm" autocomplete="off">
    <h2>더블엠수학학원 · 문제풀이 근무표</h2>
    <p class="hint">이 페이지는 아이디를 받은 분만 볼 수 있습니다. 원장님이 알려준 아이디와 비밀번호를 입력하세요.</p>
    <div class="form">
      <div class="field"><label for="lId">아이디</label><input id="lId" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label for="lPin">비밀번호</label><input id="lPin" type="password" autocomplete="current-password" required></div>
    </div>
    <div class="err" id="loginErr"></div>
    <div class="actions"><span class="muted" id="loginStatus"></span><div class="spacer"></div><button type="submit" class="btn primary" id="loginBtn">들어가기</button></div>
  </form>
</div>

<!-- 아이디 관리 -->
<div class="backdrop" id="memberModal">
  <div class="modal wide">
    <h2>아이디 관리</h2>
    <p class="hint">선생님마다 아이디를 하나씩 부여합니다. 이 페이지의 공유 링크와 아이디·비밀번호를 함께 전달하세요.</p>
    <div style="overflow-x:auto"><table class="members"><thead><tr><th>색</th><th>아이디</th><th>이름</th><th>역할</th><th>상태</th><th></th></tr></thead><tbody id="memberRows"></tbody></table></div>
    <form id="memberForm" autocomplete="off" style="margin-top:16px;border-top:1px solid var(--rule);padding-top:14px">
      <div style="font-weight:700;margin-bottom:8px" id="memberFormTitle">새 아이디</div>
      <div class="form">
        <div class="field"><label for="mId">아이디 (영문·숫자)</label><input id="mId" pattern="[A-Za-z0-9_.\-]{2,20}" required></div>
        <div class="field"><label for="mName">이름</label><input id="mName" required placeholder="예: 김민수"></div>
        <div class="field"><label for="mPin">비밀번호 (4자 이상)</label><input id="mPin" minlength="4" required></div>
        <div class="field"><label for="mRole">역할</label><select id="mRole"><option value="teacher">문제풀이 선생님</option><option value="admin">관리자</option></select></div>
        <div class="field full"><label>표시 색</label><div class="swatches" id="mColors"></div></div>
      </div>
      <div class="err" id="memberErr"></div>
      <div class="actions"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button><button type="submit" class="btn primary">아이디 만들기</button></div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
  const TASKS = ['문제풀이', '오답정리', '질문받기', '테스트 감독', '채점', '클리닉', '숙제검사', '교재정리', '상담보조'];
  const COLORS = ['#2A4BB8', '#C8423C', '#2E8B57', '#D97706', '#7C3AED', '#0E7490', '#BE185D', '#4B5563'];
  const LS_SESSION = 'mm-tutor-web-session';

  const state = {
    token: null, loggingIn: false, loading: true,
    weekKey: null, view: 'grid',
    members: new Map(), shifts: [], me: null,
    unsubShifts: null, editing: null, editingMember: null, membersLoaded: false,
  };

  // ---------- 날짜 ----------
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const todayKey = fmt(new Date());
  const toMin = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };
  const hoursOf = s => Math.max(0, toMin(s.end) - toMin(s.start)) / 60;
  const fmtH = h => (Math.round(h * 100) / 100).toString();

  // ---------- API (Google Apps Script) ----------
  const API_URL = (window.MM_API_URL || '').trim();
  async function api(action, payload = {}) {
    if (!API_URL) throw { code: 'no_api', message: 'config.js 에 MM_API_URL 이 비어 있습니다.' };
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, token: state.token || '', ...payload }) });
    } catch { throw { code: 'network', message: '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.' }; }
    let out; try { out = await res.json(); } catch { throw { code: 'server_error', message: '서버 응답을 읽을 수 없습니다. 배포 설정(액세스: 모든 사용자)을 확인하세요.' }; }
    if (!out.ok) {
      if (out.error === 'unauthorized') logoutLocal();
      throw { code: out.error, message: out.message };
    }
    return out.data;
  }

  const store = {
    subscribeShifts(weekKey, cb) {
      let alive = true;
      const run = async () => {
        if (!alive || !state.token) return;
        try { const list = await api('listShifts', { week: weekKey }); if (alive) cb(list); }
        catch (ex) { if (alive) toast(friendly(ex)); }
      };
      run();
      const t = setInterval(() => { if (document.visibilityState === 'visible') run(); }, 30000);
      store._refresh = run;
      return () => { alive = false; clearInterval(t); if (store._refresh === run) store._refresh = null; };
    },
    getShifts(weekKey) { return api('listShifts', { week: weekKey }); },
    async saveShift(id, data) { await api('saveShift', { shift: { id: id || '', ...data } }); store._refresh && store._refresh(); },
    async deleteShift(id) { await api('deleteShift', { id }); store._refresh && store._refresh(); },
    async saveMember(id, data) { const list = await api('saveMember', { member: { id, ...data } }); loadMembers(list); },
  };

  // ---------- 세션 ----------
  const session = {
    load() { try { return JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); } catch { return null; } },
    save(o) { try { o ? localStorage.setItem(LS_SESSION, JSON.stringify(o)) : localStorage.removeItem(LS_SESSION); } catch {} },
  };
  function logoutLocal() {
    state.token = null; state.me = null; state.members = new Map(); state.shifts = [];
    if (state.unsubShifts) { state.unsubShifts(); state.unsubShifts = null; }
    session.save(null); renderAll();
  }
  async function logout() { const t = state.token; logoutLocal(); if (t) { try { await api('logout', { token: t }); } catch {} } }
  const isAdmin = () => state.me && state.me.role === 'admin';
  const canEdit = s => !!state.me && (isAdmin() || s.memberId === state.me.id);
  const EXAMPLES = { __ex: { id: '__ex', name: '김선생', color: '#9AA3B5' }, __ex2: { id: '__ex2', name: '이선생', color: '#9AA3B5' } };
  const memberOf = id => state.members.get(id) || EXAMPLES[id] || { id, name: id, color: '#9AA3B5' };

  // ---------- 렌더 ----------
  function weekLabel() {
    const mon = parse(state.weekKey), sun = addDays(mon, 6);
    return `${mon.getFullYear()}.${pad(mon.getMonth() + 1)}.${pad(mon.getDate())} – ${pad(sun.getMonth() + 1)}.${pad(sun.getDate())}`;
  }

  function renderHeader() {
    $('#weekRange').textContent = weekLabel();
    const box = $('#meBox'); box.innerHTML = '';
    if (state.me) {
      const m = memberOf(state.me.id);
      const chip = document.createElement('span'); chip.className = 'chip';
      chip.innerHTML = `<span class="dot" style="background:${m.color || COLORS[0]}"></span>${esc(m.name)} <span class="muted">· ${isAdmin() ? '관리자' : '선생님'}</span>`;
      const out = document.createElement('button'); out.className = 'btn sm ghost'; out.textContent = '로그아웃';
      out.onclick = logout;
      box.append(chip, out);
    } else {
      const b = document.createElement('button'); b.className = 'btn sm primary'; b.textContent = '로그인';
      b.onclick = openLogin; box.append(b);
    }
    $('#manageMembers').hidden = !isAdmin();
    $('#addShift').disabled = !state.me;
    $('#copyPrev').disabled = !state.me;
    $('#viewGrid').setAttribute('aria-pressed', state.view === 'grid');
    $('#viewSheet').setAttribute('aria-pressed', state.view === 'sheet');
    $('#gridView').hidden = state.view !== 'grid';
    $('#sheetView').hidden = state.view !== 'sheet';
  }

  function renderBanner() {
    const b = $('#banner'); b.innerHTML = '';
    if (!API_URL) {
      b.innerHTML = `<div class="banner">아직 서버 주소가 설정되지 않았습니다. Apps Script 웹 앱 URL을 <code class="k">config.js</code> 의 <code class="k">MM_API_URL</code> 에 넣어주세요.</div>`;
    }
  }

  function sortedShifts() {
    return [...state.shifts].sort((a, b) => a.day - b.day || toMin(a.start) - toMin(b.start) || memberOf(a.memberId).name.localeCompare(memberOf(b.memberId).name, 'ko'));
  }

  function shiftCard(s, example) {
    const m = memberOf(s.memberId);
    const el = document.createElement(example || !canEdit(s) ? 'div' : 'button');
    el.className = 'shift' + (example ? ' example' : '') + (canEdit(s) && !example ? ' editable' : '');
    el.style.setProperty('--c', m.color || COLORS[0]);
    if (!example && canEdit(s)) { el.type = 'button'; el.onclick = () => openShift(s); el.title = '눌러서 수정'; }
    el.innerHTML = `
      <div class="who"><span class="dot" style="background:${m.color || COLORS[0]}"></span>${esc(m.name)}<span class="hrs num">${fmtH(hoursOf(s))}h</span></div>
      <div class="time num">${esc(s.start)} – ${esc(s.end)}</div>
      ${(s.tasks && s.tasks.length) ? `<div class="tasks">${s.tasks.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}`;
    return el;
  }

  function renderGrid() {
    const g = $('#grid'); g.innerHTML = '';
    const mon = parse(state.weekKey);
    const list = sortedShifts();
    const showExample = !state.loading && list.length === 0;
    const examples = showExample ? [
      { day: 0, memberId: '__ex', start: '14:00', end: '18:00', tasks: ['문제풀이', '질문받기'] },
      { day: 2, memberId: '__ex', start: '16:00', end: '20:00', tasks: ['테스트 감독', '채점'] },
      { day: 5, memberId: '__ex2', start: '10:00', end: '13:00', tasks: ['클리닉'], note: '주말 클리닉' },
    ] : [];
    for (let d = 0; d < 7; d++) {
      const date = addDays(mon, d), key = fmt(date);
      const col = document.createElement('div');
      col.className = 'col' + (key === todayKey ? ' today' : '') + (d >= 5 ? ' weekend' : '');
      const items = list.filter(s => s.day === d);
      const tot = items.reduce((a, s) => a + hoursOf(s), 0);
      col.innerHTML = `<div class="dhead"><span class="dname">${DAYS[d]}</span><span class="ddate num">${pad(date.getMonth() + 1)}.${pad(date.getDate())}</span><span class="dcount num">${items.length ? `${items.length}명 · ${fmtH(tot)}h` : ''}</span></div>`;
      const cells = document.createElement('div'); cells.className = 'cells';
      items.forEach(s => cells.append(shiftCard(s)));
      examples.filter(s => s.day === d).forEach(s => cells.append(shiftCard(s, true)));
      if (state.me) {
        const add = document.createElement('button'); add.className = 'addcell'; add.type = 'button';
        add.textContent = '+ 등록'; add.onclick = () => openShift(null, d); cells.append(add);
      }
      col.append(cells); g.append(col);
    }
  }

  function renderSheet() {
    const w = $('#sheetView'); w.innerHTML = '';
    const list = sortedShifts();
    if (!list.length) { w.innerHTML = `<div class="empty">${state.loading ? '불러오는 중…' : '이번 주에 등록된 근무가 없습니다.'}</div>`; return; }
    const mon = parse(state.weekKey);
    let html = `<table class="sheet"><thead><tr><th>요일</th><th>선생님</th><th>근무시간</th><th class="r">시간</th><th>업무</th><th>비고</th><th></th></tr></thead><tbody>`;
    let cur = -1;
    for (const s of list) {
      if (s.day !== cur) {
        cur = s.day; const date = addDays(mon, cur);
        const items = list.filter(x => x.day === cur);
        html += `<tr class="dayrow${fmt(date) === todayKey ? ' today' : ''}"><td colspan="7">${DAYS[cur]}요일 <span class="muted num">${pad(date.getMonth() + 1)}.${pad(date.getDate())}</span> <span class="muted num" style="font-weight:500">· ${items.length}명 · ${fmtH(items.reduce((a, x) => a + hoursOf(x), 0))}h</span></td></tr>`;
      }
      const m = memberOf(s.memberId);
      html += `<tr class="hover"><td></td><td><span class="swatch" style="background:${m.color || COLORS[0]}"></span>${esc(m.name)}</td><td class="num">${esc(s.start)} – ${esc(s.end)}</td><td class="r num">${fmtH(hoursOf(s))}</td><td>${(s.tasks || []).map(t => `<span class="tag">${esc(t)}</span>`).join(' ')}</td><td class="muted">${esc(s.note || '')}</td><td>${canEdit(s) ? `<button class="btn sm" data-edit="${esc(s.id)}">수정</button>` : ''}</td></tr>`;
    }
    html += '</tbody></table>';
    w.innerHTML = html;
    w.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openShift(state.shifts.find(s => s.id === b.dataset.edit)));
  }

  function renderSummary() {
    const box = $('#summary'); box.innerHTML = '';
    const per = new Map();
    for (const s of state.shifts) {
      const p = per.get(s.memberId) || { hours: 0, days: new Set() };
      p.hours += hoursOf(s); p.days.add(s.day); per.set(s.memberId, p);
    }
    const ids = [...per.keys()].sort((a, b) => memberOf(a).name.localeCompare(memberOf(b).name, 'ko'));
    for (const id of ids) {
      const m = memberOf(id), p = per.get(id);
      const c = document.createElement('div'); c.className = 'sumcard';
      c.innerHTML = `<span class="dot" style="background:${m.color || COLORS[0]}"></span><div><div class="nm">${esc(m.name)}</div><div class="meta">${[...p.days].sort().map(d => DAYS[d]).join(' · ')}</div></div><div class="tot num">${fmtH(p.hours)}<small>h / 주</small></div>`;
      box.append(c);
    }
  }

  function renderGate() {
    const locked = !state.me;
    document.body.classList.toggle('locked', locked);
    const lm = $('#loginModal');
    if (locked) {
      if (!lm.classList.contains('open')) { $('#loginErr').textContent = ''; lm.classList.add('open'); }
      $('#loginBtn').disabled = !API_URL || state.loggingIn;
      $('#loginStatus').textContent = !API_URL ? '서버 주소 미설정' : (state.loggingIn ? '확인 중…' : '');
    } else lm.classList.remove('open');
  }
  function renderAll() { renderGate(); renderHeader(); renderBanner(); renderGrid(); renderSheet(); renderSummary(); }

  // ---------- 근무 등록/수정 ----------
  let pickedTasks = new Set();
  function openShift(s, day) {
    if (!state.me) { openLogin(); return; }
    state.editing = s || null;
    $('#shiftTitle').textContent = s ? '근무 수정' : '근무 등록';
    $('#shiftDelete').hidden = !s;
    $('#shiftErr').textContent = '';
    const dSel = $('#fDay'); dSel.innerHTML = DAYS.map((d, i) => `<option value="${i}">${d}요일</option>`).join('');
    dSel.value = s ? s.day : (day ?? 0);
    const mSel = $('#fMember');
    const list = [...state.members.values()].filter(m => m.active !== false || (s && m.id === s.memberId));
    const opts = isAdmin() ? list : list.filter(m => m.id === state.me.id);
    mSel.innerHTML = opts.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
    mSel.value = s ? s.memberId : state.me.id;
    mSel.disabled = !isAdmin();
    $('#fStart').value = s ? s.start : '14:00';
    $('#fEnd').value = s ? s.end : '18:00';
    pickedTasks = new Set((s && s.tasks) || []);
    const extra = [...pickedTasks].filter(t => !TASKS.includes(t));
    $('#fExtra').value = extra.join(', ');
    $('#fNote').value = s ? (s.note || '') : '';
    renderTaskChips();
    $('#shiftModal').classList.add('open');
    $('#fStart').focus();
  }
  function renderTaskChips() {
    const box = $('#fTasks'); box.innerHTML = '';
    for (const t of TASKS) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = t;
      b.setAttribute('aria-pressed', pickedTasks.has(t));
      b.onclick = () => { pickedTasks.has(t) ? pickedTasks.delete(t) : pickedTasks.add(t); renderTaskChips(); };
      box.append(b);
    }
  }
  $('#shiftForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('#shiftErr'); err.textContent = '';
    const start = $('#fStart').value, end = $('#fEnd').value;
    if (!start || !end) { err.textContent = '출근·퇴근 시간을 입력하세요.'; return; }
    if (toMin(end) <= toMin(start)) { err.textContent = '퇴근 시간이 출근 시간보다 늦어야 합니다.'; return; }
    const extra = $('#fExtra').value.split(',').map(x => x.trim()).filter(Boolean);
    const tasks = [...TASKS.filter(t => pickedTasks.has(t)), ...extra];
    const memberId = $('#fMember').value;
    if (!isAdmin() && memberId !== state.me.id) { err.textContent = '본인 근무만 등록할 수 있습니다.'; return; }
    const data = {
      week: state.weekKey, day: Number($('#fDay').value), memberId, start, end, tasks,
      note: $('#fNote').value.trim(), updatedBy: state.me.id, updatedAt: new Date().toISOString(),
    };
    const btn = $('#shiftSave'); btn.disabled = true;
    try {
      await store.saveShift(state.editing ? state.editing.id : null, data);
      closeModals(); toast(state.editing ? '수정했습니다' : '등록했습니다');
    } catch (ex) { err.textContent = friendly(ex); }
    btn.disabled = false;
  };
  $('#shiftDelete').onclick = async () => {
    if (!state.editing) return;
    if (!confirm('이 근무를 삭제할까요?')) return;
    try { await store.deleteShift(state.editing.id); closeModals(); toast('삭제했습니다'); }
    catch (ex) { $('#shiftErr').textContent = friendly(ex); }
  };

  $('#addShift').onclick = () => openShift(null, Math.max(0, (new Date().getDay() + 6) % 7));
  $('#copyPrev').onclick = async () => {
    if (!state.me) return openLogin();
    const prevKey = fmt(addDays(parse(state.weekKey), -7));
    let src;
    try { src = await store.getShifts(prevKey); } catch (ex) { toast(friendly(ex)); return; }
    if (!isAdmin()) src = src.filter(s => s.memberId === state.me.id);
    const dup = s => state.shifts.some(x => x.memberId === s.memberId && x.day === s.day && x.start === s.start && x.end === s.end);
    const todo = src.filter(s => !dup(s));
    if (!todo.length) { toast('가져올 근무가 없습니다 (지난주에 없거나 이미 있음)'); return; }
    if (!confirm(`지난주 근무 ${todo.length}건을 이번 주에 복사할까요?`)) return;
    let ok = 0;
    for (const s of todo) {
      try {
        await store.saveShift(null, { week: state.weekKey, day: s.day, memberId: s.memberId, start: s.start, end: s.end, tasks: s.tasks || [], note: s.note || '', updatedBy: state.me.id, updatedAt: new Date().toISOString() });
        ok++;
      } catch (ex) { toast(friendly(ex)); break; }
    }
    toast(`${ok}건 복사했습니다`);
  };

  // ---------- CSV ----------
  $('#exportCsv').onclick = async () => {
    const list = sortedShifts();
    if (!list.length) { toast('내보낼 근무가 없습니다'); return; }
    const mon = parse(state.weekKey);
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['날짜', '요일', '아이디', '선생님', '출근', '퇴근', '시간', '업무', '비고']];
    for (const s of list) rows.push([fmt(addDays(mon, s.day)), DAYS[s.day], s.memberId, memberOf(s.memberId).name, s.start, s.end, fmtH(hoursOf(s)), (s.tasks || []).join(' / '), s.note || '']);
    const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
    const filename = `문제풀이근무표_${state.weekKey}.csv`;
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  // ---------- 로그인 ----------
  function openLogin() {
    $('#lPin').value = ''; $('#loginErr').textContent = '';
    $('#loginModal').classList.add('open'); $('#lId').focus();
  }
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const id = $('#lId').value.trim(), pw = $('#lPin').value;
    if (!id || !pw) return;
    state.loggingIn = true; renderGate();
    try {
      const d = await api('login', { id, pw });
      state.token = d.token; state.me = d.me; session.save({ token: d.token, me: d.me });
      $('#lPin').value = ''; state.loggingIn = false; state.membersLoaded = true;
      loadMembers(d.members); setWeek(state.weekKey); toast(`${d.me.name}님, 들어왔습니다`);
    } catch (ex) {
      state.loggingIn = false; renderGate();
      $('#loginErr').textContent = friendly(ex); $('#lPin').value = ''; $('#lPin').focus();
    }
  };

  // ---------- 아이디 관리 ----------
  let pickedColor = COLORS[0];
  function openMembers() {
    if (!isAdmin()) return;
    renderMemberRows(); resetMemberForm();
    $('#memberModal').classList.add('open');
  }
  function resetMemberForm(editId) {
    state.editingMember = editId || null;
    $('#memberFormTitle').textContent = editId ? `아이디 수정 · ${editId}` : '새 아이디';
    $('#mId').value = editId || ''; $('#mId').disabled = !!editId;
    const m = editId ? state.members.get(editId) : null;
    $('#mName').value = m ? m.name : '';
    $('#mPin').value = ''; $('#mPin').required = !editId;
    $('#mPin').placeholder = editId ? '바꿀 때만 입력' : '';
    $('#mRole').value = m ? (m.role || 'teacher') : 'teacher';
    const used = new Set([...state.members.values()].map(x => x.color));
    pickedColor = m ? m.color : (COLORS.find(c => !used.has(c)) || COLORS[state.members.size % COLORS.length]);
    renderSwatches();
    $('#memberErr').textContent = '';
    $('#memberForm button[type=submit]').textContent = editId ? '저장' : '아이디 만들기';
  }
  function renderSwatches() {
    const box = $('#mColors'); box.innerHTML = '';
    for (const c of COLORS) {
      const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.title = c;
      b.setAttribute('aria-pressed', c === pickedColor); b.onclick = () => { pickedColor = c; renderSwatches(); };
      box.append(b);
    }
  }
  function renderMemberRows() {
    const tb = $('#memberRows'); tb.innerHTML = '';
    const list = [...state.members.values()].sort((a, b) => (a.role === 'admin' ? 0 : 1) - (b.role === 'admin' ? 0 : 1) || a.name.localeCompare(b.name, 'ko'));
    for (const m of list) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><span class="dot" style="background:${m.color || COLORS[0]}"></span></td><td><code class="k">${esc(m.id)}</code></td><td>${esc(m.name)}</td><td><span class="role ${m.role === 'admin' ? 'admin' : ''}">${m.role === 'admin' ? '관리자' : '선생님'}</span></td><td>${m.active === false ? '<span class="muted">비활성</span>' : '사용중'}</td><td style="white-space:nowrap"><button class="btn sm" data-edit>수정</button> <button class="btn sm ghost" data-toggle>${m.active === false ? '다시 활성' : '비활성'}</button></td>`;
      tr.querySelector('[data-edit]').onclick = () => resetMemberForm(m.id);
      tr.querySelector('[data-toggle]').onclick = async () => {
        if (m.id === state.me.id) { toast('자기 자신은 비활성화할 수 없습니다'); return; }
        try { await store.saveMember(m.id, { ...stripId(m), active: m.active === false }); toast('저장했습니다'); }
        catch (ex) { toast(friendly(ex)); }
      };
      tb.append(tr);
    }
  }
  const stripId = m => { const { id, ...rest } = m; return rest; };
  $('#memberForm').onsubmit = async e => {
    e.preventDefault();
    const err = $('#memberErr'); err.textContent = '';
    const id = state.editingMember || $('#mId').value.trim();
    const name = $('#mName').value.trim(), pin = $('#mPin').value, role = $('#mRole').value;
    if (!state.editingMember && state.members.has(id)) { err.textContent = '이미 있는 아이디입니다.'; return; }
    if (pin && pin.length < 4) { err.textContent = '비밀번호는 4자 이상입니다.'; return; }
    const prev = state.editingMember ? stripId(state.members.get(id)) : { active: true, createdAt: new Date().toISOString() };
    if (state.editingMember && id === state.me.id && role !== 'admin') { err.textContent = '자기 자신의 관리자 권한은 뺄 수 없습니다.'; return; }
    const data = { ...prev, name, role, color: pickedColor };
    if (pin) data.pw = pin;
    try {
      await store.saveMember(id, data);
      toast(state.editingMember ? '저장했습니다' : `아이디 ${id} 를 만들었습니다`);
      resetMemberForm();
    } catch (ex) { err.textContent = friendly(ex); }
  };
  $('#manageMembers').onclick = openMembers;

  // ---------- 공통 ----------
  function closeModals() { document.querySelectorAll('.backdrop').forEach(b => b.classList.remove('open')); renderGate(); }
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModals);
  document.querySelectorAll('.backdrop').forEach(b => b.addEventListener('mousedown', e => { if (e.target === b && b.id !== 'loginModal') closeModals(); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
  function friendly(ex) {
    const code = ex && ex.code;
    if (code === 'unauthorized') return '로그인이 풀렸습니다. 다시 로그인하세요.';
    if (code === 'forbidden') return '권한이 없습니다. ' + (ex.message || '');
    return (ex && ex.message) || '요청을 처리하지 못했습니다.';
  }

  // ---------- 주 이동 / 보기 ----------
  function setWeek(key) {
    state.weekKey = key; state.loading = true; state.shifts = [];
    if (state.unsubShifts) state.unsubShifts();
    state.unsubShifts = store.subscribeShifts(key, list => { state.shifts = list; state.loading = false; renderAll(); });
    renderAll();
  }
  $('#prevWeek').onclick = () => setWeek(fmt(addDays(parse(state.weekKey), -7)));
  $('#nextWeek').onclick = () => setWeek(fmt(addDays(parse(state.weekKey), 7)));
  $('#thisWeek').onclick = () => setWeek(fmt(mondayOf(new Date())));
  $('#viewGrid').onclick = () => { state.view = 'grid'; renderHeader(); };
  $('#viewSheet').onclick = () => { state.view = 'sheet'; renderHeader(); };

  function loadMembers(list) {
    state.members = new Map(list.map(m => [m.id, m]));
    if (state.me && state.members.has(state.me.id)) state.me = { ...state.me, ...publicOf(state.members.get(state.me.id)) };
    if ($('#memberModal').classList.contains('open')) renderMemberRows();
    renderAll();
  }
  const publicOf = m => ({ id: m.id, name: m.name, role: m.role });

  // ---------- 시작 ----------
  state.weekKey = fmt(mondayOf(new Date()));
  const saved = session.load();
  if (saved && saved.token && saved.me) { state.token = saved.token; state.me = saved.me; }
  renderAll();

  (async () => {
    if (!state.token || !API_URL) return;
    try {
      const d = await api('me');
      state.me = d.me; session.save({ token: state.token, me: d.me });
      state.membersLoaded = true; loadMembers(d.members); setWeek(state.weekKey);
    } catch (ex) { if (ex.code !== 'unauthorized') toast(friendly(ex)); }
  })();
})();
</script>
</body>
</html>
